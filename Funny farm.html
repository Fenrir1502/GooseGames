      size: 'Длина кода: %n символов',
      empty: 'Пока нечего экспортировать: в этой игре ещё нет сохранённого прогресса.',
      imHint: 'Вставь сюда код сохранения этой игры. Текущий прогресс будет заменён.',
      placeholder: 'Вставь код (он начинается с GGZ1. или GGP1.)',
      paste: '📎 Вставить', load: '📥 Загрузить', undo: '↩️ Вернуть прошлое сохранение',
      confirmQ: 'Заменить текущий прогресс этим сохранением?',

      date: 'Сохранение от', items: 'записей', yes: 'Да, заменить', no: 'Отмена',
      errFormat: 'Это не похоже на код сохранения. Проверь, что скопирован весь код.',
      errBroken: 'Код повреждён или скопирован не полностью.',
      errGame: 'Это сохранение от другой игры (%g).',
      errUnsupported: 'Это устройство не умеет читать такой код. Обнови браузер или WebView и попробуй снова.',
      errStore: 'Не удалось записать сохранение: в хранилище нет места.',
      pasteFail: 'Не получилось вставить автоматически. Нажми в поле и вставь вручную.',
      done: '✓ Готово! Игра перезапускается…'
    },
    en: {
      section: 'Save data', btnExport: '📤 Export', btnImport: '📥 Import',
      exTitle: '📤 Export save', imTitle: '📥 Import save',
      exHint: 'Copy the code and keep it somewhere safe (for example, send it to yourself on Telegram). To restore your progress, open this same game and tap “Import”.',
      exWarn: 'The code holds all your progress, do not post it publicly.',
      copy: '📋 Copy code', copied: '✓ Copied', share: '📨 Share',
      copyFail: 'Could not copy automatically. Tap the code, select all and copy it manually.',
      size: 'Code length: %n characters',
      empty: 'Nothing to export yet: this game has no saved progress.',
      imHint: 'Paste the save code for this game here. Your current progress will be replaced.',
      placeholder: 'Paste the code (it starts with GGZ1. or GGP1.)',
      paste: '📎 Paste', load: '📥 Load', undo: '↩️ Restore previous save',
      confirmQ: 'Replace your current progress with this save?',
      undoQ: 'Restore the save you had before the last import?',
      date: 'Saved on', items: 'entries', yes: 'Yes, replace', no: 'Cancel',
      errFormat: 'This does not look like a save code. Make sure the whole code is copied.',
      errBroken: 'The code is damaged or was not copied completely.',
      errGame: 'This save belongs to another game (%g).',
      errUnsupported: 'This device cannot read this code. Update your browser or WebView and try again.',
      errStore: 'Could not write the save: storage is full.',
      pasteFail: 'Could not paste automatically. Tap the field and paste manually.',
      done: '✓ Done! Restarting the game…'
    }
  };
  function t(k) { var L = S[getLang()] || S.ru; return L[k] !== undefined ? L[k] : S.ru[k]; }

  function noteText() { var n = CFG.note; n = n && (n[getLang()] || n.ru); return n ? ' ' + n : ''; }

  var BKEY = 'ggbackup.' + CFG.game;

  function match(k) { return CFG.keys.indexOf(k) > -1 || (!!CFG.prefix && k.indexOf(CFG.prefix) === 0); }
  function collect() {
    var d = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && match(k)) d[k] = localStorage.getItem(k);
      }
    } catch (e) {}
    return d;
  }
  function sum(d) {
    var s = Object.keys(d).sort().map(function (k) { return k + '\u0000' + d[k]; }).join('\u0001');
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return (h >>> 0).toString(16);
  }

  function toB64(u8) {
    var s = '', n = 0x8000;
    for (var i = 0; i < u8.length; i += n) s += String.fromCharCode.apply(null, u8.subarray(i, i + n));
    return btoa(s);
  }
  function fromB64(b) {
    var s = atob(b), u = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u;
  }
  async function pipe(u8, stream) {
    var w = stream.writable.getWriter();
    w.write(u8).catch(function () {});
    w.close().catch(function () {});
    return new Uint8Array(await new Response(stream.readable).arrayBuffer());
  }
  async function pack(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (typeof CompressionStream === 'function') {
      try { return 'GGZ1.' + toB64(await pipe(bytes, new CompressionStream('deflate'))); } catch (e) {}
    }
    return 'GGP1.' + toB64(bytes);
  }
  async function unpack(raw) {
    var s = String(raw || '');
    if (s.length > 8000000) throw new Error('broken');
    var i = s.search(/GG[ZP]1\./);
    if (i < 0) throw new Error('format');
    s = s.slice(i).replace(/\s+/g, '');
    var m = s.match(/^GG([ZP])1\.([A-Za-z0-9+\/]+={0,2})/);
    if (!m) throw new Error('format');
    var u8;
    try { u8 = fromB64(m[2]); } catch (e) { throw new Error('broken'); }
    if (m[1] === 'Z') {
      if (typeof DecompressionStream !== 'function') throw new Error('nodec');
      try { u8 = await pipe(u8, new DecompressionStream('deflate')); } catch (e) { throw new Error('broken'); }
    }
    var obj;
    try { obj = JSON.parse(new TextDecoder().decode(u8)); } catch (e) { throw new Error('broken'); }
    if (!obj || obj.v !== 1 || !obj.d || typeof obj.d !== 'object') throw new Error('broken');
    if (obj.g !== CFG.game) throw new Error('game:' + obj.g);
    var keys = Object.keys(obj.d);
    if (!keys.length) throw new Error('broken');
    for (var j = 0; j < keys.length; j++) {
      if (!match(keys[j]) || typeof obj.d[keys[j]] !== 'string') throw new Error('broken');
    }
    if (obj.c !== sum(obj.d)) throw new Error('broken');
    return obj;
  }

  function readBackup() {
    try {
      var b = JSON.parse(localStorage.getItem(BKEY));
      if (b && b.d && typeof b.d === 'object' && Object.keys(b.d).length && b.c === sum(b.d)) return b;
    } catch (e) {}
    return null;
  }

  /* Записываем сохранение в localStorage и перезапускаем игру.
     Игра может сама пересохранить старое состояние при выходе, поэтому после записи
     блокируем её записи в хранилище до перезагрузки. */
  function apply(data) {
    var ls = localStorage;
    var _set = Storage.prototype.setItem, _rem = Storage.prototype.removeItem, _clr = Storage.prototype.clear;
    var snap = collect();
    try {
      _set.call(ls, BKEY, JSON.stringify({ t: Date.now(), d: snap, c: sum(snap) }));
      Object.keys(snap).forEach(function (k) { if (!(k in data)) _rem.call(ls, k); });
      Object.keys(data).forEach(function (k) { _set.call(ls, k, data[k]); });
    } catch (e) {
      try { Object.keys(snap).forEach(function (k) { _set.call(ls, k, snap[k]); }); } catch (e2) {}
      throw new Error('store');
    }
    Storage.prototype.setItem = function () {};
    Storage.prototype.removeItem = function () {};
    Storage.prototype.clear = function () {};
    setTimeout(function () { location.reload(); }, 450);
  }

  /* ---------- Окно ---------- */
  var root, ta, actions, msgEl, infoEl, hintEl, titleEl, mode, shown = false;

  function injectCss() {
    var st = document.createElement('style');
    st.textContent =
      '#ggs-root{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483000;--ggs-a:' + CFG.accent + '}' +
      '#ggs-root.ggs-on{display:block}' +
      '#ggs-root .ggs-back{all:unset;position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;box-sizing:border-box;' +
        'background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);' +
        'padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}' +
      '#ggs-root .ggs-card{all:unset;display:block;box-sizing:border-box;width:100%;max-width:420px;max-height:100%;overflow-y:auto;' +
        'background:#161a26;color:#f3f4f8;border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:18px;' +
        'font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-shadow:0 24px 60px rgba(0,0,0,.6)}' +
      '#ggs-root .ggs-head{all:unset;display:flex;align-items:center;justify-content:space-between;gap:10px}' +
      '#ggs-root .ggs-title{all:unset;display:block;font:800 17px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}' +
      '#ggs-root .ggs-x{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;' +
        'background:rgba(255,255,255,.1);color:#fff;font-size:16px;cursor:pointer;flex:none}' +
      '#ggs-root .ggs-hint{all:unset;display:block;margin:10px 0 12px;color:#b9bfd0;font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}' +
      '#ggs-root .ggs-ta{all:unset;display:block;box-sizing:border-box;width:100%;height:120px;overflow:auto;padding:10px;border-radius:12px;' +
        'background:#0d1018;color:#e8ebf5;border:1px solid rgba(255,255,255,.16);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;' +
        'white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text;cursor:text}' +
      '#ggs-root .ggs-info{all:unset;display:block;margin-top:6px;color:#8b93a8;font:12px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}' +
      '#ggs-root .ggs-row{all:unset;display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}' +
      '#ggs-root .ggs-b{all:unset;box-sizing:border-box;flex:1 1 auto;display:flex;align-items:center;justify-content:center;text-align:center;min-height:46px;padding:10px 14px;' +
        'border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font:700 14px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer}' +
      '#ggs-root .ggs-b.ggs-pri{background:var(--ggs-a);color:#10131c}' +
      '#ggs-root .ggs-b:active{opacity:.8}' +
      '#ggs-root .ggs-msg{all:unset;display:block;margin-top:10px;font:600 13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}' +
      '#ggs-root .ggs-msg.ggs-err{color:#ff8a8a}#ggs-root .ggs-msg.ggs-ok{color:#7ee787}#ggs-root .ggs-msg.ggs-warn{color:#ffd37a}';
    document.head.appendChild(st);
  }

  function build() {
    if (root) return;
    injectCss();
    root = document.createElement('div');
    root.id = 'ggs-root';
    root.innerHTML =
      '<div class="ggs-back"><div class="ggs-card" role="dialog" aria-modal="true">' +
      '<div class="ggs-head"><b class="ggs-title"></b><button type="button" class="ggs-x" aria-label="Close">✕</button></div>' +
      '<div class="ggs-hint"></div>' +
      '<textarea class="ggs-ta" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"></textarea>' +
      '<div class="ggs-info"></div>' +
      '<div class="ggs-row"></div>' +
      '<div class="ggs-msg"></div>' +
      '</div></div>';
    document.body.appendChild(root);
    var q = function (c) { return root.querySelector(c); };
    titleEl = q('.ggs-title'); hintEl = q('.ggs-hint'); ta = q('.ggs-ta');
    infoEl = q('.ggs-info'); actions = q('.ggs-row'); msgEl = q('.ggs-msg');
    q('.ggs-x').addEventListener('click', close);
    q('.ggs-back').addEventListener('click', function (e) { if (e.target === e.currentTarget) close(); });
    ['keydown', 'keyup', 'keypress'].forEach(function (ev) {
      root.addEventListener(ev, function (e) { e.stopPropagation(); if (ev === 'keydown' && e.key === 'Escape') close(); });
    });
  }

  function say(text, cls) { msgEl.textContent = text || ''; msgEl.className = 'ggs-msg' + (cls ? ' ggs-' + cls : ''); }
  function addBtn(label, pri, fn) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'ggs-b' + (pri ? ' ggs-pri' : ''); b.textContent = label;
    b.addEventListener('click', fn);
    actions.appendChild(b);
    return b;
  }
  function fmt(ts) {
    try { return new Date(ts).toLocaleString(getLang() === 'ru' ? 'ru-RU' : 'en-GB'); } catch (e) { return ''; }
  }
  function errText(e) {
    var m = String((e && e.message) || e);
    if (m.indexOf('game:') === 0) return t('errGame').replace('%g', m.slice(5));
    var map = { format: 'errFormat', broken: 'errBroken', nodec: 'errUnsupported', store: 'errStore' };
    return t(map[m] || 'errBroken');
  }

  function close() { if (root) root.className = ''; shown = false; }

  async function renderExport() {
    mode = 'export';
    titleEl.textContent = t('exTitle');
    hintEl.textContent = t('exHint') + ' ' + t('exWarn') + noteText();
    ta.readOnly = true; ta.placeholder = ''; ta.value = ''; ta.style.display = 'block';
    actions.innerHTML = ''; infoEl.textContent = ''; say('');
    var d = collect();
    if (!Object.keys(d).length) { ta.style.display = 'none'; say(t('empty'), 'warn'); return; }
    var code = await pack({ v: 1, g: CFG.game, t: Date.now(), c: sum(d), d: d });
    if (mode !== 'export') return;
    ta.value = code;
    infoEl.textContent = t('size').replace('%n', code.length);
    var cb = addBtn(t('copy'), true, function () {
      var ok = false;
      var done = function (r) {
        if (r) { cb.textContent = t('copied'); say(''); } else { say(t('copyFail'), 'warn'); ta.focus(); ta.select(); }
      };
      try {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(code).then(function () { done(true); }, function () { done(legacyCopy()); });
          return;
        }
      } catch (e) {}
      ok = legacyCopy(); done(ok);
    });
    if (navigator.share) {
      addBtn(t('share'), false, function () { navigator.share({ text: code }).catch(function () {}); });
    }
  }
  function legacyCopy() {
    try { ta.focus(); ta.select(); ta.setSelectionRange(0, 1e9); return document.execCommand('copy'); } catch (e) { return false; }
  }

  function renderImport() {
    mode = 'import'; shown = true;
    titleEl.textContent = t('imTitle');
    hintEl.textContent = t('imHint') + noteText();
    ta.readOnly = false; ta.value = ''; ta.placeholder = t('placeholder'); ta.style.display = 'block';
    infoEl.textContent = ''; actions.innerHTML = ''; say('');
    if (navigator.clipboard && navigator.clipboard.readText) {
      addBtn(t('paste'), false, function () {
        navigator.clipboard.readText().then(function (v) { ta.value = v; say(''); }, function () { say(t('pasteFail'), 'warn'); });
      });
    }
    addBtn(t('load'), true, async function () {
      say('');
      try { confirmStep(await unpack(ta.value), t('confirmQ')); } catch (e) { say(errText(e), 'err'); }
    });
    var bk = readBackup();
    if (bk) addBtn(t('undo'), false, function () { confirmStep(bk, t('undoQ')); });
  }

  function confirmStep(obj, question) {
    mode = 'confirm';
    hintEl.textContent = question;
    ta.style.display = 'none';
    infoEl.textContent = (obj.t ? t('date') + ' ' + fmt(obj.t) + ' · ' : '') + Object.keys(obj.d).length + ' ' + t('items');
    actions.innerHTML = ''; say('');
    addBtn(t('yes'), true, function () {
      try {
        apply(obj.d);
        actions.innerHTML = ''; say(t('done'), 'ok');
      } catch (e) { say(errText(e), 'err'); }
    });
    addBtn(t('no'), false, renderImport);
  }

  function open(m) {
    build();
    root.className = 'ggs-on'; shown = true;
    if (m === 'import') renderImport(); else renderExport();
  }

  window.GGSave = { open: open, close: close, t: t };
})();
