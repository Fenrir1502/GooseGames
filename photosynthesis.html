<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Фотосинтез</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; height: 100dvh; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e8f5e8;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
    transition: color 0.4s;
  }

  /* ===== ФОН ===== */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(180deg, #0a1f0a 0%, #122e12 40%, #1c4a1c 100%);
    overflow: hidden;
    transition: background 0.6s, filter 0.6s;
  }
  #bg.pink { background: linear-gradient(180deg, #2a0a1f 0%, #4a1230 40%, #6b1a45 100%); }
  #bg.yellow { background: linear-gradient(180deg, #2a1a05 0%, #4a2e08 40%, #6b4410 100%); }
  #bg.night { filter: brightness(0.55) saturate(0.7); }
  #bg::before {
    content: ''; position: absolute; top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 15%, rgba(140,255,140,0.12) 0%, transparent 55%);
    animation: sunPulse 8s ease-in-out infinite;
    transition: background 0.6s;
  }
  #bg.pink::before { background: radial-gradient(circle at 50% 15%, rgba(255,140,220,0.18) 0%, transparent 55%); }
  #bg.yellow::before { background: radial-gradient(circle at 50% 15%, rgba(255,200,80,0.22) 0%, transparent 55%); }
  @keyframes sunPulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 0.9; transform: scale(1.08); }
  }
  .spore {
    position: absolute; width: 4px; height: 4px;
    background: #aaffaa; border-radius: 50%;
    box-shadow: 0 0 10px #7fff7f; opacity: 0.4;
    animation: floatUpSpore linear infinite;
    transition: background 0.6s, box-shadow 0.6s;
  }
  #bg.pink .spore { background: #ffb0e0; box-shadow: 0 0 10px #ff80d0; }
  #bg.yellow .spore { background: #ffd966; box-shadow: 0 0 10px #ffcc44; }
  @keyframes floatUpSpore {
    0% { transform: translateY(100vh); opacity: 0; }
    10%, 90% { opacity: 0.5; }
    100% { transform: translateY(-10vh) translateX(50px); opacity: 0; }
  }
  #ground {
    position: absolute; bottom: 0; left: 0; right: 0; height: 140px;
    background: linear-gradient(180deg, transparent 0%, #142e14 50%, #081a08 100%);
    pointer-events: none;
    transition: background 0.6s;
  }
  #bg.pink #ground { background: linear-gradient(180deg, transparent 0%, #3a1425 50%, #1a0812 100%); }
  #bg.yellow #ground { background: linear-gradient(180deg, transparent 0%, #3a2505 50%, #1a1002 100%); }

  .screen {
    position: fixed; inset: 0; z-index: 1;
    display: none; opacity: 0;
    transition: opacity 0.25s;
  }
  .screen.active { display: flex; opacity: 1; }

  /* ===== МЕНЮ ===== */
  #screen-menu {
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px;
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
  }
  #screen-menu h1 {
    font-size: 64px; letter-spacing: 8px;
    color: #9fff9f;
    text-shadow: 0 0 30px #7fff7f, 0 0 80px rgba(127,255,127,0.4);
    margin-bottom: 6px;
    animation: titleGlow 4s ease-in-out infinite;
    font-weight: 800;
    transition: color 0.4s, text-shadow 0.4s;
  }
  body.pink #screen-menu h1 { color: #ffb0e0; text-shadow: 0 0 30px #ff80d0, 0 0 80px rgba(255,128,208,0.4); }
  body.yellow #screen-menu h1 { color: #ffd966; text-shadow: 0 0 30px #ffcc44, 0 0 80px rgba(255,204,68,0.4); }
  @keyframes titleGlow {
    0%, 100% { text-shadow: 0 0 30px #7fff7f, 0 0 80px rgba(127,255,127,0.4); }
    50% { text-shadow: 0 0 50px #7fff7f, 0 0 100px rgba(127,255,127,0.7); }
  }
  #screen-menu .subtitle {
    font-size: 14px; color: #8fbf8f; letter-spacing: 4px;
    margin-bottom: 30px; text-transform: uppercase;
    transition: color 0.4s;
  }
  body.pink #screen-menu .subtitle { color: #d88fb8; }
  body.yellow #screen-menu .subtitle { color: #d8b878; }
  #screen-menu .menu-plant {
    font-size: 130px; margin-bottom: 30px;
    animation: menuPlantFloat 4s ease-in-out infinite;
    filter: drop-shadow(0 0 40px #4f4) drop-shadow(0 0 80px rgba(80,255,80,0.4));
    transition: filter 0.4s;
  }
  body.pink #screen-menu .menu-plant { filter: drop-shadow(0 0 40px #ff80d0) drop-shadow(0 0 80px rgba(255,128,208,0.4)); }
  body.yellow #screen-menu .menu-plant { filter: drop-shadow(0 0 40px #ffcc44) drop-shadow(0 0 80px rgba(255,204,68,0.4)); }
  @keyframes menuPlantFloat {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-18px) rotate(3deg); }
  }
  #screen-menu .menu-stats {
    display: flex; gap: 12px; margin-bottom: 28px;
    flex-wrap: wrap; justify-content: center;
  }
  .stat {
    background: rgba(20, 45, 25, 0.7);
    border: 1px solid rgba(120,200,120,0.3);
    border-radius: 12px;
    padding: 10px 18px;
    min-width: 110px;
    backdrop-filter: blur(6px);
    transition: all 0.4s;
  }
  body.pink .stat { background: rgba(45, 20, 35, 0.7); border-color: rgba(255,140,200,0.3); }
  body.yellow .stat { background: rgba(45, 35, 15, 0.7); border-color: rgba(255,200,80,0.3); }
  .stat .label {
    font-size: 10px; color: #8fbf8f;
    text-transform: uppercase; letter-spacing: 2px;
    transition: color 0.4s;
  }
  body.pink .stat .label { color: #d88fb8; }
  body.yellow .stat .label { color: #d8b878; }
  .stat .value {
    font-size: 20px; color: #bfffbf;
    font-weight: bold; margin-top: 4px;
    transition: color 0.4s;
  }
  body.pink .stat .value { color: #ffc8e8; }
  body.yellow .stat .value { color: #ffe4a8; }

  /* ===== КНОПКИ ===== */
  .btn {
    background: linear-gradient(180deg, #3a8a3a 0%, #265a26 100%);
    border: 2px solid #6abb6a;
    color: #fff; padding: 14px 44px;
    border-radius: 12px; cursor: pointer;
    font-size: 18px; font-weight: bold;
    letter-spacing: 3px; text-transform: uppercase;
    transition: all 0.15s;
    box-shadow: 0 5px 0 #173a17, 0 0 25px rgba(80,255,80,0.35);
    -webkit-tap-highlight-color: transparent;
  }
  body.pink .btn {
    background: linear-gradient(180deg, #a83a7a 0%, #6a2550 100%);
    border-color: #d68ab8;
    box-shadow: 0 5px 0 #3a1730, 0 0 25px rgba(255,128,208,0.35);
  }
  body.yellow .btn {
    background: linear-gradient(180deg, #c88a1a 0%, #8a5a08 100%);
    border-color: #e6b84d;
    box-shadow: 0 5px 0 #3a2505, 0 0 25px rgba(255,200,80,0.35);
  }
  .btn:hover {
    background: linear-gradient(180deg, #4aaa4a 0%, #357035 100%);
    transform: translateY(-2px);
    box-shadow: 0 7px 0 #173a17, 0 0 35px rgba(80,255,80,0.6);
  }
  body.pink .btn:hover {
    background: linear-gradient(180deg, #c84a94 0%, #8a3065 100%);
    box-shadow: 0 7px 0 #3a1730, 0 0 35px rgba(255,128,208,0.6);
  }
  body.yellow .btn:hover {
    background: linear-gradient(180deg, #e6a830 0%, #a87010 100%);
    box-shadow: 0 7px 0 #3a2505, 0 0 35px rgba(255,200,80,0.6);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #173a17; }
  .btn.danger {
    background: linear-gradient(180deg, #8a3a3a 0%, #5a2525 100%);
    border-color: #c88; box-shadow: 0 5px 0 #3a1717, 0 0 25px rgba(255,80,80,0.3);
  }

  /* ===== ИГРА ===== */
  #screen-game { flex-direction: column; }
  #game {
    position: relative; z-index: 1; flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 12px;
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
    overflow: hidden;
  }
  #zone-name {
    position: absolute; top: 14px;
    font-size: 16px; letter-spacing: 4px;
    text-transform: uppercase; color: #8fff8f;
    text-shadow: 0 0 20px #7fff7f;
    font-weight: 600;
    transition: color 0.4s, text-shadow 0.4s;
  }
  body.pink #zone-name { color: #ffb0e0; text-shadow: 0 0 20px #ff80d0; }
  body.yellow #zone-name { color: #ffd966; text-shadow: 0 0 20px #ffcc44; }

  /* Левая верхняя колонка: часы + Кира */
  #top-left {
    position: absolute;
    top: 14px; left: 14px;
    z-index: 6;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
  }

  #clock {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    color: #8fff8f;
    text-shadow: 0 0 12px rgba(127,255,127,0.7), 0 1px 2px rgba(0,0,0,0.8);
    padding: 4px 10px;
    background: rgba(10, 30, 15, 0.35);
    border-radius: 8px;
    border: 1px solid rgba(120,200,120,0.2);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
    transition: color 0.4s, text-shadow 0.4s, background 0.4s, border-color 0.4s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  #clock .sun-icon { font-size: 14px; opacity: 0.9; }
  #clock.night {
    color: #a0b8d8;
    text-shadow: 0 0 12px rgba(160,184,216,0.7), 0 1px 2px rgba(0,0,0,0.8);
  }
  body.pink #clock {
    color: #ffb0e0;
    text-shadow: 0 0 12px rgba(255,128,208,0.7), 0 1px 2px rgba(0,0,0,0.8);
    background: rgba(45, 20, 35, 0.35);
    border-color: rgba(255,140,200,0.2);
  }
  body.pink #clock.night {
    color: #d8a0c0;
    text-shadow: 0 0 12px rgba(216,160,192,0.7), 0 1px 2px rgba(0,0,0,0.8);
  }
  body.yellow #clock {
    color: #ffd966;
    text-shadow: 0 0 12px rgba(255,204,68,0.7), 0 1px 2px rgba(0,0,0,0.8);
    background: rgba(45, 35, 15, 0.35);
    border-color: rgba(255,200,80,0.2);
  }
  body.yellow #clock.night {
    color: #d8b878;
    text-shadow: 0 0 12px rgba(216,184,120,0.7), 0 1px 2px rgba(0,0,0,0.8);
  }

  /* Кнопка Киры */
  #kira-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(10, 30, 15, 0.6);
    border: 2px solid rgba(120,200,120,0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    cursor: pointer;
    font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s;
    box-shadow: 0 0 15px rgba(80,255,80,0.3);
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  #kira-btn::after {
    content: '';
    position: absolute;
    top: -2px; right: -2px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #8fff8f;
    border: 1px solid #1a3a1a;
    box-shadow: 0 0 6px #7fff7f;
    animation: kiraDot 2s ease-in-out infinite;
  }
  @keyframes kiraDot {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.3); opacity: 1; }
  }
  body.pink #kira-btn {
    background: rgba(45, 20, 35, 0.6);
    border-color: rgba(255,140,200,0.5);
    box-shadow: 0 0 15px rgba(255,128,208,0.3);
  }
  body.pink #kira-btn::after { background: #ffa8d8; box-shadow: 0 0 6px #ff80d0; }
  body.yellow #kira-btn {
    background: rgba(45, 35, 15, 0.6);
    border-color: rgba(255,200,80,0.5);
    box-shadow: 0 0 15px rgba(255,204,68,0.3);
  }
  body.yellow #kira-btn::after { background: #ffd966; box-shadow: 0 0 6px #ffcc44; }
  #kira-btn:hover { transform: scale(1.1); }
  #kira-btn:active { transform: scale(0.92); }
  #kira-btn.hidden { display: none; }

  /* Облачко Киры */
  #kira-bubble {
    position: absolute;
    top: 14px; left: 70px;
    z-index: 7;
    background: rgba(10, 25, 15, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1.5px solid rgba(120,200,120,0.5);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
    color: #d8f5d8;
    line-height: 1.4;
    max-width: 220px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #kira-bubble::before {
    content: '';
    position: absolute;
    top: 12px; left: -8px;
    width: 0; height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-right: 8px solid rgba(120,200,120,0.5);
  }
  #kira-bubble.show {
    opacity: 1;
    transform: translateY(0);
  }
  body.pink #kira-bubble {
    background: rgba(30, 10, 22, 0.92);
    border-color: rgba(255,140,200,0.5);
    color: #ffe4f4;
  }
  body.pink #kira-bubble::before { border-right-color: rgba(255,140,200,0.5); }
  body.yellow #kira-bubble {
    background: rgba(30, 22, 8, 0.92);
    border-color: rgba(255,200,80,0.5);
    color: #fff4d8;
  }
  body.yellow #kira-bubble::before { border-right-color: rgba(255,200,80,0.5); }

  #plant-switcher {
    position: absolute;
    top: 12px; right: 12px;
    z-index: 5;
    display: flex; gap: 8px;
  }
  .switch-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(10, 30, 15, 0.7);
    border: 2px solid rgba(120,200,120,0.5);
    backdrop-filter: blur(8px);
    cursor: pointer;
    font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s;
    box-shadow: 0 0 20px rgba(80,255,80,0.3);
    -webkit-tap-highlight-color: transparent;
  }
  body.pink .switch-btn {
    background: rgba(45, 20, 35, 0.7);
    border-color: rgba(255,140,200,0.5);
    box-shadow: 0 0 20px rgba(255,128,208,0.3);
  }
  body.yellow .switch-btn {
    background: rgba(45, 35, 15, 0.7);
    border-color: rgba(255,200,80,0.5);
    box-shadow: 0 0 20px rgba(255,200,80,0.3);
  }
  .switch-btn:hover { transform: scale(1.08); box-shadow: 0 0 30px rgba(80,255,80,0.6); }
  body.pink .switch-btn:hover { box-shadow: 0 0 30px rgba(255,128,208,0.6); }
  body.yellow .switch-btn:hover { box-shadow: 0 0 30px rgba(255,200,80,0.6); }
  .switch-btn:active { transform: scale(0.92); }

  #energy-panel {
    display: flex; flex-direction: column; align-items: center;
    background: rgba(10, 30, 15, 0.6);
    border: 1px solid rgba(120,200,120,0.25);
    border-radius: 14px;
    padding: 10px 26px;
    backdrop-filter: blur(8px);
    margin-bottom: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: all 0.4s;
  }
  body.pink #energy-panel { background: rgba(45, 20, 35, 0.6); border-color: rgba(255,140,200,0.25); }
  body.yellow #energy-panel { background: rgba(45, 35, 15, 0.6); border-color: rgba(255,200,80,0.25); }
  #energy {
    font-size: 38px; font-weight: bold; color: #bfffbf;
    text-shadow: 0 0 25px #4f4, 0 2px 6px rgba(0,0,0,0.8);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    transition: color 0.4s, text-shadow 0.4s;
  }
  body.pink #energy { color: #ffc8e8; text-shadow: 0 0 25px #ff80d0, 0 2px 6px rgba(0,0,0,0.8); }
  body.yellow #energy { color: #ffe4a8; text-shadow: 0 0 25px #ffcc44, 0 2px 6px rgba(0,0,0,0.8); }
  #eps {
    font-size: 13px; color: #8fcf8f;
    margin-top: 4px; letter-spacing: 1px;
    transition: color 0.4s;
  }
  body.pink #eps { color: #d88fb8; }
  body.yellow #eps { color: #d8b878; }
  #eps .sun-bonus {
    color: #ffd966;
    font-weight: 700;
    text-shadow: 0 0 8px rgba(255,204,68,0.6);
  }
  #buffs {
    display: flex; gap: 6px; margin-bottom: 12px; min-height: 26px;
    flex-wrap: wrap; justify-content: center;
    max-width: 100%; padding: 0 8px;
  }
  .buff {
    background: linear-gradient(180deg, rgba(90,50,140,0.8), rgba(60,30,100,0.8));
    border: 1px solid #b78fff;
    border-radius: 14px; padding: 3px 10px;
    font-size: 11px; color: #ecdcff;
    animation: buffPulse 1.2s ease-in-out infinite;
  }
  body.pink .buff {
    background: linear-gradient(180deg, rgba(140,50,110,0.8), rgba(100,30,80,0.8));
    border-color: #ff8fd0; color: #ffe4f4;
  }
  body.yellow .buff {
    background: linear-gradient(180deg, rgba(140,110,30,0.8), rgba(100,80,20,0.8));
    border-color: #ffcc66; color: #fff4d8;
  }
  @keyframes buffPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(170,100,255,0.4); }
    50% { box-shadow: 0 0 18px rgba(170,100,255,0.8); }
  }
  #plant {
    font-size: 130px; cursor: pointer; user-select: none;
    transition: transform 0.06s, filter 0.1s;
    filter: drop-shadow(0 0 40px #4f4) drop-shadow(0 0 80px rgba(80,255,80,0.3));
    margin-bottom: 14px;
    animation: plantBreathe 3.5s ease-in-out infinite;
    line-height: 1;
  }
  body.pink #plant { filter: drop-shadow(0 0 40px #ff80d0) drop-shadow(0 0 80px rgba(255,128,208,0.3)); }
  body.yellow #plant { filter: drop-shadow(0 0 40px #ffcc44) drop-shadow(0 0 80px rgba(255,204,68,0.3)); }
  @keyframes plantBreathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  #plant:active {
    transform: scale(0.88) !important;
    filter: drop-shadow(0 0 60px #7fff7f) drop-shadow(0 0 120px rgba(127,255,127,0.6));
  }
  body.pink #plant:active { filter: drop-shadow(0 0 60px #ff80d0) drop-shadow(0 0 120px rgba(255,128,208,0.6)); }
  body.yellow #plant:active { filter: drop-shadow(0 0 60px #ffcc44) drop-shadow(0 0 120px rgba(255,204,68,0.6)); }
  #click-info {
    font-size: 13px; color: #a8d8a8;
    background: rgba(10, 30, 15, 0.6);
    padding: 5px 14px; border-radius: 20px;
    border: 1px solid rgba(120,200,120,0.2);
    transition: all 0.4s;
    text-align: center;
    max-width: 90%;
  }
  body.pink #click-info { color: #d8a8c8; background: rgba(45, 20, 35, 0.6); border-color: rgba(255,140,200,0.2); }
  body.yellow #click-info { color: #d8c8a8; background: rgba(45, 35, 15, 0.6); border-color: rgba(255,200,80,0.2); }

  /* ===== МАГАЗИНЫ ===== */
  #screen-shop, #screen-boost-shop {
    flex-direction: column;
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
  }
  .shop-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid rgba(120,200,120,0.15);
    flex-shrink: 0;
    background: rgba(5, 15, 8, 0.85);
    backdrop-filter: blur(10px);
    z-index: 2;
    transition: background 0.4s, border-color 0.4s;
  }
  body.pink .shop-header { background: rgba(25, 8, 20, 0.85); border-bottom-color: rgba(255,140,200,0.15); }
  body.yellow .shop-header { background: rgba(25, 18, 5, 0.85); border-bottom-color: rgba(255,200,80,0.15); }
  .shop-header h2 {
    color: #9fff9f; font-size: 16px;
    letter-spacing: 4px; text-transform: uppercase;
    font-weight: 600;
    transition: color 0.4s;
  }
  body.pink .shop-header h2 { color: #ffb0e0; }
  body.yellow .shop-header h2 { color: #ffd966; }
  .shop-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 20px;
    -webkit-overflow-scrolling: touch;
  }
  .shop-scroll::-webkit-scrollbar { width: 6px; }
  .shop-scroll::-webkit-scrollbar-thumb { background: rgba(120,200,120,0.3); border-radius: 3px; }
  #zone-filter { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  #zone-filter button {
    flex: 1; min-width: 44px; padding: 8px 6px;
    background: rgba(25,50,30,0.5);
    border: 1px solid rgba(120,200,120,0.2);
    color: #8fb88f; border-radius: 8px;
    cursor: pointer; font-size: 15px;
    transition: all 0.15s;
  }

<script>
// ============================================================
// РАСЫ + МИГРАЦИЯ
// ============================================================
const PLANT_RACES = {

    themeIcon: '🌱', menuPlant: '🌱',
    plants: ['🌱', '🌿', '🪴', '🌳', '🌲', '🎋', '🌴', '🌵'],
    shopIcon: '🌿',
  },
  pink: {
    id: 'pink', name: 'Розовое', color: '#ffb0e0', bgClass: 'pink',
    themeIcon: '🌸', menuPlant: '🌸',
    plants: ['🌸', '🌺', '🌷', '🌹', '🏵️', '💮', '🌼', '🪷'],
    shopIcon: '💮',
  },
  yellow: {
    id: 'yellow', name: 'Солнечное', color: '#ffd966', bgClass: 'yellow',
    themeIcon: '🌻', menuPlant: '🌻',
    plants: ['🌻', '🌼', '🍁', '🌾', '🍄', '🌻', '🌾', '🍄‍🟫'],
    shopIcon: '🌾',
  },
};

const RACE_SAVE_KEYS = {
  green: [
    'photosynthesis_save_v13_green',
    'photosynthesis_save_v12_green',
    'photosynthesis_save_v11_green',
    'photosynthesis_save_v10_green',
    'photosynthesis_save_v9_green',
  ],
  pink: [
    'photosynthesis_save_v13_pink',
    'photosynthesis_save_v12_pink',
    'photosynthesis_save_v11_pink',
    'photosynthesis_save_v10_pink',
    'photosynthesis_save_v9_pink',
  ],
  yellow: [
    'photosynthesis_save_v13_yellow',
    'photosynthesis_save_v12_yellow',
    'photosynthesis_save_v11_yellow',
    'photosynthesis_save_v10_yellow',
    'photosynthesis_save_v9_yellow',
  ],
};

const RACE_ORDER = ['green', 'pink', 'yellow'];
const SETTINGS_KEY = 'photosynthesis_settings_v1';
const ACTIVE_KEY = 'photosynthesis_active';
const KIRA_KEY = 'photosynthesis_kira_visible';
const DEV_CODE = 'GGGG1502';

// Глобальное игровое время: 1 секунда реального = 1 игровая минута.
// Стартовая точка: 08:00. gameMinutes — сколько игровых минут прошло.
const GAME_START_MINUTES = 8 * 60; // 08:00

let activePlant = 'green';
let currentScreen = 'menu';
let settings = { volume: 0.5, musicVolume: 0.5 };
let kiraVisible = true;
let gameMinutes = GAME_START_MINUTES;

let plantsData = { green: createDefaultState(), pink: createDefaultState(), yellow: createDefaultState() };

let state = plantsData[activePlant];
let activeBuffs = [];
let activeCooldowns = {};

let goldenLeafTimeout = null;
let goldenLeafHideTimeout = null;
let goldenLeafVisible = false;

// Кира: состояние
let kiraBubbleTimeout = null;
let kiraLastMsgAt = 0; // чтобы не спамить

function createDefaultState() {
  return {
    energy: 0, totalEarned: 0, totalClicks: 0,
    bought: {}, path: null, permanentBoosts: {},
    startedAt: Date.now(), lastSaveAt: Date.now(),
    totalGoldenLeaves: 0, bestEnergy: 0,
    activeBuffs: [], activeCooldowns: {},
  };
}

// ============================================================
// ИГРОВОЕ ВРЕМЯ
// ============================================================
function getGameHour() {
  const total = gameMinutes % (24 * 60);
  return Math.floor(total / 60);
}

function getGameHourString() {
  const total = gameMinutes % (24 * 60);
  const h = Math.floor(total / 60);
  const m = total % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}

function isDaytime() {
  const h = getGameHour();
  return h >= 6 && h < 18;
}

function getDayBonus() {
  return isDaytime() ? 1.5 : 1.0;
}

// ============================================================
// АУДИО
// ============================================================
const AudioSys = {
  ctx: null, masterGain: null, musicGain: null,
  musicTimer: null, musicPlaying: false,
  volume: 0.5, musicVolume: 0.5,

  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = this.volume;
      this.masterGain.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = this.musicVolume;
      this.musicGain.connect(this.masterGain);
    } catch (e) { console.warn('Аудио недоступно', e); }
  },

  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },

  softTone(freq, duration, type = 'sine', gainValue = 0.12, attackMs = 60, target = null) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const attack = attackMs / 1000;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(gainValue, now + attack);
    gain.gain.linearRampToValueAtTime(gainValue * 0.7, now + duration * 0.5);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(target || this.masterGain);
    osc.start(now);
    osc.stop(now + duration);
  },

  tone(freq, duration, type = 'sine', gainValue = 0.15, sweepTo = null) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (sweepTo !== null) osc.frequency.exponentialRampToValueAtTime(sweepTo, now + duration);
    gain.gain.setValueAtTime(gainValue, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start(now);
    osc.stop(now + duration);
  },

  click() { this.tone(480 + Math.random() * 80, 0.07, 'sine', 0.07, 380); },
  crit() { this.tone(880, 0.15, 'triangle', 0.12, 440); },

  purchase(rarity = 'common') {
    const notes = {
      common: [523, 659], rare: [523, 659, 784],
      epic: [587, 740, 880], legendary: [659, 784, 988],
    }[rarity] || [523, 659];
    notes.forEach((f, i) => setTimeout(() => this.softTone(f, 0.5, 'sine', 0.14, 30), i * 90));
  },

  error() { this.tone(200, 0.15, 'sine', 0.08, 150); },
  golden() { [659, 784, 988, 1175].forEach((f, i) => setTimeout(() => this.softTone(f, 0.6, 'sine', 0.15, 20), i * 80)); },
  buff() { this.softTone(523, 0.6, 'sine', 0.12, 80); setTimeout(() => this.softTone(784, 0.6, 'sine', 0.12, 80), 120); },
  navigate() { this.tone(480, 0.08, 'sine', 0.05, 620); },
  devCode() { [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => this.softTone(f, 0.7, 'triangle', 0.2, 30), i * 100)); },
  kira() { this.softTone(659, 0.3, 'sine', 0.08, 40); setTimeout(() => this.softTone(880, 0.3, 'sine', 0.08, 40), 100); },

  startMusic() {
    if (!this.ctx || this.musicPlaying) return;
    this.musicPlaying = true;
    const melody = [
      { f: 261.63, d: 900 }, { f: 329.63, d: 900 }, { f: 392.00, d: 1000 },
      { f: 440.00, d: 900 }, { f: 392.00, d: 1000 }, { f: 329.63, d: 900 },
      { f: 293.66, d: 900 }, { f: 261.63, d: 1400 },
    ];
    const bassNotes = [{ f: 65.41, when: 0 }, { f: 87.31, when: 2700 }, { f: 98.00, when: 5400 }, { f: 65.41, when: 7800 }];
    let idx = 0, totalElapsed = 0, bassIdx = 0;

    const playNote = () => {
      if (!this.musicPlaying) return;
      const note = melody[idx];
      this.softTone(note.f, note.d / 1000 * 1.8, 'sine', 0.08, 60, this.musicGain);
      this.softTone(note.f * 2, note.d / 1000 * 1.2, 'sine', 0.03, 100, this.musicGain);
      if (bassIdx < bassNotes.length && totalElapsed >= bassNotes[bassIdx].when) {
        this.softTone(bassNotes[bassIdx].f, 3.5, 'sine', 0.055, 200, this.musicGain);
        bassIdx++;
      }
      totalElapsed += note.d; idx++;
      if (idx >= melody.length) { idx = 0; totalElapsed = 0; bassIdx = 0; }
      this.musicTimer = setTimeout(playNote, note.d);
    };
    playNote();
  },

  stopMusic() { this.musicPlaying = false; clearTimeout(this.musicTimer); },
  setVolume(v) { this.volume = v; if (this.masterGain) this.masterGain.gain.value = v; },
  setMusicVolume(v) { this.musicVolume = v; if (this.musicGain) this.musicGain.gain.value = v; },
};

function saveRace(raceId) {
  try {
    const data = plantsData[raceId];
    data.lastSaveAt = Date.now();
    if (data.energy > data.bestEnergy) data.bestEnergy = data.energy;
    data.activeBuffs = activeBuffs;
    data.activeCooldowns = activeCooldowns;
    localStorage.setItem(RACE_SAVE_KEYS[raceId][0], JSON.stringify(data));
  } catch (e) {}
}

function saveAll() {
  saveRace('green'); saveRace('pink'); saveRace('yellow');
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    localStorage.setItem(ACTIVE_KEY, activePlant);
    localStorage.setItem(KIRA_KEY, kiraVisible ? '1' : '0');
    localStorage.setItem('photosynthesis_game_minutes', String(gameMinutes));
    const ind = document.getElementById('save-indicator');
    ind.classList.add('show');
    clearTimeout(saveAll._t);
    saveAll._t = setTimeout(() => ind.classList.remove('show'), 1200);
  } catch (e) {}
}

function loadRace(raceId) {
  const keys = RACE_SAVE_KEYS[raceId];
  if (!keys) return createDefaultState();

  let raw = null, usedKey = null;
  for (const key of keys) {
    try {
      const data = localStorage.getItem(key);
      if (data) { raw = data; usedKey = key; break; }
    } catch (e) {}
  }
  if (!raw) return createDefaultState();

  try {
    const data = JSON.parse(raw);
    const knownIds = new Set(UPGRADES.map(u => u.id));
    const bought = {};
    if (data.bought && typeof data.bought === 'object') {
      for (const [id, n] of Object.entries(data.bought)) {
        if (knownIds.has(id) && Number.isFinite(n) && n > 0) {
          const def = UPGRADES.find(u => u.id === id);
          bought[id] = def ? Math.min(Math.floor(n), def.max) : Math.floor(n);
        }
      }
    }
    let path = null;
    if (typeof data.path === 'string' && PATHS[data.path]) path = data.path;

    const permanentBoosts = {};
    if (data.permanentBoosts && typeof data.permanentBoosts === 'object') {
      for (const [id, val] of Object.entries(data.permanentBoosts)) {
        if (BOOSTS.some(b => b.id === id && b.type === 'permanent') && val) permanentBoosts[id] = true;
      }
    }

    const loaded = {
      energy: Number.isFinite(data.energy) && data.energy >= 0 ? data.energy : 0,
      totalEarned: Number.isFinite(data.totalEarned) && data.totalEarned >= 0 ? data.totalEarned : 0,
      totalClicks: Number.isFinite(data.totalClicks) && data.totalClicks >= 0 ? data.totalClicks : 0,
      bought, path, permanentBoosts,
      startedAt: Number.isFinite(data.startedAt) ? data.startedAt : Date.now(),
      lastSaveAt: Number.isFinite(data.lastSaveAt) ? data.lastSaveAt : Date.now(),
      totalGoldenLeaves: Number.isFinite(data.totalGoldenLeaves) ? data.totalGoldenLeaves : 0,
      bestEnergy: Number.isFinite(data.bestEnergy) ? data.bestEnergy : 0,
      activeBuffs: [], activeCooldowns: {},
    };

    if (data.activeCooldowns && typeof data.activeCooldowns === 'object') {
      const now = Date.now();
      for (const [id, ts] of Object.entries(data.activeCooldowns)) {
        if (ACTIVES.some(a => a.id === id) && Number.isFinite(ts) && ts > now) loaded.activeCooldowns[id] = ts;
      }
    }

    if (usedKey !== keys[0]) {
      console.log(`[Миграция] ${raceId}: ${usedKey} → ${keys[0]}`);
      try {
        localStorage.setItem(keys[0], JSON.stringify({ ...loaded, lastSaveAt: Date.now() }));
      } catch (e) {}
    }

    return loaded;
  } catch (e) {
    console.warn('Ошибка загрузки', e);
    return createDefaultState();
  }
}

function load() {
  try {
    const rawS = localStorage.getItem(SETTINGS_KEY);
    if (rawS) {
      const d = JSON.parse(rawS);
      settings.volume = Number.isFinite(d.volume) ? Math.max(0, Math.min(1, d.volume)) : 0.5;
      settings.musicVolume = Number.isFinite(d.musicVolume) ? Math.max(0, Math.min(1, d.musicVolume)) : 0.5;
    }
  } catch (e) {}
  try {
    const act = localStorage.getItem(ACTIVE_KEY);
    if (RACE_ORDER.includes(act)) activePlant = act;
    const kira = localStorage.getItem(KIRA_KEY);
    if (kira === '0') kiraVisible = false;
    const gm = parseInt(localStorage.getItem('photosynthesis_game_minutes'));
    if (Number.isFinite(gm) && gm >= 0) gameMinutes = gm;
  } catch (e) {}

  plantsData.green = loadRace('green');
  plantsData.pink = loadRace('pink');
  plantsData.yellow = loadRace('yellow');
  state = plantsData[activePlant];
  activeBuffs = state.activeBuffs || [];
  activeCooldowns = state.activeCooldowns || {};

  const now = Date.now();
  for (const raceId of RACE_ORDER) {
    const r = plantsData[raceId];
    const elapsed = Math.min(now - r.lastSaveAt, 2 * 3600 * 1000);
    if (elapsed > 5000) {
      const savedState = state, savedBuffs = activeBuffs, savedCD = activeCooldowns;
      state = r; activeBuffs = []; activeCooldowns = {};
      const offlineEPS = getEPS();
      state = savedState; activeBuffs = savedBuffs; activeCooldowns = savedCD;
      const offlineGain = offlineEPS * (elapsed / 1000);
      if (offlineGain > 0) {
        r.energy += offlineGain; r.totalEarned += offlineGain;
      }
    }
  }
}

function cleanBuffs() {
  const now = Date.now();
  if (activeBuffs.length) activeBuffs = activeBuffs.filter(b => b.expiresAt > now);
}

function getPathMults() {
  if (!state.path || !PATHS[state.path]) return { eps: 1, click: 1 };
  const p = PATHS[state.path];
  return { eps: p.epsMult, click: p.clickMult };
}

function getPermanentMult(type) {
  let m = 1;
  for (const b of BOOSTS) {
    if (b.type !== 'permanent' || !state.permanentBoosts[b.id]) continue;
    if (type === 'eps' && b.permanent.epsBonus) m += b.permanent.epsBonus;
    if (type === 'click' && b.permanent.clickBonus) m += b.permanent.clickBonus;
    if (type === 'global' && b.permanent.globalBonus) m += b.permanent.globalBonus;
  }
  return m;
}

function getPermanentCritBonus() {
  let c = 0;
  for (const b of BOOSTS) {
    if (b.type !== 'permanent' || !state.permanentBoosts[b.id]) continue;
    if (b.permanent.critBonus) c += b.permanent.critBonus;
  }
  return c;
}

function getGlobalMult() {
  let m = 1;
  for (const u of UPGRADES) if (u.globalMult && (state.bought[u.id] || 0) > 0) m *= Math.pow(u.globalMult, (state.bought[u.id] || 0));
  for (const b of activeBuffs) if (b.effect.type === 'global') m *= b.effect.mult;
  m *= getPermanentMult('global');
  return m;
}

function getZoneBoost(zoneId) {
  let m = 1;
  for (const u of UPGRADES) {
    if (u.zoneBoost && u.zoneBoost.zone === zoneId && (state.bought[u.id] || 0) > 0) m *= Math.pow(u.zoneBoost.mult, (state.bought[u.id] || 0));
  }
  return m;
}

function getSynergyBonus(upgrade) {
  if (!upgrade.synergy) return 0;
  return (state.bought[upgrade.synergy.with] || 0) > 0 ? upgrade.synergy.bonus : 0;
}

function getBaseEPS() {
  let base = 0;
  for (const u of UPGRADES) {
    if (u.eps) {
      const count = state.bought[u.id] || 0;
      if (count > 0) base += u.eps * count * getZoneBoost(u.zone) * (1 + getSynergyBonus(u));
    }
  }
  return base;
}

function getEpsMultFromUpgrades() {
  let m = 1;
  for (const u of UPGRADES) {
    if (u.epsMult && (state.bought[u.id] || 0) > 0) m *= Math.pow(u.epsMult, (state.bought[u.id] || 0));
  }
  return m;
}

function getEPS() {
  cleanBuffs();
  let eps = getBaseEPS() * getGlobalMult() * getPathMults().eps * getPermanentMult('eps') * getEpsMultFromUpgrades();
  for (const b of activeBuffs) if (b.effect.type === 'eps') eps *= b.effect.mult;
  eps *= getDayBonus();
  return eps;
}

function getClickFlat() {
  let flat = 0;
  for (const u of UPGRADES) if (u.clickFlat) flat += u.clickFlat * (state.bought[u.id] || 0);
  return flat;
}

function getClickMult() {
  let m = 1;
  for (const u of UPGRADES) if (u.clickMult && (state.bought[u.id] || 0) > 0) m *= Math.pow(u.clickMult, (state.bought[u.id] || 0));
  return m;
}

function getClickPower() {
  cleanBuffs();
  let power = (1 + getClickFlat()) * getClickMult() * getGlobalMult() * getPathMults().click * getPermanentMult('click');
  for (const b of activeBuffs) if (b.effect.type === 'click') power *= b.effect.mult;
  return power;
}

function getCritChance() {
  let c = getPermanentCritBonus();
  for (const u of UPGRADES) if (u.critChance) c += u.critChance * (state.bought[u.id] || 0);
  return Math.min(1, c);
}

function getAutoClickRate() {
  let rate = 0, mult = 1;
  for (const u of UPGRADES) {
    if (u.autoClick) rate += u.autoClick * (state.bought[u.id] || 0);
    if (u.autoClickMult && (state.bought[u.id] || 0) > 0) mult *= Math.pow(u.autoClickMult, (state.bought[u.id] || 0));
  }
  return rate * mult;
}

function getUpgradeCost(u) {
  const count = state.bought[u.id] || 0;
  if (count >= u.max) return null;
  return Math.ceil(u.cost * Math.pow(1.15, count));
}

function getZone() {
  let zone = 0;
  for (let i = ZONES.length - 1; i >= 0; i--) {
    if (state.totalEarned >= ZONES[i].threshold) { zone = i; break; }
  }
  return zone;
}

function formatNum(n) {
  if (!Number.isFinite(n)) return '0';
  if (n < 0) return '-' + formatNum(-n);
  if (n < 1000) {
    if (n === 0) return '0';
    if (n < 10) return n.toFixed(1).replace(/\.0$/, '');
    return Math.floor(n).toString();
  }
  if (n < 1e6) return (n / 1e3).toFixed(2) + 'K';
  if (n < 1e9) return (n / 1e6).toFixed(2) + 'M';
  if (n < 1e12) return (n / 1e9).toFixed(2) + 'B';
  if (n < 1e15) return (n / 1e12).toFixed(2) + 'T';
  return (n / 1e15).toFixed(2) + 'Qa';
}

function switchPlant(newRace) {
  if (activePlant === newRace || !RACE_ORDER.includes(newRace)) return;
  saveRace(activePlant);
  activePlant = newRace;
  state = plantsData[activePlant];
  activeBuffs = state.activeBuffs || [];
  activeCooldowns = state.activeCooldowns || {};
  applyTheme();
  updatePlantSwitcher();
  lastRenderedZone = -1;
  buildShop();
  buildSpecialization();
  renderUI();
  renderBoostShop();
  updateMenuStats();
  hideGoldenLeaf();
  if (currentScreen === 'game') scheduleGoldenLeaf();
  AudioSys.buff();
  saveAll();
}

function applyTheme() {
  const race = PLANT_RACES[activePlant];
  const bg = document.getElementById('bg');
  document.body.classList.remove('pink', 'yellow');
  bg.classList.remove('pink', 'yellow');
  if (race.bgClass) {
    bg.classList.add(race.bgClass);
    document.body.classList.add(race.bgClass);
  }
  const gameBtn = document.querySelector('.nav-btn[data-screen="game"] .icon');
  if (gameBtn) gameBtn.textContent = race.themeIcon;
  const shopBtn = document.querySelector('.nav-btn[data-screen="shop"] .icon');
  if (shopBtn) shopBtn.textContent = race.shopIcon;
}

function updatePlantSwitcher() {
  const switcher = document.getElementById('plant-switcher');
  switcher.innerHTML = '';
  for (const raceId of RACE_ORDER) {
    if (raceId === activePlant) continue;
    const race = PLANT_RACES[raceId];
    const btn = document.createElement('button');
    btn.className = 'switch-btn';
    btn.textContent = race.themeIcon;
    btn.title = 'Перейти на ' + race.name.toLowerCase() + ' растение';
    btn.addEventListener('click', () => switchPlant(raceId));
    switcher.appendChild(btn);
  }
}

let lastClockStr = '';

function updateClock() {
  const str = getGameHourString();
  if (str !== lastClockStr) {
    const el = document.getElementById('clock-time');
    if (el) el.textContent = str;
    lastClockStr = str;

    const sunIcon = document.querySelector('#clock .sun-icon');
    if (sunIcon) sunIcon.textContent = isDaytime() ? '☀️' : '🌙';

    const bg = document.getElementById('bg');
    const clock = document.getElementById('clock');
    if (isDaytime()) {
      bg.classList.remove('night');
      clock.classList.remove('night');
    } else {
      bg.classList.add('night');
      clock.classList.add('night');
    }
  }
}

function showScreen(name) {
  if (currentScreen === name) return;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById('screen-' + name);
  if (target) target.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.screen === name));
  currentScreen = name;
  if (name === 'game') scheduleGoldenLeaf();
  else { hideGoldenLeaf(); clearTimeout(goldenLeafTimeout); }
  if (name === 'menu') updateMenuStats();
  if (name === 'boost-shop') renderBoostShop();
  AudioSys.navigate();
}

function updateMenuStats() {
  document.getElementById('menu-energy').textContent = formatNum(state.energy);
  document.getElementById('menu-best').textContent = formatNum(state.bestEnergy);
  document.getElementById('menu-zone').textContent = ZONES[getZone()].name;
  const menuPlant = document.querySelector('#screen-menu .menu-plant');
  if (menuPlant) menuPlant.textContent = PLANT_RACES[activePlant].menuPlant;
}

const els = {};
let shopCards = {};
let lastRenderedZone = -1;
let lastClickInfo = '';
let currentFilter = -1;
let activesPanel = null;
let activeButtons = {};
let categoryHeaders = {};

function cacheElements() {
  els.zoneName = document.getElementById('zone-name');
  els.energy = document.getElementById('energy');
  els.eps = document.getElementById('eps');
  els.plant = document.getElementById('plant');
  els.clickInfo = document.getElementById('click-info');
  els.upgradeList = document.getElementById('upgrade-list');
  els.zoneFilter = document.getElementById('zone-filter');
  els.specialization = document.getElementById('specialization');
  els.activesMount = document.getElementById('actives-mount');
  els.buffs = document.getElementById('buffs');
}

function buildShop() {
  els.upgradeList.innerHTML = '';
  shopCards = {};
  categoryHeaders = {};

  const byCategory = {};
  for (const u of UPGRADES) {
    const cat = u.category || 'eps';
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(u);
  }

  const sortedCats = Object.keys(byCategory).sort((a, b) => (CATEGORIES[a]?.order || 99) - (CATEGORIES[b]?.order || 99));

  for (const catId of sortedCats) {
    const cat = CATEGORIES[catId];
    const header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML = `<span>${cat.name}</span><span class="cat-count"></span>`;
    els.upgradeList.appendChild(header);
    categoryHeaders[catId] = { el: header, countEl: header.querySelector('.cat-count') };

    for (const u of byCategory[catId]) {
      const div = document.createElement('div');
      div.className = 'upgrade rarity-' + u.rarity;
      div.innerHTML = `
        <div class="icon-box">${u.icon || ''}<span class="qty"></span></div>
        <div class="content">
          <div class="name-row">
            <span class="name"></span>
            <span class="stars">${RARITIES[u.rarity]?.stars || ''}</span>
          </div>
          <div class="effect-badge"></div>
          <div class="hint"></div>
          <div class="bottom-row">
            <span class="cost"></span>
            <div class="progress"><div class="progress-bar"></div></div>
          </div>
        </div>
      `;
      div.addEventListener('click', () => {
        if (div.classList.contains('locked') || div.classList.contains('bought')) return;
        buyUpgrade(u);
      });
      els.upgradeList.appendChild(div);
      shopCards[u.id] = {
        el: div, qty: div.querySelector('.qty'),
        name: div.querySelector('.name'),
        effectBadge: div.querySelector('.effect-badge'),
        hint: div.querySelector('.hint'),
        cost: div.querySelector('.cost'),
        progressBar: div.querySelector('.progress-bar'),
        lastKey: null,
      };
    }
  }
}

function buildSpecialization() {
  const zone = getZone();
  const unlocked = zone >= 1;
  let html = '<h3>🌳 Путь развития</h3><div class="paths">';
  for (const p of Object.values(PATHS)) {
    const chosen = state.path === p.id;
    const locked = !unlocked;
    html += `<div class="path ${chosen ? 'chosen' : ''} ${locked ? 'locked' : ''}" data-path="${p.id}" title="${p.desc}">
      <span class="icon">${p.icon}</span><div>${p.name}</div><div class="bonus">${p.desc}</div></div>`;
  }
  html += '</div>';
  els.specialization.innerHTML = html;

  els.specialization.querySelectorAll('.path').forEach(el => {
    el.addEventListener('click', () => {
      if (!unlocked) { AudioSys.error(); return; }
      const pathId = el.dataset.path;
      if (state.path === pathId) return;
      if (state.path) {
        showConfirm('Сменить путь развития? Текущий путь будет потерян.', () => {
          state.path = pathId;
          activeBuffs = []; activeCooldowns = {};
          buildSpecialization(); renderUI(); saveRace(activePlant); saveAll();
          AudioSys.purchase('epic');
        });
      } else {
        state.path = pathId;
        buildSpecialization(); renderUI(); saveRace(activePlant); saveAll();
        AudioSys.purchase('epic');
      }
    });
  });
}

function buildZoneFilter() {
  els.zoneFilter.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.textContent = '🌍';
  allBtn.title = 'Все';
  allBtn.className = 'active';
  allBtn.onclick = () => { currentFilter = -1; updateZoneFilter(); updateShop(); AudioSys.click(); };
  els.zoneFilter.appendChild(allBtn);

  for (let i = 0; i < ZONES.length; i++) {
    const btn = document.createElement('button');
    btn.textContent = ZONES[i].icon;
    btn.title = ZONES[i].name;
    btn.dataset.zone = i;
    btn.onclick = () => {
      if (parseInt(btn.dataset.zone) > getZone()) { AudioSys.error(); return; }
      currentFilter = i; updateZoneFilter(); updateShop(); AudioSys.click();
    };
    els.zoneFilter.appendChild(btn);
  }
}

function updateZoneFilter() {
  const btns = els.zoneFilter.querySelectorAll('button');
  const zone = getZone();
  btns.forEach((btn, idx) => {
    if (idx === 0) {
      btn.classList.toggle('active', currentFilter === -1);
      btn.classList.remove('locked');
    } else {
      const z = idx - 1;
      btn.classList.toggle('active', currentFilter === z);
      btn.classList.toggle('locked', z > zone);
    }
  });
}

function updateShop() {
  if (!els.upgradeList) return;
  const zone = getZone();
  const filterZone = currentFilter === -1 ? null : currentFilter;
  const catStats = {};
  for (const catId in categoryHeaders) catStats[catId] = { visible: 0, bought: 0 };

  for (const u of UPGRADES) {
    const card = shopCards[u.id];
    if (!card) continue;

    const count = state.bought[u.id] || 0;
    const cost = getUpgradeCost(u);
    const isLocked = u.zone > zone;
    const isBought = cost === null;
    const affordable = !isLocked && !isBought && state.energy >= cost;

    let visible;
    if (filterZone !== null) visible = u.zone === filterZone;
    else visible = u.zone <= zone;

    if (!visible) {
      if (card.el.style.display !== 'none') card.el.style.display = 'none';
      continue;
    }
    if (card.el.style.display === 'none') card.el.style.display = '';
    catStats[u.category].visible++;
    if (count > 0) catStats[u.category].bought++;

    const synBonus = getSynergyBonus(u);
    const synActive = synBonus > 0;
    const progress = isBought ? 100 : isLocked ? 0 : Math.min(100, (state.energy / cost) * 100);

    const key = `${count}|${isLocked}|${isBought}|${affordable}|${cost}|${Math.floor(progress)}|${synActive}`;
    if (card.lastKey === key) continue;
    card.lastKey = key;

    card.qty.textContent = count > 0 ? count : '';
    card.qty.style.display = count > 0 ? '' : 'none';
    card.name.textContent = u.name;
    card.effectBadge.textContent = u.effectTag || '';

    if (u.synergy) {
      const other = UPGRADES.find(x => x.id === u.synergy.with);
      const otherName = other?.name || u.synergy.with;
      if (synActive) {
        card.hint.className = 'hint synergy-active';
        card.hint.textContent = `✨ Синергия: +${Math.round(synBonus * 100)}% (${otherName})`;
      } else {
        card.hint.className = 'hint synergy-hint';
        card.hint.textContent = `🔗 Купи «${otherName}» → +${Math.round(u.synergy.bonus * 100)}%`;
      }
    } else {
      card.hint.className = 'hint';
      card.hint.textContent = u.hint || '';
    }

    if (isBought) card.cost.textContent = '✅ МАКС';
    else if (isLocked) card.cost.textContent = '🔒 ' + formatNum(u.cost);
    else card.cost.textContent = formatNum(cost) + ' ⚡';
    card.progressBar.style.width = progress + '%';

    card.el.classList.toggle('locked', isLocked);
    card.el.classList.toggle('bought', isBought);
    card.el.classList.toggle('affordable', affordable);
    card.el.classList.toggle('unaffordable', !affordable && !isLocked && !isBought);
  }

  for (const catId in categoryHeaders) {
    const h = categoryHeaders[catId];
    h.el.style.display = catStats[catId].visible > 0 ? '' : 'none';
    h.countEl.textContent = catStats[catId].bought + '/' + catStats[catId].visible;
  }
  updateZoneFilter();
}

function renderBuffs() {
  cleanBuffs();
  let html = '';
  const now = Date.now();
  for (const b of activeBuffs) {
    const left = Math.max(0, Math.ceil((b.expiresAt - now) / 1000));
    const def = ACTIVES.find(a => a.id === b.id);
    const boostDef = BOOSTS.find(a => a.id === b.id);
    const icon = def ? def.icon : (boostDef ? boostDef.icon : (b.id.startsWith('golden') ? '🌟' : '✨'));
    const name = def ? def.name : (boostDef ? boostDef.name : (b.id === 'golden_eps' ? 'Золотой EPS' : b.id === 'golden_click' ? 'Золотой клик' : b.id));
    html += `<div class="buff">${icon} ${name} · ${left}с</div>`;
  }
  if (els.buffs.innerHTML !== html) els.buffs.innerHTML = html;
}

function renderUI() {
  const zone = getZone();
  if (zone !== lastRenderedZone) {
    els.zoneName.textContent = ZONES[zone].name;
    els.plant.textContent = PLANT_RACES[activePlant].plants[Math.min(zone, PLANT_RACES[activePlant].plants.length - 1)];
    lastRenderedZone = zone;
  }
  els.energy.textContent = formatNum(state.energy);

  const epsVal = getEPS();
  const bonus = getDayBonus();
  let epsHTML = '+' + formatNum(epsVal) + ' / сек';
  if (bonus > 1) {
    epsHTML += ' <span class="sun-bonus">☀️ ×' + bonus.toFixed(1) + '</span>';
  }
  if (els.eps.innerHTML !== epsHTML) els.eps.innerHTML = epsHTML;

  const auto = getAutoClickRate();
  const crit = Math.round(getCritChance() * 100);
  let ci = 'Клик: +' + formatNum(getClickPower());
  if (auto > 0) ci += ' • Авто: ' + auto + '/сек';
  if (crit > 0) ci += ' • Крит: ' + crit + '%';
  if (ci !== lastClickInfo) {
    els.clickInfo.textContent = ci;
    lastClickInfo = ci;
  }
  renderBuffs();
  updateShop();
  updateActives();
}

function buildActivesPanel() {
  if (activesPanel) return;
  activesPanel = document.createElement('div');
  activesPanel.id = 'actives-panel';
  activesPanel.innerHTML = '<h3>⚡ Активные способности</h3>';
  for (const a of ACTIVES) {
    const btn = document.createElement('button');
    btn.className = 'active-btn cannot-use';
    btn.innerHTML = `<span>${a.icon} ${a.name}<br><span class="desc">${a.desc}</span></span><span class="status"></span>`;
    btn.onclick = () => activateBuff(a);
    activesPanel.appendChild(btn);
    activeButtons[a.id] = { el: btn, statusEl: btn.querySelector('.status'), lastKey: null };
  }
  els.activesMount.appendChild(activesPanel);
}

function updateActives() {
  const now = Date.now();
  for (const a of ACTIVES) {
    const btn = activeButtons[a.id];
    if (!btn) continue;
    const cdLeft = Math.max(0, (activeCooldowns[a.id] || 0) - now);
    const canUse = cdLeft === 0 && state.energy >= a.cost;
    const key = `${cdLeft > 0 ? Math.ceil(cdLeft / 1000) : 0}|${canUse}|${state.energy >= a.cost}`;
    if (btn.lastKey === key) continue;
    btn.lastKey = key;
    btn.el.classList.toggle('can-use', canUse);
    btn.el.classList.toggle('cannot-use', !canUse);
    btn.statusEl.textContent = cdLeft > 0 ? '⏳ ' + Math.ceil(cdLeft / 1000) + 'с' : formatNum(a.cost) + ' ⚡';
  }
}

function activateBuff(a) {
  const now = Date.now();
  if ((activeCooldowns[a.id] || 0) > now) return;
  if (state.energy < a.cost) { AudioSys.error(); return; }
  state.energy -= a.cost;

  const existing = activeBuffs.find(b => b.id === a.id);
  if (existing) {
    existing.expiresAt = Math.max(existing.expiresAt, now) + a.duration;
  } else {
    activeBuffs.push({ id: a.id, expiresAt: now + a.duration, effect: a.effect });
  }

  activeCooldowns[a.id] = now + a.cooldown;
  AudioSys.buff();
  renderUI();
  saveRace(activePlant); saveAll();
}

// ============================================================
// МАГАЗИН БУСТОВ
// ============================================================
function renderBoostShop() {
  const list = document.getElementById('boost-list');
  list.innerHTML = '';
  const tempBoosts = BOOSTS.filter(b => b.type !== 'permanent');
  const permBoosts = BOOSTS.filter(b => b.type === 'permanent');

  const tempTitle = document.createElement('div');
  tempTitle.className = 'boost-section-title';
  tempTitle.textContent = '⏱ Разовые бусты';
  list.appendChild(tempTitle);
  for (const b of tempBoosts) list.appendChild(createBoostCard(b));

  const permTitle = document.createElement('div');
  permTitle.className = 'boost-section-title permanent';
  permTitle.textContent = '♾ Постоянные усилители';
  list.appendChild(permTitle);
  for (const b of permBoosts) list.appendChild(createBoostCard(b));
}

function createBoostCard(b) {
  const card = document.createElement('div');
  card.className = 'boost-card';
  if (b.type === 'permanent') card.classList.add('permanent');
  const bought = b.type === 'permanent' && state.permanentBoosts[b.id];
  const affordable = state.energy >= b.cost;
  if (bought) card.classList.add('soldout');
  else if (!affordable) card.classList.add('unaffordable');
  else card.classList.add('affordable');

  card.innerHTML = `
    <div class="boost-icon">${b.icon}</div>
    <div class="boost-info">
      <div class="boost-name">${b.name}</div>
      <div class="boost-desc">${b.desc}</div>
      <div class="boost-effect">${b.effect}</div>
    </div>
    <div class="boost-price">${bought ? '✅ Куплено' : formatNum(b.cost) + ' ⚡'}</div>
  `;
  if (!bought) card.addEventListener('click', () => buyBoost(b));
  return card;
}

function buyBoost(b) {
  if (state.energy < b.cost) { AudioSys.error(); return; }
  if (b.type === 'permanent' && state.permanentBoosts[b.id]) return;
  state.energy -= b.cost;

  if (b.type === 'buff') {
    const now = Date.now();
    const existing = activeBuffs.find(x => x.id === b.id);
    if (existing) {
      existing.expiresAt = Math.max(existing.expiresAt, now) + b.duration;
    } else {
      activeBuffs.push({ id: b.id, expiresAt: now + b.duration, effect: b.buff });
    }
    showToast(`✨ ${b.name}: ${b.effect}`);
  } else if (b.type === 'buff_random') {
    const now = Date.now();
    const mult = [5, 7, 10][Math.floor(Math.random() * 3)];
    const types = ['eps', 'click', 'global'];
    const type = types[Math.floor(Math.random() * types.length)];
    const dur = 20000 + Math.floor(Math.random() * 40000);
    const id = 'lottery_' + type + '_' + mult;
    const existing = activeBuffs.find(x => x.id === id);
    if (existing) {
      existing.expiresAt = Math.max(existing.expiresAt, now) + dur;
    } else {
      activeBuffs.push({ id, expiresAt: now + dur, effect: { type, mult } });
    }
    const typeNames = { eps: 'EPS', click: 'клику', global: 'ВСЕМУ' };
    showToast(`🎰 Лотерея: ×${mult} к ${typeNames[type]} на ${Math.round(dur/1000)} сек!`);
  } else if (b.type === 'instant') {
    const gain = b.gain();
    state.energy += gain; state.totalEarned += gain;
    showToast(`🧪 +${formatNum(gain)} энергии!`);
  } else if (b.type === 'golden') {
    hideGoldenLeaf();
    state.totalGoldenLeaves++;
    giveGoldenReward();
  } else if (b.type === 'permanent') {
    state.permanentBoosts[b.id] = true;
    showToast(`♾ ${b.name} куплен навсегда!`);
    if (kiraVisible && !state._kiraPermSeen) {
      state._kiraPermSeen = true;
      kiraMilestone('first_permanent');
    }
  }
  AudioSys.purchase('epic');
  renderBoostShop(); renderUI();
  saveRace(activePlant); saveAll();
}

// ============================================================
// ДЕЙСТВИЯ
// ============================================================
function buyUpgrade(u) {
  const cost = getUpgradeCost(u);
  if (cost === null || state.energy < cost) { AudioSys.error(); return; }
  state.energy -= cost;
  state.bought[u.id] = (state.bought[u.id] || 0) + 1;
  AudioSys.purchase(u.rarity);

  // Кира хвалит
  if (kiraVisible) {
    if (!state._kiraFirstBuy) {
      state._kiraFirstBuy = true;
      kiraMilestone('first_buy');
    } else if (Math.random() < 0.25) {
      kiraPraise();
    }
  }

  renderUI();
  saveRace(activePlant); saveAll();
}

function clickPlant(e) {
  const power = getClickPower();
  const critChance = getCritChance();
  let isCrit = false;
  let finalPower = power;

  if (critChance > 0 && Math.random() < critChance) {
    isCrit = true;
    finalPower = power * 5;
    AudioSys.crit();
    if (kiraVisible && !state._kiraFirstCrit) {
      state._kiraFirstCrit = true;
      kiraMilestone('first_crit');
    }
  } else {
    AudioSys.click();
  }

  state.energy += finalPower;
  state.totalEarned += finalPower;
  state.totalClicks++;

  spawnFloat(e, '+' + formatNum(finalPower), isCrit);
  renderUI();
}

function spawnFloat(e, text, isCrit) {
  const el = document.createElement('div');
  el.className = 'float' + (isCrit ? ' crit' : '');
  el.textContent = isCrit ? 'КРИТ! ' + text : text;
  const gameEl = document.getElementById('game');
  const rect = gameEl.getBoundingClientRect();
  let x, y;
  if (e && Number.isFinite(e.clientX) && Number.isFinite(e.clientY) && e.clientX >= 0 && e.clientY >= 0) {
    x = e.clientX - rect.left; y = e.clientY - rect.top;
  } else {
    const pRect = els.plant.getBoundingClientRect();
    x = pRect.left - rect.left + pRect.width / 2;
    y = pRect.top - rect.top + pRect.height / 2;
  }
  el.style.left = (x - 20) + 'px';
  el.style.top = (y - 20) + 'px';
  gameEl.appendChild(el);
  setTimeout(() => el.remove(), isCrit ? 1200 : 1100);
}

// ============================================================
// ЗОЛОТОЙ ЛИСТ
// ============================================================
function scheduleGoldenLeaf() {
  clearTimeout(goldenLeafTimeout);
  if (currentScreen !== 'game') return;
  const delay = 60000 + Math.random() * 120000;
  goldenLeafTimeout = setTimeout(showGoldenLeaf, delay);
}

function showGoldenLeaf() {
  if (goldenLeafVisible || currentScreen !== 'game') return;
  goldenLeafVisible = true;
  const el = document.getElementById('golden-leaf');
  const maxX = window.innerWidth - 80;
  const maxY = window.innerHeight - 80;
  el.style.left = (40 + Math.random() * Math.max(40, maxX)) + 'px';
  el.style.top = (40 + Math.random() * Math.max(40, maxY)) + 'px';
  el.classList.add('show');

  el.onclick = () => {
    if (!goldenLeafVisible) return;
    hideGoldenLeaf();
    state.totalGoldenLeaves++;
    AudioSys.golden();
    if (kiraVisible && !state._kiraGoldenSeen) {
      state._kiraGoldenSeen = true;
      kiraMilestone('first_golden');
    }
    giveGoldenReward();
    scheduleGoldenLeaf();
  };
  clearTimeout(goldenLeafHideTimeout);
  goldenLeafHideTimeout = setTimeout(() => {
    if (goldenLeafVisible) { hideGoldenLeaf(); scheduleGoldenLeaf(); }
  }, 8000);
}

function hideGoldenLeaf() {
  goldenLeafVisible = false;
  document.getElementById('golden-leaf').classList.remove('show');
  clearTimeout(goldenLeafHideTimeout);
}

function giveGoldenReward() {
  const roll = Math.random();
  if (roll < 0.5) {
    const gain = Math.max(100, getEPS() * 60);
    state.energy += gain; state.totalEarned += gain;
    showToast(`🌟 +${formatNum(gain)} энергии!`);
  } else if (roll < 0.85) {
    const now = Date.now();
    const existing = activeBuffs.find(x => x.id === 'golden_eps');
    if (existing) existing.expiresAt = Math.max(existing.expiresAt, now) + 20000;
    else activeBuffs.push({ id: 'golden_eps', expiresAt: now + 20000, effect: { type: 'eps', mult: 3 } });
    showToast('🌟 ×3 к EPS на 20 сек!');
  } else {
    const now = Date.now();
    const existing = activeBuffs.find(x => x.id === 'golden_click');
    if (existing) existing.expiresAt = Math.max(existing.expiresAt, now) + 15000;
    else activeBuffs.push({ id: 'golden_click', expiresAt: now + 15000, effect: { type: 'click', mult: 5 } });
    showToast('🌟 ×5 к клику на 15 сек!');
  }
  renderUI(); saveRace(activePlant); saveAll();
}

function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;top:25%;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(60,40,10,0.95),rgba(40,25,5,0.95));color:#ffdd66;padding:12px 20px;border-radius:10px;border:2px solid #ffaa00;font-size:14px;font-weight:bold;z-index:2000;pointer-events:none;box-shadow:0 0 30px rgba(255,170,0,0.8);animation:toastPop 2s ease-out forwards;max-width:85vw;text-align:center;`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// ============================================================
// МОДАЛКИ
// ============================================================
function showConfirm(text, onConfirm) {
  const overlay = document.getElementById('modal-overlay');
  const t = document.getElementById('modal-text');
  const cancel = document.getElementById('modal-cancel');
  const confirm = document.getElementById('modal-confirm');
  t.innerHTML = text;
  cancel.style.display = '';
  confirm.textContent = 'Подтвердить';
  confirm.classList.add('danger');
  cancel.onclick = () => { overlay.classList.remove('show'); AudioSys.click(); };
  confirm.onclick = () => { overlay.classList.remove('show'); onConfirm(); };
  overlay.classList.add('show');
}

function confirmReset() {
  const raceName = PLANT_RACES[activePlant].name.toLowerCase();
  showConfirm(`⚠️ Сбросить прогресс <b>${raceName}</b> растения?<br><b>Другие растения не пострадают.</b>`, () => {
    plantsData[activePlant] = createDefaultState();
    state = plantsData[activePlant];
    activeBuffs = []; activeCooldowns = {};
    for (const k of RACE_SAVE_KEYS[activePlant]) {
      try { localStorage.removeItem(k); } catch (e) {}
    }
    lastRenderedZone = -1;
    buildShop(); buildSpecialization(); renderUI(); renderBoostShop();
    saveAll();
    AudioSys.error();
  });
}

// ============================================================
// КОД РАЗРАБОТЧИКА
// ============================================================
function applyDevCode(code) {
  if (code !== DEV_CODE) {
    AudioSys.error();
    showToast('❌ Неверный код');
    return;
  }

  AudioSys.devCode();

  for (const u of UPGRADES) state.bought[u.id] = u.max;
  for (const b of BOOSTS) {
    if (b.type === 'permanent') state.permanentBoosts[b.id] = true;
  }
  state.energy = Math.max(state.energy, 1e18);
  state.totalEarned = Math.max(state.totalEarned, 1e18);
  state.bestEnergy = Math.max(state.bestEnergy, state.energy);

  lastRenderedZone = -1;
  buildShop();
  buildSpecialization();
  renderUI();
  renderBoostShop();
  updateMenuStats();
  saveRace(activePlant);
  saveAll();

  showToast('🔓 ВСЁ ПРОКАЧАНО!');
  document.getElementById('dev-code-input').value = '';
}

// ============================================================
// ИГРОВОЙ ЦИКЛ
// ============================================================
let lastTick = performance.now();
let lastRenderTime = 0;
let lastGameMinuteTick = 0;

function gameLoop(now) {
  const dt = Math.min((now - lastTick) / 1000, 1);
  lastTick = now;

  // Игровое время: 1 реальная секунда = 1 игровая минута
  if (now - lastGameMinuteTick >= 1000) {
    gameMinutes++;
    updateClock();
    lastGameMinuteTick = now;
  }

  const savedState = state, savedBuffs = activeBuffs, savedCD = activeCooldowns;

  for (const raceId of RACE_ORDER) {
    const r = plantsData[raceId];
    const rBuffs = raceId === activePlant ? savedBuffs : (r.activeBuffs || []);
    const rCD = raceId === activePlant ? savedCD : (r.activeCooldowns || {});

    state = r; activeBuffs = rBuffs; activeCooldowns = rCD;

    const eps = getEPS();
    if (eps > 0) { r.energy += eps * dt; r.totalEarned += eps * dt; }
    const auto = getAutoClickRate();
    if (auto > 0) {
      const gain = auto * getClickPower() * dt;
      r.energy += gain; r.totalEarned += gain;
    }
  }

  state = savedState; activeBuffs = savedBuffs; activeCooldowns = savedCD;

  if (now - lastRenderTime >= 100) { renderUI(); lastRenderTime = now; }
  requestAnimationFrame(gameLoop);
}

// ============================================================
// ФОН / ТОСТ / ИНИЦИАЛИЗАЦИЯ
// ============================================================
function spawnSpores() {
  const bg = document.getElementById('bg');
  for (let i = 0; i < 15; i++) {
    const s = document.createElement('div');
    s.className = 'spore';
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDuration = (8 + Math.random() * 12) + 's';
    s.style.animationDelay = (Math.random() * 10) + 's';
    s.style.opacity = 0.2 + Math.random() * 0.3;
    const size = 2 + Math.random() * 4;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    bg.appendChild(s);
  }
}

if (!document.getElementById('style-toast')) {
  const s = document.createElement('style');
  s.id = 'style-toast';
  s.textContent = `@keyframes toastPop {
    0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
    20% { transform: translateX(-50%) scale(1.1); opacity: 1; }
    80% { transform: translateX(-50%) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) scale(1); opacity: 0; }
  }`;
  document.head.appendChild(s);
}

function initSettings() {
  const volSlider = document.getElementById('volume-slider');
  const volValue = document.getElementById('volume-value');
  const volIcon = document.getElementById('vol-icon');
  const musicSlider = document.getElementById('music-slider');
  const musicValue = document.getElementById('music-value');
  const devInput = document.getElementById('dev-code-input');
  const kiraToggle = document.getElementById('kira-toggle');
  const kiraIndicator = document.getElementById('kira-toggle-indicator');

  volSlider.value = Math.round(settings.volume * 100);
  volValue.textContent = Math.round(settings.volume * 100) + '%';
  volSlider.style.setProperty('--fill', Math.round(settings.volume * 100) + '%');
  updateVolIcon();

  musicSlider.value = Math.round(settings.musicVolume * 100);
  musicValue.textContent = Math.round(settings.musicVolume * 100) + '%';
  musicSlider.style.setProperty('--fill', Math.round(settings.musicVolume * 100) + '%');

  // Кира-toggle
  kiraIndicator.classList.toggle('on', kiraVisible);
  kiraToggle.addEventListener('click', () => {
    kiraVisible = !kiraVisible;
    kiraIndicator.classList.toggle('on', kiraVisible);
    applyKiraVisibility();
    AudioSys.click();
    saveAll();
  });

  volSlider.addEventListener('input', (e) => {
    const v = parseInt(e.target.value);
    settings.volume = v / 100;
    volValue.textContent = v + '%';
    volSlider.style.setProperty('--fill', v + '%');
    AudioSys.setVolume(settings.volume);
    updateVolIcon();
  });
  volSlider.addEventListener('change', () => { AudioSys.click(); saveAll(); });

  musicSlider.addEventListener('input', (e) => {
    const v = parseInt(e.target.value);
    settings.musicVolume = v / 100;
    musicValue.textContent = v + '%';
    musicSlider.style.setProperty('--fill', v + '%');
    AudioSys.setMusicVolume(settings.musicVolume);
  });
  musicSlider.addEventListener('change', () => saveAll());

  devInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      applyDevCode(devInput.value.trim());
    }
  });

  function updateVolIcon() {
    if (settings.volume === 0) volIcon.textContent = '🔇';
    else if (settings.volume < 0.3) volIcon.textContent = '🔈';
    else if (settings.volume < 0.7) volIcon.textContent = '🔉';
    else volIcon.textContent = '🔊';
  }

  document.getElementById('settings-reset').addEventListener('click', () => {
    AudioSys.error(); confirmReset();
  });
}

function init() {
  cacheElements();
  load();

  AudioSys.init();
  AudioSys.setVolume(settings.volume);
  AudioSys.setMusicVolume(settings.musicVolume);

  applyTheme();
  updatePlantSwitcher();
  applyKiraVisibility();

  buildShop();
  buildSpecialization();
  buildZoneFilter();
  buildActivesPanel();
  initSettings();
  renderUI();
  renderBoostShop();
  spawnSpores();
  updateMenuStats();

  updateClock();

  // Кнопка Киры
  const kiraBtn = document.getElementById('kira-btn');
  if (kiraBtn) {
    kiraBtn.addEventListener('click', () => {
      AudioSys.kira();
      kiraTip();
    });
  }

  const unlockAudio = () => {
    AudioSys.resume();
    AudioSys.startMusic();
    document.removeEventListener('click', unlockAudio);
    document.removeEventListener('touchstart', unlockAudio);
  };
  document.addEventListener('click', unlockAudio);
  document.addEventListener('touchstart', unlockAudio);

  document.getElementById('menu-play').addEventListener('click', () => showScreen('game'));
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => showScreen(btn.dataset.screen));
  });
  els.plant.addEventListener('click', clickPlant);

  // Приветствие Киры при первом запуске
  if (kiraVisible && !localStorage.getItem('photosynthesis_kira_greeted')) {
    setTimeout(() => {
      localStorage.setItem('photosynthesis_kira_greeted', '1');
      showKiraBubble('👩‍🔬 Привет! Я Кира, биолог. Рада знакомству! Нажми на меня, если нужен совет.', 8000);
    }, 1500);
  }

  lastTick = performance.now();
  lastGameMinuteTick = lastTick;
  requestAnimationFrame(gameLoop);

  setInterval(saveAll, 10000);
  window.addEventListener('beforeunload', saveAll);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) saveAll();
  });
}

init();
</script>
