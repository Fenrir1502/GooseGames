<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Фотосинтез</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e8f5e8;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }

  /* ===== ФОН ===== */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(180deg, #0a1f0a 0%, #122e12 40%, #1c4a1c 100%);
    overflow: hidden;
  }
  #bg::before {
    content: ''; position: absolute; top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 15%, rgba(140,255,140,0.12) 0%, transparent 55%);
    animation: sunPulse 8s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 0.9; transform: scale(1.08); }
  }
  .spore {
    position: absolute; width: 4px; height: 4px;
    background: #aaffaa; border-radius: 50%;
    box-shadow: 0 0 10px #7fff7f; opacity: 0.4;
    animation: floatUpSpore linear infinite;
  }
  @keyframes floatUpSpore {
    0% { transform: translateY(100vh); opacity: 0; }
    10%, 90% { opacity: 0.5; }
    100% { transform: translateY(-10vh) translateX(50px); opacity: 0; }
  }
  #ground {
    position: absolute; bottom: 0; left: 0; right: 0; height: 140px;
    background: linear-gradient(180deg, transparent 0%, #142e14 50%, #081a08 100%);
    pointer-events: none;
  }

  .screen {
    position: fixed; inset: 0; z-index: 1;
    display: none; opacity: 0;
    transition: opacity 0.3s;
  }
  .screen.active { display: flex; opacity: 1; }

  /* ===== МЕНЮ ===== */
  #screen-menu {
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px; padding-bottom: 100px;
  }
  #screen-menu h1 {
    font-size: 72px; letter-spacing: 8px;
    color: #9fff9f;
    text-shadow: 0 0 30px #7fff7f, 0 0 80px rgba(127,255,127,0.4);
    margin-bottom: 6px;
    animation: titleGlow 4s ease-in-out infinite;
    font-weight: 800;
  }
  @keyframes titleGlow {
    0%, 100% { text-shadow: 0 0 30px #7fff7f, 0 0 80px rgba(127,255,127,0.4); }
    50% { text-shadow: 0 0 50px #7fff7f, 0 0 100px rgba(127,255,127,0.7); }
  }
  #screen-menu .subtitle {
    font-size: 15px; color: #8fbf8f; letter-spacing: 4px;
    margin-bottom: 36px; text-transform: uppercase;
  }
  #screen-menu .menu-plant {
    font-size: 150px; margin-bottom: 36px;
    animation: menuPlantFloat 4s ease-in-out infinite;
    filter: drop-shadow(0 0 40px #4f4) drop-shadow(0 0 80px rgba(80,255,80,0.4));
  }
  @keyframes menuPlantFloat {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-18px) rotate(3deg); }
  }
  #screen-menu .menu-stats {
    display: flex; gap: 16px; margin-bottom: 32px;
    flex-wrap: wrap; justify-content: center;
  }
  .stat {
    background: rgba(20, 45, 25, 0.7);
    border: 1px solid rgba(120,200,120,0.3);
    border-radius: 12px;
    padding: 12px 22px;
    min-width: 130px;
    backdrop-filter: blur(6px);
  }
  .stat .label {
    font-size: 10px; color: #8fbf8f;
    text-transform: uppercase; letter-spacing: 2px;
  }
  .stat .value {
    font-size: 22px; color: #bfffb f; color: #bfffbf;
    font-weight: bold; margin-top: 4px;
  }

  /* ===== КНОПКИ ===== */
  .btn {
    background: linear-gradient(180deg, #3a8a3a 0%, #265a26 100%);
    border: 2px solid #6abb6a;
    color: #fff; padding: 14px 44px;
    border-radius: 12px; cursor: pointer;
    font-size: 18px; font-weight: bold;
    letter-spacing: 3px; text-transform: uppercase;
    transition: all 0.15s;
    box-shadow: 0 5px 0 #173a17, 0 0 25px rgba(80,255,80,0.35);
  }
  .btn:hover {
    background: linear-gradient(180deg, #4aaa4a 0%, #357035 100%);
    transform: translateY(-2px);
    box-shadow: 0 7px 0 #173a17, 0 0 35px rgba(80,255,80,0.6);
  }
  .btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #173a17;
  }
  .btn.danger {
    background: linear-gradient(180deg, #8a3a3a 0%, #5a2525 100%);
    border-color: #c88; box-shadow: 0 5px 0 #3a1717, 0 0 25px rgba(255,80,80,0.3);
  }

  /* ===== ИГРА ===== */
  #screen-game { flex-direction: row; }
  #game {
    position: relative; z-index: 1; flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px; overflow: hidden; padding-bottom: 90px;
  }

  #zone-name {
    position: absolute; top: 24px;
    font-size: 20px; letter-spacing: 6px;
    text-transform: uppercase; color: #8fff8f;
    text-shadow: 0 0 20px #7fff7f;
    font-weight: 600;
  }

  /* Верхняя плашка с энергией */
  #energy-panel {
    display: flex; flex-direction: column; align-items: center;
    background: rgba(10, 30, 15, 0.6);
    border: 1px solid rgba(120,200,120,0.25);
    border-radius: 16px;
    padding: 12px 32px;
    backdrop-filter: blur(8px);
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #energy {
    font-size: 44px; font-weight: bold; color: #bfffbf;
    text-shadow: 0 0 25px #4f4, 0 2px 6px rgba(0,0,0,0.8);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  #eps {
    font-size: 14px; color: #8fcf8f;
    margin-top: 6px; letter-spacing: 1px;
  }
  #buffs {
    display: flex; gap: 8px; margin-bottom: 16px; min-height: 30px;
    flex-wrap: wrap; justify-content: center;
  }
  .buff {
    background: linear-gradient(180deg, rgba(90,50,140,0.8), rgba(60,30,100,0.8));
    border: 1px solid #b78fff;
    border-radius: 16px; padding: 5px 12px;
    font-size: 12px; color: #ecdcff;
    animation: buffPulse 1.2s ease-in-out infinite;
  }
  @keyframes buffPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(170,100,255,0.4); }
    50% { box-shadow: 0 0 18px rgba(170,100,255,0.8); }
  }
  #plant {
    font-size: 140px; cursor: pointer; user-select: none;
    transition: transform 0.06s, filter 0.1s;
    filter: drop-shadow(0 0 40px #4f4) drop-shadow(0 0 80px rgba(80,255,80,0.3));
    margin-bottom: 20px;
    animation: plantBreathe 3.5s ease-in-out infinite;
  }
  @keyframes plantBreathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  #plant:active {
    transform: scale(0.88) !important;
    filter: drop-shadow(0 0 60px #7fff7f) drop-shadow(0 0 120px rgba(127,255,127,0.6));
  }
  #click-info {
    font-size: 14px; color: #a8d8a8;
    background: rgba(10, 30, 15, 0.6);
    padding: 6px 16px; border-radius: 20px;
    border: 1px solid rgba(120,200,120,0.2);
  }

  /* ===== МАГАЗИН ===== */
  #shop {
    position: relative; z-index: 10; width: 420px;
    background: linear-gradient(180deg, rgba(8, 22, 12, 0.92), rgba(5, 15, 8, 0.92));
    backdrop-filter: blur(12px);
    border-left: 1px solid rgba(120,200,120,0.2);
    display: flex; flex-direction: column;
    max-height: 100vh;
    box-shadow: -10px 0 40px rgba(0,0,0,0.6);
  }
  #shop-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid rgba(120,200,120,0.15);
    flex-shrink: 0;
    background: rgba(5, 15, 8, 0.8);
  }
  #shop-header h2 {
    color: #9fff9f; font-size: 16px;
    letter-spacing: 4px; text-transform: uppercase;
    font-weight: 600;
  }
  #shop-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 14px 18px 90px;
  }
  #shop-scroll::-webkit-scrollbar { width: 6px; }
  #shop-scroll::-webkit-scrollbar-track { background: transparent; }
  #shop-scroll::-webkit-scrollbar-thumb {
    background: rgba(120,200,120,0.3); border-radius: 3px;
  }
  #shop-scroll::-webkit-scrollbar-thumb:hover {
    background: rgba(120,200,120,0.5);
  }
  #zone-filter {
    display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap;
  }
  #zone-filter button {
    flex: 1; min-width: 58px; padding: 7px 6px;
    background: rgba(25,50,30,0.5);
    border: 1px solid rgba(120,200,120,0.2);
    color: #8fb88f; border-radius: 8px;
    cursor: pointer; font-size: 11px;
    transition: all 0.15s;
    font-weight: 600;
  }
  #zone-filter button:hover {
    background: rgba(40,80,45,0.7); color: #bfffbf;
  }
  #zone-filter button.active {
    background: linear-gradient(180deg, #3a8a3a, #265a26);
    color: #fff;
    border-color: #6abb6a;
    box-shadow: 0 0 12px rgba(80,255,80,0.4);
  }
  #zone-filter button.locked {
    opacity: 0.25; cursor: not-allowed;
  }

  /* ===== КАТЕГОРИИ ===== */
  .category-header {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: #7fcf7f;
    text-transform: uppercase; letter-spacing: 2px;
    margin: 16px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(120,200,120,0.15);
    font-weight: 600;
  }
  .category-header:first-child { margin-top: 0; }
  .category-header .cat-count {
    margin-left: auto;
    font-size: 10px;
    background: rgba(120,200,120,0.15);
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 0;
  }

  /* ===== КАРТОЧКА УЛУЧШЕНИЯ ===== */
  .upgrade {
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 10px;
    background: linear-gradient(180deg, rgba(25,50,30,0.65), rgba(15,35,20,0.65));
    border: 1px solid rgba(120,200,120,0.2);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .upgrade.rarity-rare {
    border-color: rgba(100,170,255,0.4);
    background: linear-gradient(180deg, rgba(20,35,60,0.65), rgba(15,25,45,0.65));
  }
  .upgrade.rarity-epic {
    border-color: rgba(180,110,255,0.45);
    background: linear-gradient(180deg, rgba(40,22,60,0.65), rgba(25,15,40,0.65));
  }
  .upgrade.rarity-legendary {
    border-color: rgba(255,180,50,0.6);
    background: linear-gradient(180deg, rgba(60,42,12,0.7), rgba(40,28,8,0.7));
    animation: legendaryGlow 2.4s ease-in-out infinite;
  }
  @keyframes legendaryGlow {
    0%, 100% { box-shadow: 0 0 6px rgba(255,180,50,0.3); }
    50% { box-shadow: 0 0 22px rgba(255,180,50,0.7); }
  }
  .upgrade:hover:not(.locked):not(.bought) {
    transform: translateY(-2px);
    border-color: #8fff8f;
    box-shadow: 0 6px 20px rgba(80,255,80,0.15);
  }
  .upgrade.rarity-rare:hover:not(.locked):not(.bought) { border-color: #7fc0ff; }
  .upgrade.rarity-epic:hover:not(.locked):not(.bought) { border-color: #c8a0ff; }
  .upgrade.rarity-legendary:hover:not(.locked):not(.bought) { border-color: #ffcc66; }

  .upgrade.locked { opacity: 0.3; cursor: not-allowed; }
  .upgrade.bought { opacity: 0.55; cursor: default; }
  .upgrade.unaffordable { opacity: 0.7; }

  .upgrade .icon-box {
    font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    width: 44px; height: 44px;
  }
  .upgrade .icon-box .qty {
    position: absolute; bottom: -4px; right: -4px;
    background: #3a8a3a;
    color: #fff; font-size: 10px;
    font-weight: bold; padding: 1px 6px;
    border-radius: 10px;
    border: 1px solid #1a3a1a;
    min-width: 18px; text-align: center;
  }
  .upgrade.bought .icon-box .qty { background: #2a5a2a; }

  .upgrade .content { min-width: 0; }

  .upgrade .name-row {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 4px;
  }
  .upgrade .name {
    font-weight: 700; font-size: 14px;
    color: #cfffcf; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .upgrade.rarity-rare .name { color: #c8e0ff; }
  .upgrade.rarity-epic .name { color: #e8d0ff; }
  .upgrade.rarity-legendary .name { color: #ffe4a8; }

  .upgrade .stars {
    font-size: 10px; letter-spacing: 0.5px;
    opacity: 0.85;
  }
  .upgrade.rarity-common .stars { color: #6abb6a; }
  .upgrade.rarity-rare .stars { color: #7fc0ff; }
  .upgrade.rarity-epic .stars { color: #c8a0ff; }
  .upgrade.rarity-legendary .stars { color: #ffcc66; }

  .upgrade .effect-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 4px;
    letter-spacing: 0.3px;
  }
  .upgrade.rarity-common .effect-badge {
    color: #8fff8f; background: rgba(80,255,80,0.12);
    border: 1px solid rgba(80,255,80,0.3);
  }
  .upgrade.rarity-rare .effect-badge {
    color: #8fc8ff; background: rgba(100,170,255,0.12);
    border: 1px solid rgba(100,170,255,0.3);
  }
  .upgrade.rarity-epic .effect-badge {
    color: #d8b0ff; background: rgba(180,110,255,0.12);
    border: 1px solid rgba(180,110,255,0.3);
  }
  .upgrade.rarity-legendary .effect-badge {
    color: #ffdd88; background: rgba(255,180,50,0.12);
    border: 1px solid rgba(255,180,50,0.3);
  }

  .upgrade .hint {
    font-size: 11px; color: #8fb88f;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .upgrade .hint.synergy-hint {
    color: #ffbb66;
  }
  .upgrade .hint.synergy-active {
    color: #8fff8f;
    font-weight: 600;
  }

  .upgrade .bottom-row {
    display: flex; align-items: center;
    gap: 8px;
  }
  .upgrade .cost {
    font-size: 13px; font-weight: 700;
    color: #ffd766;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .upgrade.affordable .cost {
    color: #8fff8f;
    text-shadow: 0 0 10px rgba(80,255,80,0.6);
  }
  .upgrade .progress {
    flex: 1; height: 5px;
    background: rgba(0,0,0,0.5);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .upgrade .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #3a8a3a, #8fff8f);
    border-radius: 3px;
    transition: width 0.3s;
    box-shadow: 0 0 8px rgba(80,255,80,0.6);
  }
  .upgrade.bought .progress-bar {
    background: linear-gradient(90deg, #2a5a2a, #4a7a4a);
    box-shadow: none;
  }

  /* ===== СПЕЦИАЛИЗАЦИЯ ===== */
  #specialization {
    margin-bottom: 14px; padding: 12px;
    background: linear-gradient(180deg, rgba(20,45,55,0.6), rgba(15,30,45,0.6));
    border: 1px solid rgba(100,200,220,0.3);
    border-radius: 10px;
  }
  #specialization h3 {
    font-size: 11px; color: #8fe0e0;
    margin-bottom: 10px; letter-spacing: 2px;
    text-transform: uppercase; font-weight: 600;
  }
  #specialization .paths {
    display: flex; gap: 6px;
  }
  #specialization .path {
    flex: 1; padding: 8px 4px;
    background: rgba(20,40,50,0.6);
    border: 1px solid rgba(100,200,220,0.2);
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.15s;
    text-align: center;
  }
  #specialization .path:hover {
    background: rgba(40,70,80,0.9);
    border-color: #8fe0e0;
  }
  #specialization .path.chosen {
    background: linear-gradient(180deg, rgba(60,110,120,0.9), rgba(40,80,90,0.9));
    border-color: #8fe0e0;
    box-shadow: 0 0 15px rgba(100,220,220,0.5);
  }
  #specialization .path.locked {
    opacity: 0.3; cursor: not-allowed;
  }
  #specialization .path .icon {
    font-size: 20px; display: block; margin-bottom: 2px;
  }
  #specialization .path .bonus {
    font-size: 9px; color: #8fbfbf; margin-top: 2px;
  }

  /* ===== АКТИВНЫЕ СПОСОБНОСТИ ===== */
  #actives-panel {
    margin-bottom: 14px; padding: 12px;
    background: linear-gradient(180deg, rgba(60,25,60,0.55), rgba(40,15,50,0.55));
    border: 1px solid rgba(180,110,255,0.35);
    border-radius: 10px;
  }
  #actives-panel h3 {
    font-size: 11px; color: #d8b0ff;
    margin-bottom: 10px; letter-spacing: 2px;
    text-transform: uppercase; font-weight: 600;
  }
  .active-btn {
    width: 100%; margin-bottom: 6px; padding: 9px 12px;
    border-radius: 8px; font-size: 12px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; transition: all 0.15s;
    text-align: left;
  }
  .active-btn.can-use {
    background: linear-gradient(180deg, rgba(120,60,180,0.9), rgba(80,40,130,0.9));
    border: 1px solid #c8a0ff; color: #fff;
    box-shadow: 0 0 12px rgba(200,150,255,0.5);
  }
  .active-btn.can-use:hover {
    background: linear-gradient(180deg, rgba(140,80,200,1), rgba(100,55,155,1));
    box-shadow: 0 0 20px rgba(200,150,255,0.8);
  }
  .active-btn.cannot-use {
    background: rgba(30,20,40,0.6);
    border: 1px solid rgba(120,80,150,0.3);
    color: #8a7a98; cursor: not-allowed;
  }
  .active-btn .desc {
    font-size: 10px; color: #c8b0d8; margin-top: 2px;
  }
  .active-btn .status {
    font-weight: 700; font-size: 13px;
    white-space: nowrap; margin-left: 8px;
  }

  /* ===== НИЖНЯЯ ПАНЕЛЬ ===== */
  #bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    display: flex; justify-content: center;
    background: linear-gradient(180deg, rgba(5, 18, 8, 0.92), rgba(3, 12, 5, 0.98));
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(120,200,120,0.25);
    box-shadow: 0 -8px 40px rgba(0,0,0,0.7);
    height: 72px;
    padding: 0 20px;
  }
  .nav-btn {
    flex: 1; max-width: 160px;
    background: transparent; border: none;
    color: #6a9a6a; cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px; font-size: 10px;
    text-transform: uppercase; letter-spacing: 1.5px;
    transition: all 0.2s;
    position: relative;
    font-weight: 600;
  }
  .nav-btn .icon {
    font-size: 24px;
    transition: transform 0.2s, filter 0.2s;
  }
  .nav-btn:hover { color: #bfffbf; }
  .nav-btn:hover .icon {
    transform: scale(1.15) translateY(-2px);
    filter: drop-shadow(0 0 10px #7fff7f);
  }
  .nav-btn.active {
    color: #9fff9f;
    text-shadow: 0 0 12px #7fff7f;
  }
  .nav-btn.active .icon {
    transform: scale(1.2);
    filter: drop-shadow(0 0 12px #7fff7f);
  }
  .nav-btn.active::before {
    content: '';
    position: absolute; top: 0; left: 25%; right: 25%;
    height: 3px;
    background: linear-gradient(90deg, transparent, #7fff7f, transparent);
    border-radius: 0 0 3px 3px;
    box-shadow: 0 0 15px #7fff7f;
  }

  /* ===== НАСТРОЙКИ ===== */
  #screen-settings {
    flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; padding-bottom: 100px; overflow-y: auto;
  }
  #screen-settings .settings-card {
    background: linear-gradient(180deg, rgba(10,30,15,0.9), rgba(5,20,8,0.9));
    backdrop-filter: blur(12px);
    border: 1px solid rgba(120,200,120,0.3);
    border-radius: 16px;
    padding: 32px;
    max-width: 500px; width: 100%;
    box-shadow: 0 0 60px rgba(80,255,80,0.15);
  }
  #screen-settings h2 {
    font-size: 26px; color: #9fff9f;
    letter-spacing: 5px; text-align: center;
    margin-bottom: 30px; text-transform: uppercase;
    font-weight: 600;
  }
  .setting-group { margin-bottom: 24px; }
  .setting-group label {
    display: block; font-size: 12px; color: #bfffbf;
    margin-bottom: 10px; letter-spacing: 2px;
    text-transform: uppercase; font-weight: 600;
  }
  .slider-container {
    display: flex; align-items: center; gap: 14px;
  }
  .slider-container .slider-icon {

// АУДИО — новая музыка: мажор, шкатулка, без реверба
// ============================================================
const AudioSys = {
  ctx: null,
  masterGain: null,
  musicGain: null,
  musicTimer: null,
  musicPlaying: false,
  volume: 0.5,
  musicVolume: 0.3,

  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = this.volume;
      this.masterGain.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = this.musicVolume;
      this.musicGain.connect(this.masterGain);
    } catch (e) { console.warn('Аудио недоступно', e); }
  },

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  // Чистый короткий тон (для кликов, ошибок)
  tone(freq, duration, type = 'sine', gainValue = 0.2, sweepTo = null, target = null) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (sweepTo !== null) osc.frequency.exponentialRampToValueAtTime(sweepTo, now + duration);
    gain.gain.setValueAtTime(gainValue, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(target || this.masterGain);
    osc.start(now);
    osc.stop(now + duration);
  },

  // «Колокольчик» музыкальной шкатулки: чистый, короткий, без гула
  chime(freq, duration = 0.5, gainValue = 0.15, target = null) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    // Быстрая атака, плавное затухание — как язычок шкатулки
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(gainValue, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(target || this.masterGain);
    osc.start(now);
    osc.stop(now + duration);
  },

  click() {
    this.tone(520 + Math.random() * 120, 0.06, 'sine', 0.08, 400);
  },

  purchase(rarity = 'common') {
    // Мажорные трезвучия — приятные, не минор
    const chords = {
      common: [523, 659],           // C-E
      rare: [523, 659, 784],        // C-E-G
      epic: [587, 740, 880],        // D-F#-A
      legendary: [659, 784, 988, 1319], // E-G-B-E
    };
    const notes = chords[rarity] || chords.common;
    notes.forEach((f, i) => setTimeout(() => this.chime(f, 0.5, 0.16), i * 55));
  },

  error() {
    this.tone(220, 0.12, 'triangle', 0.1, 160);
  },

  golden() {
    // Мажорная пентатоника вверх — радостно
    [659, 784, 988, 1175, 1319, 1568].forEach((f, i) =>

  },

  buff() {

  },

    this.tone(520, 0.08, 'sine', 0.06, 700);
  },

  // НОВАЯ МУЗЫКА: мажорная шкатулка, никакого минора и низких частот
  startMusic() {
    if (!this.ctx || this.musicPlaying) return;
    this.musicPlaying = true;

    // Аккорды ТОЛЬКО мажорные: C → F → G → C (классический "уютный" круг)
    // Частоты во второй-третьей октаве (523-1568 Гц) — высокие, "хрустальные"
    const melody = [
      // C major: C-E-G-E (523, 659, 784, 659)
      { f: 523.25, d: 0.32 }, { f: 659.25, d: 0.32 }, { f: 783.99, d: 0.32 }, { f: 659.25, d: 0.32 },
      // F major: F-A-C-A (698, 880, 1046, 880)
      { f: 698.46, d: 0.32 }, { f: 880.00, d: 0.32 }, { f: 1046.50, d: 0.32 }, { f: 880.00, d: 0.32 },
      // G major: G-B-D-B (784, 988, 1175, 988)
      { f: 783.99, d: 0.32 }, { f: 987.77, d: 0.32 }, { f: 1174.66, d: 0.32 }, { f: 987.77, d: 0.32 },
      // C major высокий: C-E-G-C (523, 659, 784, 1046)
      { f: 523.25, d: 0.32 }, { f: 659.25, d: 0.32 }, { f: 783.99, d: 0.32 }, { f: 1046.50, d: 0.5 },
    ];

    let idx = 0;
    const playNext = () => {
      if (!this.musicPlaying) return;
      const note = melody[idx];
      // Играем шкатулкой
      this.chime(note.f, Math.max(0.5, note.d * 1.5), 0.05, this.musicGain);
      // Тихое "эхо" на октаву выше с задержкой — не реверб, а лёгкий отклик
      setTimeout(() => {
        if (this.musicPlaying) {
          this.chime(note.f * 2, 0.35, 0.025, this.musicGain);
        }
      }, 90);

      idx = (idx + 1) % melody.length;
      this.musicTimer = setTimeout(playNext, note.d * 1000);
    };
    playNext();
  },

  stopMusic() {
    this.musicPlaying = false;
    clearTimeout(this.musicTimer);
  },

  setVolume(v) {
    this.volume = v;
    if (this.masterGain) this.masterGain.gain.value = v;
  },

  setMusicVolume(v) {
    this.musicVolume = v;
    if (this.musicGain) this.musicGain.gain.value = v;
  },
};

  return {
    energy: 0, totalEarned: 0, totalClicks: 0,
    bought: {}, path: null,
    startedAt: Date.now(), lastSaveAt: Date.now(),
    totalGoldenLeaves: 0, bestEnergy: 0,
  };
}

// ============================================================
// ВЫЧИСЛЯЕМЫЕ
// ============================================================
function cleanBuffs() {
  const now = Date.now();
  if (activeBuffs.length) activeBuffs = activeBuffs.filter(b => b.expiresAt > now);
}

function getPathMults() {
  if (!state.path || !PATHS[state.path]) return { eps: 1, click: 1 };
  const p = PATHS[state.path];
  return { eps: p.epsMult, click: p.clickMult };
}

function getGlobalMult() {
  let m = 1;
  for (const u of UPGRADES) if (u.globalMult && (state.bought[u.id] || 0) > 0) m *= u.globalMult;
  for (const b of activeBuffs) if (b.effect.type === 'global') m *= b.effect.mult;
  return m;
}

function getZoneBoost(zoneId) {
  let m = 1;
  for (const u of UPGRADES) {
    if (u.zoneBoost && u.zoneBoost.zone === zoneId && (state.bought[u.id] || 0) > 0) m *= u.zoneBoost.mult;
  }
  return m;
}

function getSynergyBonus(upgrade) {
  if (!upgrade.synergy) return 0;
  return (state.bought[upgrade.synergy.with] || 0) > 0 ? upgrade.synergy.bonus : 0;
}

function getBaseEPS() {
  let base = 0;
  for (const u of UPGRADES) {
    if (u.eps) {
      const count = state.bought[u.id] || 0;
      if (count > 0) base += u.eps * count * getZoneBoost(u.zone) * (1 + getSynergyBonus(u));
    }
  }
  return base;
}

function getEPS() {
  cleanBuffs();
  let eps = getBaseEPS() * getGlobalMult() * getPathMults().eps;
  for (const b of activeBuffs) if (b.effect.type === 'eps') eps *= b.effect.mult;
  return eps;
}

function getClickFlat() {
  let flat = 0;
  for (const u of UPGRADES) if (u.clickFlat) flat += u.clickFlat * (state.bought[u.id] || 0);
  return flat;
}

function getClickMult() {
  let m = 1;
  for (const u of UPGRADES) if (u.clickMult && (state.bought[u.id] || 0) > 0) m *= u.clickMult;
  return m;
}

function getClickPower() {
  cleanBuffs();
  let power = (1 + getClickFlat()) * getClickMult() * getGlobalMult() * getPathMults().click;
  for (const b of activeBuffs) if (b.effect.type === 'click') power *= b.effect.mult;
  return power;
}

function getAutoClickRate() {
  let rate = 0;
  for (const u of UPGRADES) if (u.autoClick) rate += u.autoClick * (state.bought[u.id] || 0);
  return rate;
}

function getUpgradeCost(u) {
  const count = state.bought[u.id] || 0;
  if (count >= u.max) return null;
  return Math.ceil(u.cost * Math.pow(1.15, count));
}

function getZone() {
  let zone = 0;
  for (let i = ZONES.length - 1; i >= 0; i--) {
    if (state.totalEarned >= ZONES[i].threshold) { zone = i; break; }
  }
  return zone;
}

// ============================================================
// ФОРМАТ
// ============================================================
function formatNum(n) {
  if (!Number.isFinite(n)) return '0';
  if (n < 0) return '-' + formatNum(-n);
  if (n < 1000) {
    if (n === 0) return '0';
    if (n < 10) return n.toFixed(1).replace(/\.0$/, '');
    return Math.floor(n).toString();
  }
  if (n < 1e6) return (n / 1e3).toFixed(2) + 'K';
  if (n < 1e9) return (n / 1e6).toFixed(2) + 'M';
  if (n < 1e12) return (n / 1e9).toFixed(2) + 'B';
  if (n < 1e15) return (n / 1e12).toFixed(2) + 'T';
  return (n / 1e15).toFixed(2) + 'Qa';
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return h + 'ч ' + m + 'м';
  if (m > 0) return m + 'м ' + sec + 'с';
  return sec + 'с';
}

// ============================================================
// СОХРАНЕНИЕ
// ============================================================
function load() {
  try {
    const rawS = localStorage.getItem(SETTINGS_KEY);
    if (rawS) {
      const d = JSON.parse(rawS);
      settings.volume = Number.isFinite(d.volume) ? Math.max(0, Math.min(1, d.volume)) : 0.5;
      settings.musicVolume = Number.isFinite(d.musicVolume) ? Math.max(0, Math.min(1, d.musicVolume)) : 0.3;
    }
  } catch (e) {}

  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    const knownIds = new Set(UPGRADES.map(u => u.id));
    const bought = {};
    if (data.bought && typeof data.bought === 'object') {
      for (const [id, n] of Object.entries(data.bought)) {
        if (knownIds.has(id) && Number.isFinite(n) && n > 0) bought[id] = Math.floor(n);
      }
    }
    let path = null;
    if (typeof data.path === 'string' && PATHS[data.path]) path = data.path;

    state = {
      energy: Number.isFinite(data.energy) && data.energy >= 0 ? data.energy : 0,
      totalEarned: Number.isFinite(data.totalEarned) && data.totalEarned >= 0 ? data.totalEarned : 0,
      totalClicks: Number.isFinite(data.totalClicks) && data.totalClicks >= 0 ? data.totalClicks : 0,
      bought, path,
      startedAt: Number.isFinite(data.startedAt) ? data.startedAt : Date.now(),
      lastSaveAt: Number.isFinite(data.lastSaveAt) ? data.lastSaveAt : Date.now(),
      totalGoldenLeaves: Number.isFinite(data.totalGoldenLeaves) ? data.totalGoldenLeaves : 0,
      bestEnergy: Number.isFinite(data.bestEnergy) ? data.bestEnergy : 0,
    };

    activeCooldowns = {};
    if (data.activeCooldowns && typeof data.activeCooldowns === 'object') {
      const now = Date.now();
      for (const [id, ts] of Object.entries(data.activeCooldowns)) {
        if (ACTIVES.some(a => a.id === id) && Number.isFinite(ts) && ts > now) activeCooldowns[id] = ts;
      }
    }

    const now = Date.now();
    const elapsed = Math.min(now - state.lastSaveAt, 2 * 3600 * 1000);
    if (elapsed > 5000) {
      const offlineEPS = getEPS();
      const offlineGain = offlineEPS * (elapsed / 1000);
      if (offlineGain > 0) {
        state.energy += offlineGain;
        state.totalEarned += offlineGain;
        showOfflineModal(elapsed, offlineGain);
      }
    }
  } catch (e) {
    console.warn('Ошибка загрузки', e);
    state = createDefaultState();
    activeCooldowns = {};
  }
}

function save() {
  try {
    state.lastSaveAt = Date.now();
    if (state.energy > state.bestEnergy) state.bestEnergy = state.energy;
    const toSave = { ...state, activeCooldowns: { ...activeCooldowns } };
    localStorage.setItem(SAVE_KEY, JSON.stringify(toSave));
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    const ind = document.getElementById('save-indicator');
    ind.classList.add('show');
    clearTimeout(save._t);
    save._t = setTimeout(() => ind.classList.remove('show'), 1200);
  } catch (e) { console.warn('Ошибка сохранения', e); }
}

function showOfflineModal(elapsedMs, gain) {
  const overlay = document.getElementById('modal-overlay');
  const text = document.getElementById('modal-text');
  const cancel = document.getElementById('modal-cancel');
  const confirm = document.getElementById('modal-confirm');
  text.innerHTML = `🌙 Пока тебя не было (${formatTime(elapsedMs)}),<br>растение выработало<br><b style="color:#9fff9f;font-size:20px">+${formatNum(gain)}</b> энергии!`;
  cancel.style.display = 'none';
  confirm.textContent = 'Отлично!';
  confirm.classList.remove('danger');
  confirm.onclick = () => overlay.classList.remove('show');
  overlay.classList.add('show');
}

// ============================================================
// НАВИГАЦИЯ
// ============================================================
function showScreen(name) {
  if (currentScreen === name) return;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById('screen-' + name);
  if (target) target.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.screen === name);
  });
  currentScreen = name;

  if (name === 'game') scheduleGoldenLeaf();
  else { hideGoldenLeaf(); clearTimeout(goldenLeafTimeout); }

  if (name === 'menu') updateMenuStats();
  AudioSys.navigate();
}

function updateMenuStats() {
  document.getElementById('menu-energy').textContent = formatNum(state.energy);
  document.getElementById('menu-best').textContent = formatNum(state.bestEnergy);
  document.getElementById('menu-zone').textContent = ZONES[getZone()].name;
}

// ============================================================
// РЕНДЕР
// ============================================================
const els = {};
let shopCards = {};
let lastRenderedZone = -1;
let lastClickInfo = '';
let currentFilter = -1;
let activesPanel = null;
let activeButtons = {};
let categoryHeaders = {};

function cacheElements() {
  els.zoneName = document.getElementById('zone-name');
  els.energy = document.getElementById('energy');
  els.eps = document.getElementById('eps');
  els.plant = document.getElementById('plant');
  els.clickInfo = document.getElementById('click-info');
  els.upgradeList = document.getElementById('upgrade-list');
  els.zoneFilter = document.getElementById('zone-filter');
  els.specialization = document.getElementById('specialization');
  els.buffs = document.getElementById('buffs');
}

function buildShop() {
  els.upgradeList.innerHTML = '';
  shopCards = {};
  categoryHeaders = {};

  const byCategory = {};
  for (const u of UPGRADES) {
    const cat = u.category || 'eps';
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(u);
  }

  const sortedCats = Object.keys(byCategory).sort(
    (a, b) => (CATEGORIES[a]?.order || 99) - (CATEGORIES[b]?.order || 99)
  );

  for (const catId of sortedCats) {
    const cat = CATEGORIES[catId];
    const header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML = `<span>${cat.name}</span><span class="cat-count"></span>`;
    els.upgradeList.appendChild(header);
    categoryHeaders[catId] = { el: header, countEl: header.querySelector('.cat-count'), visibleCount: 0, totalCount: byCategory[catId].length };

    for (const u of byCategory[catId]) {
      const div = document.createElement('div');
      div.className = 'upgrade rarity-' + u.rarity;
      div.innerHTML = `
        <div class="icon-box">${u.icon || ''}<span class="qty"></span></div>
        <div class="content">
          <div class="name-row">
            <span class="name"></span>
            <span class="stars">${RARITIES[u.rarity]?.stars || ''}</span>
          </div>
          <div class="effect-badge"></div>
          <div class="hint"></div>
          <div class="bottom-row">
            <span class="cost"></span>
            <div class="progress"><div class="progress-bar"></div></div>
          </div>
        </div>
      `;
      div.addEventListener('click', () => {
        if (div.classList.contains('locked') || div.classList.contains('bought')) return;
        buyUpgrade(u);
      });
      els.upgradeList.appendChild(div);
      shopCards[u.id] = {
        el: div,
        qty: div.querySelector('.qty'),
        name: div.querySelector('.name'),
        stars: div.querySelector('.stars'),
        effectBadge: div.querySelector('.effect-badge'),
        hint: div.querySelector('.hint'),
        cost: div.querySelector('.cost'),
        progressBar: div.querySelector('.progress-bar'),
        lastKey: null,
      };
    }
  }
}

function buildSpecialization() {
  const zone = getZone();
  const unlocked = zone >= 1;
  let html = '<h3>🌳 Путь развития</h3><div class="paths">';
  for (const p of Object.values(PATHS)) {
    const chosen = state.path === p.id;
    const locked = !unlocked;
    html += `<div class="path ${chosen ? 'chosen' : ''} ${locked ? 'locked' : ''}" data-path="${p.id}" title="${p.desc}">
      <span class="icon">${p.icon}</span><div>${p.name}</div><div class="bonus">${p.desc}</div></div>`;
  }
  html += '</div>';
  els.specialization.innerHTML = html;

  els.specialization.querySelectorAll('.path').forEach(el => {
    el.addEventListener('click', () => {
      if (!unlocked) { AudioSys.error(); return; }
      const pathId = el.dataset.path;
      if (state.path === pathId) return;
      if (state.path) {
        showConfirm('Сменить путь развития? Текущий путь будет потерян.', () => {
          state.path = pathId;
          activeBuffs = []; activeCooldowns = {};
          buildSpecialization(); renderUI(); save();
          AudioSys.purchase('epic');
        });
      } else {
        state.path = pathId;
        buildSpecialization(); renderUI(); save();
        AudioSys.purchase('epic');
      }
    });
  });
}

function buildZoneFilter() {
  els.zoneFilter.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.textContent = 'Все';
  allBtn.className = 'active';
  allBtn.onclick = () => { currentFilter = -1; updateZoneFilter(); updateShop(); AudioSys.click(); };
  els.zoneFilter.appendChild(allBtn);

  for (let i = 0; i < ZONES.length; i++) {
    const btn = document.createElement('button');
    btn.textContent = ZONES[i].icon;
    btn.title = ZONES[i].name;
    btn.dataset.zone = i;
    btn.onclick = () => {
      if (parseInt(btn.dataset.zone) > getZone()) { AudioSys.error(); return; }
      currentFilter = i; updateZoneFilter(); updateShop(); AudioSys.click();
    };
    els.zoneFilter.appendChild(btn);
  }
}

function updateZoneFilter() {
  const btns = els.zoneFilter.querySelectorAll('button');
  const zone = getZone();
  btns.forEach((btn, idx) => {
    if (idx === 0) {
      btn.classList.toggle('active', currentFilter === -1);
      btn.classList.remove('locked');
    } else {
      const z = idx - 1;
      btn.classList.toggle('active', currentFilter === z);
      btn.classList.toggle('locked', z > zone);
    }
  });
}

function updateShop() {
  const zone = getZone();
  const filterZone = currentFilter === -1 ? null : currentFilter;

  const catStats = {};
  for (const catId in categoryHeaders) catStats[catId] = { visible: 0, bought: 0 };

  for (const u of UPGRADES) {
    const card = shopCards[u.id];
    if (!card) continue;

    const count = state.bought[u.id] || 0;
    const cost = getUpgradeCost(u);
    const isLocked = u.zone > zone;
    const isBought = cost === null;
    const affordable = !isLocked && !isBought && state.energy >= cost;

    let visible;
    if (filterZone !== null) visible = u.zone === filterZone;
    else visible = u.zone <= zone;

    if (!visible) {
      if (card.el.style.display !== 'none') card.el.style.display = 'none';
      continue;
    }
    if (card.el.style.display === 'none') card.el.style.display = '';
    catStats[u.category].visible++;
    if (count > 0) catStats[u.category].bought++;

    const synBonus = getSynergyBonus(u);
    const synActive = synBonus > 0;
    const progress = isBought ? 100 : isLocked ? 0 : Math.min(100, (state.energy / cost) * 100);

    const key = `${count}|${isLocked}|${isBought}|${affordable}|${cost}|${Math.floor(progress)}|${synActive}`;
    if (card.lastKey === key) continue;
    card.lastKey = key;

    card.qty.textContent = count > 0 ? count : '';
    card.qty.style.display = count > 0 ? '' : 'none';
    card.name.textContent = u.name;
    card.effectBadge.textContent = u.effectTag || '';

    // Подсказка: синергия или флейвор
    if (u.synergy) {
      const other = UPGRADES.find(x => x.id === u.synergy.with);
      const otherName = other?.name || u.synergy.with;
      if (synActive) {
        card.hint.className = 'hint synergy-active';
        card.hint.textContent = `✨ Синергия: +${Math.round(synBonus * 100)}% (${otherName})`;
      } else {
        card.hint.className = 'hint synergy-hint';
        card.hint.textContent = `🔗 Купи «${otherName}» → +${Math.round(u.synergy.bonus * 100)}%`;
      }
    } else {
      card.hint.className = 'hint';
      card.hint.textContent = u.hint || '';
    }

    if (isBought) {
      card.cost.textContent = '✅ МАКС';
    } else if (isLocked) {
      card.cost.textContent = '🔒 ' + formatNum(u.cost);
    } else {
      card.cost.textContent = formatNum(cost) + ' ⚡';
    }
    card.progressBar.style.width = progress + '%';

    card.el.classList.toggle('locked', isLocked);
    card.el.classList.toggle('bought', isBought);
    card.el.classList.toggle('affordable', affordable);
    card.el.classList.toggle('unaffordable', !affordable && !isLocked && !isBought);
  }

  for (const catId in categoryHeaders) {
    const h = categoryHeaders[catId];
    h.el.style.display = catStats[catId].visible > 0 ? '' : 'none';
    h.countEl.textContent = catStats[catId].bought + '/' + catStats[catId].visible;
  }

  updateZoneFilter();
}

function renderBuffs() {
  cleanBuffs();
  let html = '';
  const now = Date.now();
  for (const b of activeBuffs) {
    const left = Math.max(0, Math.ceil((b.expiresAt - now) / 1000));
    const def = ACTIVES.find(a => a.id === b.id);
    const icon = def ? def.icon : (b.id.startsWith('golden') ? '🌟' : '✨');
    const name = def ? def.name : (b.id === 'golden_eps' ? 'Золотой EPS' : b.id === 'golden_click' ? 'Золотой клик' : b.id);
    html += `<div class="buff">${icon} ${name} · ${left}с</div>`;
  }
  if (els.buffs.innerHTML !== html) els.buffs.innerHTML = html;
}

function renderUI() {
  const zone = getZone();
  if (zone !== lastRenderedZone) {
    els.zoneName.textContent = ZONES[zone].name;
    els.plant.textContent = PLANTS[Math.min(zone, PLANTS.length - 1)];
    lastRenderedZone = zone;
  }
  els.energy.textContent = formatNum(state.energy);
  els.eps.textContent = '+' + formatNum(getEPS()) + ' / сек';

  const auto = getAutoClickRate();
  const ci = 'Клик: +' + formatNum(getClickPower()) + (auto > 0 ? '   •   Авто: ' + auto + '/сек' : '');
  if (ci !== lastClickInfo) {
    els.clickInfo.textContent = ci;
    lastClickInfo = ci;
  }
  renderBuffs();
  updateShop();
}

// ============================================================
// АКТИВНЫЕ СПОСОБНОСТИ
// ============================================================
function buildActivesPanel() {
  if (activesPanel) return;
  activesPanel = document.createElement('div');
  activesPanel.id = 'actives-panel';
  activesPanel.innerHTML = '<h3>⚡ Активные способности</h3>';
  for (const a of ACTIVES) {
    const btn = document.createElement('button');
    btn.className = 'active-btn cannot-use';
    btn.innerHTML = `<span>${a.icon} ${a.name}<br><span class="desc">${a.desc}</span></span><span class="status"></span>`;
    btn.onclick = () => activateBuff(a);
    activesPanel.appendChild(btn);
    activeButtons[a.id] = { el: btn, statusEl: btn.querySelector('.status'), lastKey: null };
  }
  els.specialization.parentNode.insertBefore(activesPanel, els.specialization.nextSibling);
}

function updateActives() {
  const now = Date.now();
  for (const a of ACTIVES) {
    const btn = activeButtons[a.id];
    if (!btn) continue;
    const cdLeft = Math.max(0, (activeCooldowns[a.id] || 0) - now);
    const canUse = cdLeft === 0 && state.energy >= a.cost;
    const key = `${cdLeft > 0 ? Math.ceil(cdLeft / 1000) : 0}|${canUse}|${state.energy >= a.cost}`;
    if (btn.lastKey === key) continue;
    btn.lastKey = key;
    btn.el.classList.toggle('can-use', canUse);
    btn.el.classList.toggle('cannot-use', !canUse);
    btn.statusEl.textContent = cdLeft > 0 ? '⏳ ' + Math.ceil(cdLeft / 1000) + 'с' : formatNum(a.cost) + ' ⚡';
  }
}

function activateBuff(a) {
  const now = Date.now();
  if ((activeCooldowns[a.id] || 0) > now) return;
  if (state.energy < a.cost) { AudioSys.error(); return; }
  state.energy -= a.cost;
  activeBuffs.push({ id: a.id, expiresAt: now + a.duration, effect: a.effect });
  activeCooldowns[a.id] = now + a.cooldown;
  AudioSys.buff();
  renderUI();
  save();
}

// ============================================================
// ДЕЙСТВИЯ
// ============================================================
function buyUpgrade(u) {
  const cost = getUpgradeCost(u);
  if (cost === null || state.energy < cost) { AudioSys.error(); return; }
  state.energy -= cost;
  state.bought[u.id] = (state.bought[u.id] || 0) + 1;
  AudioSys.purchase(u.rarity);
  renderUI();
  save();
}

function clickPlant(e) {
  const power = getClickPower();
  state.energy += power;
  state.totalEarned += power;
  state.totalClicks++;
  AudioSys.click();
  spawnFloat(e, '+' + formatNum(power));
  renderUI();
}

function spawnFloat(e, text) {
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = text;
  const gameEl = document.getElementById('game');
  const rect = gameEl.getBoundingClientRect();
  let x, y;
  if (e && Number.isFinite(e.clientX) && Number.isFinite(e.clientY) && e.clientX >= 0 && e.clientY >= 0) {
    x = e.clientX - rect.left; y = e.clientY - rect.top;
  } else {
    const pRect = els.plant.getBoundingClientRect();
    x = pRect.left - rect.left + pRect.width / 2;
    y = pRect.top - rect.top + pRect.height / 2;
  }
  el.style.left = (x - 20) + 'px';
  el.style.top = (y - 20) + 'px';
  gameEl.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}

// ============================================================
// ЗОЛОТОЙ ЛИСТ
// ============================================================
function scheduleGoldenLeaf() {
  clearTimeout(goldenLeafTimeout);
  if (currentScreen !== 'game') return;
  const delay = 60000 + Math.random() * 120000;
  goldenLeafTimeout = setTimeout(showGoldenLeaf, delay);
}

function showGoldenLeaf() {
  if (goldenLeafVisible) return;
  if (currentScreen !== 'game') return;
  goldenLeafVisible = true;
  const el = document.getElementById('golden-leaf');
  const maxX = window.innerWidth - 80;
  const maxY = window.innerHeight - 80;
  el.style.left = (40 + Math.random() * maxX) + 'px';
  el.style.top = (40 + Math.random() * maxY) + 'px';
  el.classList.add('show');

  el.onclick = () => {
    if (!goldenLeafVisible) return;
    hideGoldenLeaf();
    state.totalGoldenLeaves++;
    AudioSys.golden();
    giveGoldenReward();
    scheduleGoldenLeaf();
  };

  clearTimeout(goldenLeafHideTimeout);
  goldenLeafHideTimeout = setTimeout(() => {
    if (goldenLeafVisible) {
      hideGoldenLeaf();
      scheduleGoldenLeaf();
    }
  }, 8000);
}

function hideGoldenLeaf() {
  goldenLeafVisible = false;
  document.getElementById('golden-leaf').classList.remove('show');
  clearTimeout(goldenLeafHideTimeout);
}

function giveGoldenReward() {
  const roll = Math.random();
  if (roll < 0.5) {
    const gain = Math.max(100, getEPS() * 60);
    state.energy += gain; state.totalEarned += gain;
    showToast(`🌟 +${formatNum(gain)} энергии!`);
  } else if (roll < 0.85) {
    activeBuffs.push({ id: 'golden_eps', expiresAt: Date.now() + 20000, effect: { type: 'eps', mult: 3 } });
    showToast('🌟 ×3 к EPS на 20 сек!');
  } else {
    activeBuffs.push({ id: 'golden_click', expiresAt: Date.now() + 15000, effect: { type: 'click', mult: 5 } });
    showToast('🌟 ×5 к клику на 15 сек!');
  }
  renderUI(); save();
}

function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;top:30%;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(60,40,10,0.95),rgba(40,25,5,0.95));color:#ffdd66;padding:14px 24px;border-radius:10px;border:2px solid #ffaa00;font-size:16px;font-weight:bold;z-index:2000;pointer-events:none;box-shadow:0 0 30px rgba(255,170,0,0.8);animation:toastPop 2s ease-out forwards;`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// ============================================================
// МОДАЛКИ
// ============================================================
function showConfirm(text, onConfirm) {
  const overlay = document.getElementById('modal-overlay');
  const t = document.getElementById('modal-text');
  const cancel = document.getElementById('modal-cancel');
  const confirm = document.getElementById('modal-confirm');
  t.innerHTML = text;
  cancel.style.display = '';
  confirm.textContent = 'Подтвердить';
  confirm.classList.add('danger');
  cancel.onclick = () => { overlay.classList.remove('show'); AudioSys.click(); };
  confirm.onclick = () => { overlay.classList.remove('show'); onConfirm(); };
  overlay.classList.add('show');
}

function confirmReset() {
  showConfirm('⚠️ Точно сбросить весь прогресс?<br><b>Это действие необратимо.</b>', () => {
    localStorage.removeItem(SAVE_KEY);
    state = createDefaultState();
    activeBuffs = []; activeCooldowns = {};
    lastRenderedZone = -1;
    buildShop(); buildSpecialization(); renderUI(); save();
    AudioSys.error();
  });
}

// ============================================================
// ИГРОВОЙ ЦИКЛ
// ============================================================
let lastTick = performance.now();
let lastRenderTime = 0;
let lastActivesUpdate = 0;

function gameLoop(now) {
  const dt = Math.min((now - lastTick) / 1000, 1);
  lastTick = now;

  const eps = getEPS();
  if (eps > 0) { state.energy += eps * dt; state.totalEarned += eps * dt; }
  const auto = getAutoClickRate();
  if (auto > 0) {
    const gain = auto * getClickPower() * dt;
    state.energy += gain; state.totalEarned += gain;
  }

  if (now - lastRenderTime >= 100) { renderUI(); lastRenderTime = now; }
  if (now - lastActivesUpdate >= 250) { updateActives(); lastActivesUpdate = now; }
  requestAnimationFrame(gameLoop);
}

// ============================================================
// ФОН
// ============================================================
function spawnSpores() {
  const bg = document.getElementById('bg');
  for (let i = 0; i < 15; i++) {
    const s = document.createElement('div');
    s.className = 'spore';
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDuration = (8 + Math.random() * 12) + 's';
    s.style.animationDelay = (Math.random() * 10) + 's';
    s.style.opacity = 0.2 + Math.random() * 0.3;
    const size = 2 + Math.random() * 4;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    bg.appendChild(s);
  }
}

// ============================================================
// СТИЛЬ ТОСТА
// ============================================================
if (!document.getElementById('style-toast')) {
  const s = document.createElement('style');
  s.id = 'style-toast';
  s.textContent = `@keyframes toastPop {
    0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
    20% { transform: translateX(-50%) scale(1.1); opacity: 1; }
    80% { transform: translateX(-50%) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) scale(1); opacity: 0; }
  }`;
  document.head.appendChild(s);
}

// ============================================================
// НАСТРОЙКИ
// ============================================================
function initSettings() {
  const volSlider = document.getElementById('volume-slider');
  const volValue = document.getElementById('volume-value');
  const volIcon = document.getElementById('vol-icon');
  const musicSlider = document.getElementById('music-slider');
  const musicValue = document.getElementById('music-value');

  volSlider.value = Math.round(settings.volume * 100);
  volValue.textContent = Math.round(settings.volume * 100) + '%';
  volSlider.style.setProperty('--fill', Math.round(settings.volume * 100) + '%');
  updateVolIcon();

  musicSlider.value = Math.round(settings.musicVolume * 100);
  musicValue.textContent = Math.round(settings.musicVolume * 100) + '%';
  musicSlider.style.setProperty('--fill', Math.round(settings.musicVolume * 100) + '%');

  volSlider.addEventListener('input', (e) => {
    const v = parseInt(e.target.value);
    settings.volume = v / 100;
    volValue.textContent = v + '%';
    volSlider.style.setProperty('--fill', v + '%');
    AudioSys.setVolume(settings.volume);
    updateVolIcon();
  });
  volSlider.addEventListener('change', () => { AudioSys.click(); save(); });

  musicSlider.addEventListener('input', (e) => {
    const v = parseInt(e.target.value);
    settings.musicVolume = v / 100;
    musicValue.textContent = v + '%';
    musicSlider.style.setProperty('--fill', v + '%');
    AudioSys.setMusicVolume(settings.musicVolume);
  });
  musicSlider.addEventListener('change', () => save());

  function updateVolIcon() {
    if (settings.volume === 0) volIcon.textContent = '🔇';
    else if (settings.volume < 0.3) volIcon.textContent = '🔈';
    else if (settings.volume < 0.7) volIcon.textContent = '🔉';
    else volIcon.textContent = '🔊';
  }

  document.getElementById('settings-reset').addEventListener('click', () => {
    AudioSys.error(); confirmReset();
  });
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
function init() {
  cacheElements();
  load();

  AudioSys.init();
  AudioSys.setVolume(settings.volume);
  AudioSys.setMusicVolume(settings.musicVolume);

  buildShop();
  buildSpecialization();
  buildZoneFilter();
  buildActivesPanel();
  initSettings();
  renderUI();
  spawnSpores();
  updateMenuStats();

  const unlockAudio = () => {
    AudioSys.resume();
    AudioSys.startMusic();
    document.removeEventListener('click', unlockAudio);
    document.removeEventListener('touchstart', unlockAudio);
  };
  document.addEventListener('click', unlockAudio);
  document.addEventListener('touchstart', unlockAudio);

  document.getElementById('menu-play').addEventListener('click', () => showScreen('game'));

  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => showScreen(btn.dataset.screen));
  });

  els.plant.addEventListener('click', clickPlant);

  lastTick = performance.now();
  requestAnimationFrame(gameLoop);

  setInterval(save, 10000);
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) save();
  });
}

init();
</script>
