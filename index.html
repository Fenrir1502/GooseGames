        .icon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 420px; margin-bottom: 8px; position: relative; z-index: 2; }
        .app-icon {

        .tg-btn::after {

        .tg-btn:active { transform: scale(0.96); }

        }
        @media (prefers-reduced-motion: reduce) { .goose-logo, .app-icon, .tg-btn, .tg-btn::after { animation: none; } }
        /* Неон: плитки в шахматном порядке */
        body { background: radial-gradient(70% 40% at 50% 0%, rgba(255,34,68, 0.22), transparent 65%), repeating-linear-gradient(0deg, transparent 0 31px, rgba(57,255,136, 0.08) 31px 32px), repeating-linear-gradient(90deg, transparent 0 31px, rgba(57,255,136, 0.08) 31px 32px), #06000f; }

        .section-label { color: #39ff88; text-shadow: 0 0 8px rgba(57,255,136, 0.7); }
        .section-label::before { content: "// "; }

    </style>
</head>

    <script>
        (function() {
            const canvas = document.getElementById('snow-canvas');
            const ctx = canvas.getContext('2d');
            let W = window.innerWidth, H = window.innerHeight;
            canvas.width = W; canvas.height = H;
            const snowflakes = [];
            for (let i = 0; i < 100; i++) {
                snowflakes.push({
                    x: Math.random() * W, y: Math.random() * H,
                    radius: Math.random() * 2.5 + 0.5, speedY: Math.random() * 1.2 + 0.3,
                    speedX: Math.random() * 0.6 - 0.3, sway: Math.random() * Math.PI * 2,
                    swaySpeed: Math.random() * 0.02 + 0.01, opacity: Math.random() * 0.7 + 0.3
                });
            }
            function drawSnow() {
                ctx.clearRect(0, 0, W, H);
                snowflakes.forEach(snow => {
                    ctx.beginPath(); ctx.arc(snow.x, snow.y, snow.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${snow.opacity})`; ctx.fill();
                    snow.y += snow.speedY; snow.sway += snow.swaySpeed;
                    snow.x += Math.sin(snow.sway) * 0.8 + snow.speedX;
                    if (snow.y > H) { snow.y = -10; snow.x = Math.random() * W; }
                    if (snow.x > W) snow.x = -10;
                    if (snow.x < -10) snow.x = W + 10;
                });
                requestAnimationFrame(drawSnow);
            }
            drawSnow();
            window.addEventListener('resize', () => {
                W = window.innerWidth; H = window.innerHeight;
                canvas.width = W; canvas.height = H;
            });
        })();
    </script>
<script>
// Плашки на иконках: текст внутри .badge задаёт вид.
// пусто — не видна; бета — зелёная «beta»; релиз — красная «release»; скоро — серая «soon», игра закрыта
document.querySelectorAll('.badge').forEach(function (el) {
    var t = el.textContent.trim().toLowerCase();
    if (t === 'бета' || t === 'beta') { el.textContent = 'beta'; el.classList.add('beta'); }
    else if (t === 'релиз' || t === 'release') { el.textContent = 'release'; el.classList.add('release'); }
    else if (t === 'скоро' || t === 'soon') {
        el.textContent = 'soon'; el.classList.add('soon');
        var tile = el.closest('.app-icon');
        if (tile) { tile.classList.add('soon'); tile.setAttribute('aria-disabled', 'true'); var cta = tile.querySelector('.featured-cta'); if (cta) cta.textContent = 'Скоро'; }
    }
    else { el.textContent = ''; }
});
document.querySelectorAll('.app-icon').forEach(function (a) {
    a.addEventListener('click', function (e) {
        if (a.classList.contains('soon')) { e.preventDefault(); return; }
        if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
        e.preventDefault();
        if (navigator.vibrate) navigator.vibrate(12);
        document.body.classList.add('leaving');
        setTimeout(function () { location.href = a.href; }, 180);
    });
});
window.addEventListener('pageshow', function () { document.body.classList.remove('leaving'); });
</script>
<script>

}
</script>
