    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background: radial-gradient(circle at 50% 0%, #1a2a3a 0%, #05000d 70%);
            color: white; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom));
            overflow-x: hidden; position: relative;
        }
        .garland { position: fixed; top: 0; left: 0; right: 0; height: 10px; display: flex; justify-content: space-around; pointer-events: none; z-index: 10; }
        .light { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; animation: blink 2s infinite alternate; box-shadow: 0 0 12px currentColor; }
        .light:nth-child(odd) { animation-delay: 0.5s; }
        .light:nth-child(3n) { animation-delay: 1s; }
        .light:nth-child(4n) { animation-delay: 1.5s; }
        .light.red { color: #ff2244; background: #ff2244; }
        .light.gold { color: #ffd700; background: #ffd700; }
        .light.blue { color: #00aaff; background: #00aaff; }
        .light.green { color: #00ff88; background: #00ff88; }
        @keyframes blink { 0% { opacity: 0.4; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.1); } }
        
        #snow-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
        
        .goose-logo {
            width: 140px; height: 140px; border-radius: 50%;
            border: 3px solid #ffd700; box-shadow: 0 0 40px rgba(255, 215, 0, 0.6), 0 0 80px rgba(255, 34, 68, 0.2);
            margin-bottom: 15px; object-fit: cover; animation: floatLogo 4s ease-in-out infinite;
            position: relative; z-index: 2;
        }
        @keyframes floatLogo { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
        h1 { color: #ffd700; font-size: 2.5em; margin-bottom: 5px; text-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 0 40px rgba(255, 34, 68, 0.3); letter-spacing: 2px; position: relative; z-index: 2; }
        p { color: #aaddff; font-size: 1.1em; margin-bottom: 25px; position: relative; z-index: 2; }

        .icon-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            width: 100%; max-width: 420px; margin-top: 10px; margin-bottom: 30px;
            position: relative; z-index: 2;
        }
        .app-icon { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: white; transition: transform 0.15s ease-out; }
        .app-icon img {
            width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 22%;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.15);
            margin-bottom: 10px; border: 2px solid rgba(255, 215, 0, 0.4); transition: filter 0.15s, border-color 0.15s;
        }
        .app-icon span { font-size: 0.95em; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.8); text-align: center; letter-spacing: 0.5px; color: #fff4d8; }
        .app-icon:last-child:nth-child(odd) { grid-column: 1 / -1; justify-self: center; width: calc(50% - 10px); }
        .app-icon:active { transform: scale(0.90); }
        .app-icon:active img { filter: brightness(0.7); }
        @media (hover: hover) {
            .app-icon:hover { transform: translateY(-5px); }
            .app-icon:hover img { border-color: rgba(255, 215, 0, 1); box-shadow: 0 12px 25px rgba(255, 215, 0, 0.4), 0 0 30px rgba(255, 34, 68, 0.2); }
        }

        .tg-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            background: linear-gradient(135deg, #cc0020, #800010); color: #fff4d8;
            padding: 14px 28px; border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 1em;
            box-shadow: 0 6px 20px rgba(204, 0, 32, 0.6), 0 0 20px rgba(255, 215, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s; border: 2px solid #ffd700; width: 100%; max-width: 320px;
            position: relative; z-index: 2; animation: btnPulse 3s ease-in-out infinite;
        }
        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 6px 20px rgba(204, 0, 32, 0.6), 0 0 20px rgba(255, 215, 0, 0.3); }
            50% { box-shadow: 0 6px 25px rgba(204, 0, 32, 0.8), 0 0 35px rgba(255, 215, 0, 0.6); }
        }
        .tg-btn svg { width: 24px; height: 24px; flex-shrink: 0; }
        .tg-btn:active { transform: scale(0.96); }
        @media (hover: hover) { .tg-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(204, 0, 32, 0.8), 0 0 40px rgba(255, 215, 0, 0.8); } }
    </style>
</head>

    <script>
        (function() {
            const canvas = document.getElementById('snow-canvas');
            const ctx = canvas.getContext('2d');
            let W = window.innerWidth, H = window.innerHeight;
            canvas.width = W; canvas.height = H;
            const snowflakes = [];
            for (let i = 0; i < 100; i++) {
                snowflakes.push({
                    x: Math.random() * W, y: Math.random() * H,
                    radius: Math.random() * 2.5 + 0.5, speedY: Math.random() * 1.2 + 0.3,
                    speedX: Math.random() * 0.6 - 0.3, sway: Math.random() * Math.PI * 2,
                    swaySpeed: Math.random() * 0.02 + 0.01, opacity: Math.random() * 0.7 + 0.3
                });
            }
            function drawSnow() {
                ctx.clearRect(0, 0, W, H);
                snowflakes.forEach(snow => {
                    ctx.beginPath(); ctx.arc(snow.x, snow.y, snow.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${snow.opacity})`; ctx.fill();
                    snow.y += snow.speedY; snow.sway += snow.swaySpeed;
                    snow.x += Math.sin(snow.sway) * 0.8 + snow.speedX;
                    if (snow.y > H) { snow.y = -10; snow.x = Math.random() * W; }
                    if (snow.x > W) snow.x = -10;
                    if (snow.x < -10) snow.x = W + 10;
                });
                requestAnimationFrame(drawSnow);
            }
            drawSnow();
            window.addEventListener('resize', () => {
                W = window.innerWidth; H = window.innerHeight;
                canvas.width = W; canvas.height = H;
            });
        })();
    </script>
