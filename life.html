<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Жизнь — симулятор судьбы</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    color: #eaeaea;
  }
  .game {
    width: 100%;
    max-width: 760px;
    background: rgba(22, 33, 62, 0.92);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
    padding: 28px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
  }
  h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #f9c74f, #f8961e, #f3722c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 1px;
  }
  .subtitle {
    text-align: center;
    color: #9aa5b1;
    font-size: 0.9rem;
    margin-bottom: 22px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
  .stat {
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 10px 12px;
    border: 1px solid rgba(255,255,255,0.07);
  }
  .stat-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8b98a5;
    margin-bottom: 3px;
  }
  .stat-value {
    font-size: 1.05rem;
    font-weight: 700;
    color: #f9c74f;
  }
  .bar-wrap {
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 6px;
    overflow: hidden;
    margin-top: 6px;
  }
  .bar { height: 100%; border-radius: 6px; transition: width 0.4s ease; }
  .bar.money { background: linear-gradient(90deg, #f9c74f, #f8961e); }
  .bar.health { background: linear-gradient(90deg, #f94144, #f3722c); }
  .bar.happy { background: linear-gradient(90deg, #577590, #43aa8b); }
  .bar.edu { background: linear-gradient(90deg, #9b5de5, #f15bb5); }
  .bar.social { background: linear-gradient(90deg, #577590, #9b5de5); }
  .bar.faith { background: linear-gradient(90deg, #f4a261, #e76f51); }
  .bar.mental { background: linear-gradient(90deg, #a06cd5, #e056fd); }
  .bar.beauty { background: linear-gradient(90deg, #ffb6b9, #f6416c); }
  .bar.mental.low { background: linear-gradient(90deg, #f94144, #f3722c); }

  .traits {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
    min-height: 28px;
  }
  .trait {
    background: rgba(155, 93, 229, 0.2);
    border: 1px solid rgba(155, 93, 229, 0.5);
    color: #d4b3ff;
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .event-card {
    background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    min-height: 100px;
  }
  .age-badge {
    display: inline-block;
    background: linear-gradient(90deg, #f8961e, #f3722c);
    color: #1a1a2e;
    font-weight: 800;
    font-size: 0.8rem;
    padding: 3px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .age-badge.special { background: linear-gradient(90deg, #9b5de5, #f15bb5); color: #fff; }
  .age-badge.dark { background: linear-gradient(90deg, #6a040f, #370617); color: #fff; }
  .age-badge.beauty { background: linear-gradient(90deg, #ffb6b9, #f6416c); color: #fff; }
  .age-badge.army { background: linear-gradient(90deg, #495057, #212529); color: #fff; }
  .event-text {
    font-size: 1.05rem;
    line-height: 1.6;
    color: #e8e8e8;
  }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  button.choice {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: #eaeaea;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 0.98rem;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
    line-height: 1.4;
  }
  button.choice:hover {
    background: rgba(249, 199, 79, 0.15);
    border-color: #f9c74f;
    transform: translateX(4px);
  }
  button.choice:active { transform: scale(0.98); }
  button.choice .effect {
    display: block;
    font-size: 0.78rem;
    color: #8b98a5;
    margin-top: 4px;
  }
  button.choice .note {
    display: block;
    font-size: 0.75rem;
    color: #f9c74f;
    margin-top: 4px;
    font-style: italic;
  }
  button.choice:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  button.primary {
    background: linear-gradient(90deg, #f8961e, #f3722c);
    color: #1a1a2e;
    font-weight: 700;
    text-align: center;
    border: none;
    padding: 15px;
    font-size: 1.05rem;
    width: 100%;
    margin-top: 8px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  button.primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(248, 150, 30, 0.35);
    background: linear-gradient(90deg, #f9c74f, #f8961e);
  }

  .debt-btn-wrap {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 14px;
    gap: 8px;
    flex-wrap: wrap;
  }
  button.debt-btn {
    background: linear-gradient(135deg, rgba(249,199,79,0.25), rgba(248,150,30,0.15));
    border: 1px solid rgba(249, 199, 79, 0.7);
    color: #f9c74f;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 700;
    transition: all 0.2s;
    font-family: inherit;
  }
  button.debt-btn:hover {
    background: linear-gradient(135deg, rgba(249,199,79,0.4), rgba(248,150,30,0.3));
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(249, 199, 79, 0.3);
  }
  button.child-btn {
    background: rgba(67,170,139,0.2); border: 1px solid rgba(67,170,139,0.6); color: #90e0c0;
    padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: 700;
    transition: all 0.2s; font-family: inherit;
  }
  button.child-btn:hover {
    background: rgba(67,170,139,0.4);
    transform: translateY(-1px);
  }
  button.child-btn:disabled {
    opacity: 0.4; cursor: not-allowed; transform: none;
  }
  button.adopt-btn {
    background: rgba(155,93,229,0.2); border: 1px solid rgba(155,93,229,0.6); color: #d4b3ff;
    padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: 700;
    transition: all 0.2s; font-family: inherit;
  }
  button.adopt-btn:hover {
    background: rgba(155,93,229,0.4);
    transform: translateY(-1px);
  }
  button.adopt-btn:disabled {
    opacity: 0.4; cursor: not-allowed; transform: none;
  }

  .log {
    max-height: 150px;
    overflow-y: auto;
    margin-top: 18px;
    padding: 12px;
    background: rgba(0,0,0,0.25);
    border-radius: 12px;
    font-size: 0.82rem;
    line-height: 1.6;
    color: #a8b3bd;
  }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb { background: #f8961e; border-radius: 3px; }
  .log p { margin-bottom: 4px; }
  .log .up { color: #90be6d; }
  .log .down { color: #f94144; }
  .log .special { color: #d4b3ff; }
  .log .mental { color: #e056fd; }
  .hidden { display: none !important; }

  .final { text-align: center; }
  .final h2 {
    font-size: 1.7rem;
    margin-bottom: 14px;
    background: linear-gradient(90deg, #f9c74f, #f3722c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .final .desc {
    font-size: 1rem;
    line-height: 1.7;
    color: #c8d1d9;
    margin-bottom: 18px;
  }
  .achievements-box {
    background: rgba(0,0,0,0.25);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 18px;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s;
  }
  .achievements-box:hover {
    background: rgba(0,0,0,0.35);
  }
  .achievements-box h3 {
    font-size: 0.9rem;
    color: #f9c74f;
    margin-bottom: 0;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .achievements-box h3 .chevron {
    transition: transform 0.3s;
    display: inline-block;
  }
  .achievements-box.expanded h3 .chevron {
    transform: rotate(180deg);
  }
  .ach-content {
    display: none;
    margin-top: 12px;
    max-height: 300px;
    overflow-y: auto;
    padding-right: 6px;
  }
  .achievements-box.expanded .ach-content {
    display: block;
  }
  .ach-content::-webkit-scrollbar { width: 6px; }
  .ach-content::-webkit-scrollbar-thumb { background: #f8961e; border-radius: 3px; }
  .ach-item { font-size: 0.85rem; color: #d4b3ff; padding: 3px 0; }
  .ach-item.locked { color: #555; }
  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    padding: 2px 0;
    color: #c8d1d9;
  }
  .identity-box {
    background: rgba(155,93,229,0.12);
    border: 1px solid rgba(155,93,229,0.35);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 0.9rem;
    line-height: 1.5;
    color: #d4b3ff;
  }
  .name-input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
    color: #eaeaea;
    font-size: 1rem;
    font-family: inherit;
    margin-top: 10px;
    outline: none;
  }
  .name-input:focus { border-color: #f9c74f; }
  .name-input.error { border-color: #f94144; }
  .name-error {
    color: #f94144;
    font-size: 0.82rem;
    margin-top: 6px;
    min-height: 18px;
  }
  .relationship-badge {
    display: inline-block;
    background: rgba(249, 65, 68, 0.2);
    border: 1px solid rgba(249, 65, 68, 0.5);
    color: #ff9999;
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 20px;
  }
  
  .preview-box {
    position: relative;
    background: linear-gradient(160deg, rgba(249,199,79,0.12), rgba(248,150,30,0.05));
    border: 1px solid rgba(249,199,79,0.4);
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .reroll-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(249, 199, 79, 0.2);
    border: 1px solid rgba(249, 199, 79, 0.6);
    color: #f9c74f;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.82rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
    font-family: inherit;
    z-index: 10;
  }
  .reroll-btn:hover {
    background: rgba(249, 199, 79, 0.4);
    transform: translateY(-1px);
  }
  .preview-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #f9c74f;
    margin-bottom: 14px;
    font-weight: 800;
    padding-right: 120px;
  }
  .preview-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .preview-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.92rem;
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.04);
  }
  .preview-row .lbl {
    color: #8b98a5;
    font-size: 0.84rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .preview-row b {
    color: #f9c74f;
    font-weight: 600;
    text-align: right;
  }
  .preview-row.warn b { color: #ff9999; }
  .preview-row.good b { color: #90e0c0; }
  .preview-note {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 0.84rem;
    color: #d4b3ff;
    line-height: 1.6;
    font-style: italic;
  }
  
  .name-hint {
    font-size: 0.82rem;
    color: #8b98a5;
    margin-top: 6px;
    font-style: italic;
  }
  .records-top {
    background: linear-gradient(160deg, rgba(249,199,79,0.15), rgba(248,150,30,0.05));
    border: 1px solid rgba(249,199,79,0.45);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 18px;
    font-size: 0.88rem;
    line-height: 1.7;
  }
  .records-top h3 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    color: #f9c74f;
    font-weight: 800;
  }
  .records-top .rec-row {
    display: flex;
    justify-content: space-between;
    color: #d8d0b0;
    padding: 1px 0;
  }
  .records-top .rec-row b { color: #f9c74f; font-weight: 700; }

  .download-btn {
    background: linear-gradient(90deg, #43aa8b, #90be6d);
    color: #1a1a2e;
    font-weight: 700;
    text-align: center;
    border: none;
    padding: 15px;
    font-size: 1.05rem;
    width: 100%;
    margin-top: 10px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .download-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(67, 170, 139, 0.35);
  }
</style>
</head>
<body>
<div class="game">
  <h1>Жизнь</h1>
  <p class="subtitle">Симулятор судьбы — от рождения до итога</p>

  <div id="startScreen">
    <div class="records-top" id="recordsBox"></div>
    <div class="achievements-box" id="achMenu" onclick="toggleMenuAchievements()">
      <h3><span>Все достижения (<span id="achCountLabel">0</span>)</span><span class="chevron">▼</span></h3>
      <div class="ach-content" id="achMenuContent"></div>
    </div>
    <div class="event-card">
      <p class="event-text">
        Ты ещё не родился. Судьба готовит тебе случайную страну, пол, семью и стартовые условия.
        Каждый выбор меняет исход жизни.
      </p>
    </div>
    <button class="primary" onclick="showNameScreen()">🎲 Родиться</button>
  </div>

  <div id="nameScreen" class="hidden">
    <div class="preview-box" id="previewBox">
      <button class="reroll-btn" onclick="rerollPreview(event)">🔄 Перебросить</button>
    </div>
    <div class="event-card">
      <p class="event-text">Введи имя персонажа:</p>
      <input type="text" id="nameInput" class="name-input" placeholder="" maxlength="20" autocomplete="off">
      <p class="name-hint" id="nameHint"></p>
      <p class="name-error" id="nameError"></p>
    </div>
    <button class="primary" onclick="startGame()">▶ Начать жизнь</button>
  </div>

  <div id="gameScreen" class="hidden">
    <div class="identity-box" id="identityBox"></div>
    <div class="stats" id="stats"></div>
    <div class="traits" id="traits"></div>
    
    <div class="debt-btn-wrap hidden" id="debtBtnWrap">
      <button class="debt-btn" onclick="takeDebt()">💳 Взять в долг 50</button>
    </div>
    <div class="debt-btn-wrap hidden" id="childBtnWrap">
      <button class="child-btn" id="childBtn" onclick="suggestChild()">👶 Предложить партнёру завести ребёнка</button>
    </div>
    <div class="debt-btn-wrap hidden" id="adoptBtnWrap">
      <button class="adopt-btn" id="adoptBtn" onclick="tryAdopt()">🏡 Усыновить ребёнка</button>
    </div>

    <div class="event-card">
      <span class="age-badge" id="ageBadge">Возраст: 0</span>
      <p class="event-text" id="eventText"></p>
    </div>
    <div class="choices" id="choices"></div>
    <div class="log" id="log"></div>
  </div>

  <div id="finalScreen" class="hidden final">
    <h2 id="finalTitle"></h2>
    <div id="finalStats"></div>
    <p class="desc" id="finalDesc"></p>
    <div class="achievements-box" id="achBox" onclick="toggleAchievements()">
      <h3><span id="achTitle">Достижения</span><span class="chevron">▼</span></h3>
      <div class="ach-content" id="achContent"></div>
    </div>
    <div class="records-top" id="recordsBoxFinal"></div>
    <button class="download-btn" onclick="downloadLifeSummary()">📥 Скачать итог жизни</button>
    <button class="primary" onclick="restart()">🔄 Прожить ещё раз</button>
  </div>
</div>

<script>
/* ============================================================
   ХЕЛПЕРЫ
   ============================================================ */
function num(v) { return (typeof v === "number" && !isNaN(v)) ? v : 0; }
function str(v) { return (typeof v === "string") ? v : ""; }
function bool(v) { return v === true; }
function isArr(v) { return Array.isArray(v) ? v : []; }
function rand(min, max) { return Math.floor(Math.random()*(max-min+1))+min; }
function clamp(v, min=0, max=100) { return Math.max(min, Math.min(max, Math.round(v))); }
function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function chance(p) { return Math.random() < p; }

/* ============================================================
   ДОСТИЖЕНИЯ
   ============================================================ */
const ACHIEVEMENTS = [
  { id:"rich",       name:"💰 Богач",            test:()=> num(S.money)>=120 },
  { id:"healthy",    name:"❤️ Долгожитель",      test:()=> num(S.health)>=85 },
  { id:"happy",      name:"😊 Счастливчик",      test:()=> num(S.happiness)>=85 },
  { id:"smart",      name:"🎓 Эрудит",           test:()=> num(S.education)>=85 },
  { id:"family",     name:"👨‍👩‍👧 Многодетный",    test:()=> num(S.siblings)>=5 },
  { id:"migrant",    name:"✈️ Эмигрант",         test:()=> bool(S.emigrated) },
  { id:"survivor",   name:"🛡️ Выживший",         test:()=> num(S.health)>0 && num(S.age)>=65 },
  { id:"balanced",   name:"⚖️ Гармония",         test:()=> num(S.money)>=50 && num(S.health)>=60 && num(S.happiness)>=60 && num(S.education)>=60 },
  { id:"poor",       name:"🥲 Скромная жизнь",   test:()=> num(S.money)<=5 && num(S.age)>=65 },
  { id:"love",       name:"💕 Нашёл любовь",     test:()=> bool(S.foundLove) },
  { id:"pride",      name:"🌈 Принял себя",      test:()=> str(S.orientation) && S.orientation!=="straight" && bool(S.selfAccepted) },
  { id:"hidden",     name:"🤫 Тайная жизнь",     test:()=> str(S.orientation) && S.orientation!=="straight" && bool(S.selfAccepted) && !bool(S.cameOut) },
  { id:"brave",      name:"🔥 Смельчак",         test:()=> str(S.orientation) && S.orientation!=="straight" && bool(S.cameOut) },
  { id:"parent",     name:"👶 Родитель",         test:()=> num(S.children)>=1 },
  { id:"manyChildren", name:"👨‍👩‍👧‍👦 Многодетный родитель", test:()=> num(S.children)>=3 },
  { id:"twins",      name:"👯 Двойня",           test:()=> S.usedFlags && S.usedFlags.hadTwins },
  { id:"grand",      name:"👴 Патриарх",         test:()=> num(S.children)>=1 && num(S.age)>=75 },
  { id:"partner",    name:"💍 Вторая половинка", test:()=> bool(S.hasPartner) },
  { id:"baggage",    name:"🎒 С прицепом",       test:()=> S.usedFlags && S.usedFlags.hadBaggage },
  { id:"northkorea", name:"🇰🇵 Выжил в КНДР",     test:()=> str(S.birthCountry)==="Северная Корея" && num(S.age)>=50 },
  { id:"polyglot",   name:"🌍 Полиглот",         test:()=> num(S.languages)>=3 },
  { id:"langMaster", name:"🗣️ Мастер языков",   test:()=> num(S.languages)>=5 },
  { id:"bilingual",  name:"🗣️ Двуязычный",       test:()=> num(S.languages)>=2 },

const RECORDS_KEY = "life_records_v45";

function loadRecords() {
  const def = { bestScore:0, bestAge:0, bestCountry:"", bestGender:"", totalGames:0, achievements:{} };
  try {
    const raw = localStorage.getItem(RECORDS_KEY);
    if (!raw) return def;
    const r = JSON.parse(raw);
    if (typeof r !== "object" || r === null) return def;
    return {
      bestScore: num(r.bestScore), bestAge: num(r.bestAge),
      bestCountry: str(r.bestCountry), bestGender: str(r.bestGender),
      totalGames: num(r.totalGames),
      achievements: (r.achievements && typeof r.achievements === "object") ? r.achievements : {}
    };
  } catch(e) { return def; }
}

function saveRecords(rec) {
  try { localStorage.setItem(RECORDS_KEY, JSON.stringify(rec)); return true; }
  catch(e) { return false; }
}

function renderRecords(elId) {
  const el = document.getElementById(elId);
  if (!el) return;
  const r = loadRecords();
  const achCount = Object.keys(r.achievements||{}).length;
  el.innerHTML = `<h3>🏆 Рекорды</h3>
    <div class="rec-row"><span>Лучший счёт</span><b>${r.bestScore||"—"}</b></div>
    <div class="rec-row"><span>Макс. возраст</span><b>${r.bestAge?r.bestAge+" лет":"—"}</b></div>
    <div class="rec-row"><span>Лучшая страна</span><b>${r.bestCountry||"—"}</b></div>
    <div class="rec-row"><span>Сыграно жизней</span><b>${r.totalGames||0}</b></div>
    <div class="rec-row"><span>Открыто достижений</span><b>${achCount} / ${ACHIEVEMENTS.length}</b></div>
  `;
}

function checkAchievements() {
  ACHIEVEMENTS.forEach(a => {
    try { if (a.test()) GLOBAL_ACHIEVEMENTS.add(a.id); } catch(e) {}
  });
  try {
    const rec = loadRecords();
    let changed = false;
    GLOBAL_ACHIEVEMENTS.forEach(id => {
      if (!rec.achievements[id]) { rec.achievements[id] = true; changed = true; }
    });
    if (changed) saveRecords(rec);
  } catch(e) {}
}

/* ============================================================
   ГЕНЕРАЦИЯ
   ============================================================ */
function generateSiblings(count) {
  const list = [];
  for (let i = 0; i < count; i++) {
    const isBrother = chance(0.5);
    const trait = pick(SIBLING_TRAITS);
    list.push({
      gender: isBrother ? "male" : "female",
      role: isBrother ? (chance(0.5)?"старший брат":"младший брат") : (chance(0.5)?"старшая сестра":"младшая сестра"),
      trait
    });
  }
  return list;
}

function describeSiblings(list) {
  if (!list.length) return "Единственный ребёнок";
  const counts = {};
  list.forEach(s => { const key = `${s.role} (${s.trait.name})`; counts[key] = (counts[key]||0) + 1; });
  return Object.entries(counts).map(([k,v]) => v === 1 ? k : `${v} × ${k}`).join(", ");
}

function pickOrientation(gender) {
  if (chance(0.15)) {
    const options = gender === "male" 
      ? ["gay","bi","pan","asexual","queer","nonbinary","demisexual"] 
      : ["lesbian","bi","pan","asexual","queer","nonbinary","demisexual"];
    options.push("aromantic");
    return pick(options);
  }
  return "straight";
}

function generatePartner() { return { trait: pick(PARTNER_TRAITS) }; }

function generatePreview() {
  const countryNames = Object.keys(COUNTRIES);
  const country = pick(countryNames);
  const c = COUNTRIES[country];
  const traitName = pick(Object.keys(TRAITS));
  const gender = chance(0.5) ? "male" : "female";
  const orientation = pickOrientation(gender);
  const sibCount = rand(c.siblings[0], c.siblings[1]);
  const siblingsList = generateSiblings(sibCount);
  const parentTrait = pick(PARENT_TRAITS);
  const religion = pick(c.religions);
  const beauty = rand(20, 90);
  const isInfertile = chance(0.10);

  let hereditaryDisease = null;
  if (chance(0.10)) hereditaryDisease = pick(HEREDITARY_DISEASES);

  let isMixed = false;
  let isSingleParent = false;
  let isSameSexParents = false;
  let motherCountry = country;
  let fatherCountry = country;
  let currentParentCountry = country;
  
  if (c.progressiveness >= 2 && chance(0.15)) {
    isSameSexParents = true;
  } else if (chance(0.20)) {
    isSingleParent = true;
  } else if (chance(0.3)) {
    isMixed = true;
    const otherCountry = pick(countryNames.filter(c => c !== country));
    if (chance(0.5)) {
      motherCountry = otherCountry;
      fatherCountry = country;
      currentParentCountry = chance(0.7) ? country : otherCountry;
    } else {
      motherCountry = country;
      fatherCountry = otherCountry;
      currentParentCountry = chance(0.7) ? country : otherCountry;
    }
  }
  
  return { 
    country, countryFlag:c.flag, countryData:c, traitName, gender, orientation, 
    sibCount, siblingsList, parentTrait, religion, beauty,
    isInfertile, hereditaryDisease,
    isMixed, isSingleParent, isSameSexParents,
    motherCountry, fatherCountry, currentParentCountry
  };
}

function validateName(name, gender, country) {
  const errors = [];
  if (!name) return errors;
  if (name.length < 2 || name.length > 20) { errors.push({ type:"block", msg:"Имя должно быть от 2 до 20 символов." }); return errors; }
  if (!/^[А-Яа-яЁёA-Za-z\- ]+$/.test(name)) { errors.push({ type:"block", msg:"Только буквы, дефис или пробел." }); return errors; }
  const sugg = NAME_SUGGESTIONS[country];
  if (sugg) {
    const sameG = sugg[gender].map(s => s.toLowerCase());
    const otherG = sugg[gender === "male" ? "female" : "male"].map(s => s.toLowerCase());
    const lower = name.toLowerCase();
    if (otherG.includes(lower) && !sameG.includes(lower)) {
      errors.push({ type:"warn", msg:`⚠ «${name}» обычно имя ${gender === "male" ? "девочки" : "мальчика"}. Можно оставить.` });
    }
  }
  return errors;
}

/* ============================================================

function startGame() {

  const playerName = rawName || "Безымянный";
  const { country, countryFlag, countryData, traitName, gender, orientation, sibCount, siblingsList, parentTrait, religion, beauty,
          isMixed, isSingleParent, isSameSexParents, motherCountry, fatherCountry, currentParentCountry, isInfertile, hereditaryDisease } = PREVIEW;

  S = {
    name: playerName, birthCountry: country, country, flag: countryFlag, age:0,
    money: rand(countryData.startMoney[0], countryData.startMoney[1]),
    health: rand(countryData.health[0], countryData.health[1]),
    happiness: rand(countryData.happiness[0], countryData.happiness[1]),
    education: rand(countryData.education[0], countryData.education[1]),
    socialOpinion: 50, faith: rand(20, 70), religion,
    mental: rand(60, 90),
    beauty: clamp(beauty + (traitName === "Красивый(ая)" ? 10 : 0)),
    siblings: sibCount, siblingsList, parentTrait, partnerTrait: null,
    gender, orientation,
    selfAccepted:false, cameOut:false, familyAccepted:false, familyReacted:false,
    children: 0, adoptedChildren: 0, hadChild:false, hasPartner:false, languages:1,
    childCooldown: 0,
    adoptCooldown: 0,
    isInfertile: !!isInfertile,
    hereditaryDisease: hereditaryDisease ? hereditaryDisease.name : "",
    hereditaryEffect: hereditaryDisease || null,
    traumas: [], hasBeenBeaten:false, wasPregnant:false,
    suicidalThoughts: false, suicideAttempted: false, survivedEdge: false,
    isCriminal: false, isProstitute: false,
    businessLevel: 0,
    gangLevel: 0,
    religiousLevel: 0,
    metCelebrity: false, metPresident: false,
    personality: null, socialScore: 0,
    addiction: 0,
    debt: 0,
    hasSTD: false,
    profession: null,
    careerLevel: 0,
    servedArmy: false,
    armyYears: 0,
    armyStartAge: 0,
    armyEndAge: 0,
    armySubStage: 0,
    isMixed: !!isMixed,
    isSingleParent: !!isSingleParent,
    isSameSexParents: !!isSameSexParents,
    motherCountry: motherCountry || country,
    fatherCountry: fatherCountry || country,
    currentParentCountry: currentParentCountry || country,
    usedFlags:{},
    traits:[traitName],
    log:[], stageIndex:0, alive:true,
    emigrated:false, foundLove:false,
    achievements:[], usedEvents:[],
    deathReason: "",
    maxAgeLimit: 90,
    _ended: false
  };

  STAGES_CACHE = getStages();
  applyParentTrait();
  applySiblingsTraits();
  applyHereditaryDisease();

  if (S.beauty > 80) {
    S.happiness = clamp(S.happiness + 10);
    S.mental = clamp(S.mental + 5);
    addLog(`✨ Ты очень красив(а)! Окружающие восхищаются тобой.`, "up");
  } else if (S.beauty < 30) {
    S.happiness = clamp(S.happiness - 10);
    S.mental = clamp(S.mental - 10);
    addLog(`👎 Ты не отличаешься красотой. Общество будет жестоко к тебе.`, "down");
  }

  addLog(`👶 ${S.name} родился(ась) в ${countryFlag} ${country}.`, "up");
  if (isSameSexParents) {
    addLog(`👬 Тебя воспитывает однополая пара.`, "special");
  } else if (isSingleParent) {
    addLog(`👤 Тебя воспитывает один родитель.`, "special");
  } else if (isMixed) {
    addLog(`🌍 Смешанная семья: мать из ${motherCountry}, отец из ${fatherCountry}. Живёте в ${currentParentCountry}.`, "special");
    S.usedFlags.isMixedFamily = true;
  }
  addLog(`✨ Черта характера: ${traitName} — ${TRAITS[traitName].desc}`, "special");
  addLog(`🕊️ Религия: ${religion}`, "special");
  addLog(`👪 Родители: ${parentTrait.name} — ${parentTrait.desc}`, "special");
  addLog(`👨‍👩‍👧 ${describeSiblings(siblingsList)}`, "");
  
  if (S.isInfertile) {
    addLog(`🍂 Врачи сказали, что ты бесплоден(на). Завести своих детей не получится.`, "down");

  if (ORIENTATIONS[orientation].lgbt) {

    let t = acc < 0.2 ? "В этой стране к этому относятся очень плохо."

function applyParentTrait() {
  const pt = S.parentTrait;
  if (!pt || !pt.effect) return;
  for (const [k,v] of Object.entries(pt.effect)) {
    if (k === "money") S.money = Math.max(0, S.money + v);
    else if (S[k] !== undefined) S[k] = clamp(S[k] + v);
  }
}
function applySiblingsTraits() {
  S.siblingsList.forEach(sib => {
    if (!sib.trait || !sib.trait.effect) return;
    for (const [k,v] of Object.entries(sib.trait.effect)) {
      if (k === "money") S.money = Math.max(0, S.money + v);
      else if (S[k] !== undefined) S[k] = clamp(S[k] + v);
    }
  });
}
function applyPartnerTrait() {
  const pt = S.partnerTrait;
  if (!pt || !pt.effect) return;
  for (const [k,v] of Object.entries(pt.effect)) {
    if (k === "money") S.money = Math.max(0, S.money + v);
    else if (S[k] !== undefined) S[k] = clamp(S[k] + v);
  }
}
function applyHereditaryDisease() {
  if (!S.hereditaryEffect) return;
  const d = S.hereditaryEffect;
  if (d.health) S.health = clamp(S.health + d.health);
  if (d.mental) S.mental = clamp(S.mental + d.mental);
  if (d.happiness) S.happiness = clamp(S.happiness + d.happiness);
  if (d.socialOpinion) S.socialOpinion = clamp(S.socialOpinion + d.socialOpinion);
  if (d.education) S.education = clamp(S.education + d.education);
}

function applySocial(delta, opts={}) {
  const c = COUNTRIES[S.country];
  let mult = 1;
  if (delta < 0) { mult = 1 + c.socialDifficulty; if (S.gender === "female") mult *= (1 + c.genderBias*0.5); }
  else { mult = 1 + (1 - c.socialDifficulty)*0.5; }
  if (opts.genderSensitive && S.gender === "female") mult *= (1 + c.genderBias);
  if (delta < 0 && S.beauty < 30) mult *= 1.5;
  const change = Math.round(delta * mult);
  S.socialOpinion = clamp(S.socialOpinion + change);
  return change;
}

/* ============================================================
   КНОПКА ДОЛГА
   ============================================================ */
function updateDebtButton() {
  const wrap = document.getElementById("debtBtnWrap");
  if (!wrap) return;
  if (S.alive && S.age >= 18 && S.debt === 0 && !S.usedFlags.paidDebt) {
    wrap.classList.remove("hidden");
  } else {
    wrap.classList.add("hidden");
  }
}

function takeDebt() {
  if (S.debt > 0) { alert("У тебя уже есть долг!"); return; }
  if (S.age < 18) { alert("Долг можно взять только с 18 лет!"); return; }
  S.money += 40;
  S.debt = 50;
  S.mental = clamp(S.mental - 3);
  addLog(`💳 Ты взял(а) в долг 40 монет. Теперь надо отдавать 50.`, "down");
  updateDebtButton(); updateChildButton(); updateAdoptButton();
  renderStats(); renderLog(); renderIdentity();
}

/* ============================================================
   КНОПКА РЕБЁНКА (с КД)
   ============================================================ */
function updateChildButton() {
  const wrap = document.getElementById("childBtnWrap");
  const btn = document.getElementById("childBtn");
  if (!wrap || !btn) return;
  
  const isLGBT = ORIENTATIONS[S.orientation].lgbt;
  
  if (isLGBT || S.isInfertile) {
    wrap.classList.add("hidden");
    return;
  }
  
  if (S.alive && S.hasPartner && S.age >= 18 && S.children < 5) {
    wrap.classList.remove("hidden");
    if (S.childCooldown > 0) {
      btn.disabled = true;
      btn.textContent = `⏳ Подожди (${S.childCooldown} лет)`;
    } else {
      btn.disabled = false;
      btn.textContent = `👶 Предложить партнёру завести ребёнка`;
    }
  } else {
    wrap.classList.add("hidden");
  }
}

function suggestChild() {
  if (!S.hasPartner) { alert("У тебя нет партнёра!"); return; }
  if (S.children >= 5) { alert("У тебя уже 5 детей, больше не потянешь!"); return; }
  if (S.childCooldown > 0) { alert(`Подожди ${S.childCooldown} лет!`); return; }
  
  const c = COUNTRIES[S.country];
  const agreeChance = c.conservative ? 0.70 : 0.50;
  
  const agree = chance(agreeChance);
  if (agree) {
    const isTwins = chance(0.20);
    const bornCount = isTwins ? 2 : 1;
    S.children += bornCount;
    S.hadChild = true;
    S.childCooldown = 3;
    
    S.happiness = clamp(S.happiness + (isTwins ? 20 : 15));
    S.money = Math.max(0, S.money - (isTwins ? 20 : 10));
    S.health = clamp(S.health - (isTwins ? 6 : 4));
    S.mental = clamp(S.mental - (isTwins ? 5 : 3));
    S.socialOpinion = clamp(S.socialOpinion + 5);
    
    if (isTwins) {
      S.usedFlags.hadTwins = true;
      addLog(`👯 Партнёр согласился! У вас родилась ДВОЙНЯ! Теперь у тебя ${S.children} детей.`, "up");
    } else {
      addLog(`👶 Партнёр согласился! У вас родился ребёнок. Теперь у тебя ${S.children} детей.`, "up");
    }
  } else {
    S.happiness = clamp(S.happiness - 5);
    S.mental = clamp(S.mental - 3);
    S.childCooldown = 1;
    addLog(`💔 Партнёр отказался заводить ребёнка.`, "down");
  }
  
  updateChildButton(); updateAdoptButton(); updateDebtButton();
  renderStats(); renderLog(); renderIdentity();
}

/* ============================================================
   КНОПКА УСЫНОВЛЕНИЯ (с КД)
   ============================================================ */
function updateAdoptButton() {
  const wrap = document.getElementById("adoptBtnWrap");
  const btn = document.getElementById("adoptBtn");
  if (!wrap || !btn) return;
  
  const isLGBT = ORIENTATIONS[S.orientation].lgbt;
  const c = COUNTRIES[S.country];
  
  if (isLGBT && c.conservative) {
    wrap.classList.add("hidden");
    return;
  }
  
  const canAdoptBase = S.alive && S.age >= 20 && S.children < 5 && 
                       (S.money >= 30) && (S.mental >= 40) && (S.socialOpinion >= 30);
  
  if (canAdoptBase && (!S.hasPartner || isLGBT || S.isInfertile)) {
    wrap.classList.remove("hidden");
    if (S.adoptCooldown > 0) {
      btn.disabled = true;
      btn.textContent = `⏳ Усыновление доступно через ${S.adoptCooldown} лет`;
    } else {
      btn.disabled = false;
      btn.textContent = `🏡 Усыновить ребёнка`;
    }
  } else {
    wrap.classList.add("hidden");
  }
}

function tryAdopt() {
  const c = COUNTRIES[S.country];
  const isLGBT = ORIENTATIONS[S.orientation].lgbt;
  
  if (S.adoptCooldown > 0) { alert(`Усыновление будет доступно через ${S.adoptCooldown} лет.`); return; }
  if (S.money < 30) { alert("У тебя мало денег для усыновления (нужно 30)."); return; }
  if (S.mental < 40) { alert("Твоя психика нестабильна. В усыновлении откажут."); return; }
  if (S.socialOpinion < 30) { alert("У тебя плохая репутация. В усыновлении откажут."); return; }
  if (isLGBT && c.conservative) { alert("В этой стране однополым парам/одиночкам не разрешают усыновление."); return; }
  
  if (chance(0.6)) {
    S.children++;
    S.adoptedChildren++;
    S.hadChild = true;
    S.usedFlags.adoptedChild = true;
    S.money = Math.max(0, S.money - 20);
    S.happiness = clamp(S.happiness + 15);
    S.mental = clamp(S.mental + 5);
    S.socialOpinion = clamp(S.socialOpinion + 3);
    S.adoptCooldown = 4;
    addLog(`🏡 Ты усыновил(а) ребёнка! Теперь у тебя ${S.children} детей.`, "up");
  } else {
    S.mental = clamp(S.mental - 10);
    S.happiness = clamp(S.happiness - 5);
    S.adoptCooldown = 2;
    addLog(`💔 В усыновлении отказали. Бюрократия и подозрения.`, "down");
  }
  
  updateChildButton(); updateAdoptButton(); updateDebtButton();
  renderStats(); renderLog(); renderIdentity();
}

/* ============================================================
   ПРОВЕРКА ЗДОРОВЬЯ, ДОЛГОВ И РИСКА ИЗЪЯТИЯ
   ============================================================ */
function checkHealthState() {
  if (S.addiction > 30) {
    const damage = Math.round(S.addiction / 20);
    if (damage > 0 && chance(0.4)) {
      S.health = clamp(S.health - damage);
      addLog(`💊 Зависимость разрушает твоё здоровье (-${damage} ❤️)`, "down");
    }
  }
  
  if (S.debt > 0 && S.age >= 25 && chance(0.3)) {
    S.debt = Math.round(S.debt * 1.1);
    addLog(`💳 Долг вырос до ${S.debt}`, "down");
  }
  
  if (S.childCooldown > 0) S.childCooldown--;
  if (S.adoptCooldown > 0) S.adoptCooldown--;
  
  // Риск изъятия усыновлённого ребёнка
  if (S.adoptedChildren > 0 && S.age > 20) {
    const isBadEnv = S.money < 20 || S.mental < 40 || S.socialOpinion < 30;
    if (isBadEnv && chance(0.3)) {
      S.adoptedChildren--;
      S.children--;
      if (S.children === 0) S.hadChild = false;
      S.happiness = clamp(S.happiness - 25);
      S.mental = clamp(S.mental - 20);
      addLog(`🚔 Органы опеки изъяли усыновлённого ребёнка из-за плохих условий.`, "down");
    }
  }
}

/* ============================================================
   ПРОВЕРКА ПРЕДЕЛА ЖИЗНИ (СМЕРТЬ ОТ СТАРОСТИ)
   ============================================================ */
function checkLifeLimit() {
  if (!S.alive) return false;
  if (S.age < 50) return false;

  // Лимит зависит от текущего здоровья
  if (S.health >= 50) {
    S.maxAgeLimit = 90;
  } else if (S.health >= 20) {
    S.maxAgeLimit = 75;
  } else {
    if (!S.maxAgeLimit || S.maxAgeLimit > 60) {
      S.maxAgeLimit = rand(50, 60);
    }
  }

  if (S.age >= S.maxAgeLimit) {
    S.alive = false;
    let reason;
    if (S.health < 20) reason = `Здоровье было слишком слабым (${S.health}%). Организм не выдержал — смерть в ${S.age} лет.`;
    else if (S.health < 50) reason = `Здоровье оставляло желать лучшего (${S.health}%). Старость взяла своё — смерть в ${S.age} лет.`;
    else reason = `Ты прожил(а) долгую жизнь (${S.health}% здоровья) и умер(ла) от старости в ${S.age} лет.`;
    endGame(reason);
    return true;
  }
  return false;
}

function getArmyStages() {
  const c = COUNTRIES[S.country];
  const minYears = c.armyService[0];
  const maxYears = c.armyService[1];

  const recruitStage = {
    age: 18,
    title: "Армия — призыв",
    skip:()=> S.gender !== "male" || S.usedFlags.armyDecision,
    text:()=> {
      let txt = `Тебе 18. В ${S.country} молодых парней призывают в армию.`;
      if (c.armyChance >= 0.9) txt += ` Служба здесь обязательна и жёсткая.`;
      else if (c.armyChance >= 0.5) txt += ` Служба — обычное дело.`;
      else if (c.armyChance >= 0.25) txt += ` Призыв есть, но многие избегают.`;
      else txt += ` Служба необязательна или непопулярна.`;
      txt += ` Срок: ${minYears}–${maxYears} лет.`;
      return txt;
    },
    choices:()=>{
      const opts = [
        { text:`🪖 Пойти в армию (${minYears}–${maxYears} лет)`, effects:{health:+5, education:-3, happiness:-5, socialOpinion:+8, mental:-8}, log:"Ты пошёл в армию.",
          flags:()=>{
            S.usedFlags.armyDecision = true;
            S.servedArmy = true;
            S.armyYears = rand(minYears, maxYears);
            S.armyStartAge = 18;
            S.armyEndAge = 18 + S.armyYears;
            S.armySubStage = 0;
            addLog(`Ты отслужишь ${S.armyYears} лет. Вернёшься в ${S.armyEndAge}.`, "special");
            STAGES_CACHE = getStages();
          } },
        { text:"🏃 Откосить от армии", effects:{happiness:+5, health:-3, socialOpinion:-10, mental:-5}, log:"Ты решил откосить.",
          flags:()=>{
            S.usedFlags.armyDecision = true;
            S.usedFlags.dodgedArmy = true;
            const risk = c.armyChance;
            if (chance(risk * 0.5)) {
              addLog("Тебя поймали и отправили служить принудительно!", "down");
              S.servedArmy = true;
              S.armyYears = rand(minYears, maxYears);
              S.armyStartAge = 18;
              S.armyEndAge = 18 + S.armyYears;
              S.armySubStage = 0;
              S.health = clamp(S.health - 10);
              S.socialOpinion = clamp(S.socialOpinion - 15);
              STAGES_CACHE = getStages();
            } else {
              addLog("Тебе удалось избежать призыва.", "up");
            }
          } },
        { text:"📚 Пойти учиться (отсрочка)", effects:{education:+8, happiness:+3, socialOpinion:+2}, log:"Ты решил учиться — отсрочка от армии.",
          flags:()=>{ S.usedFlags.armyDecision = true; } }
      ];
      return opts;
    }
  };

  const armyInternalEvents = [
    {
      title: "Дедовщина",
      text:()=> "Старшие призывники начинают тебя гонять. Дедовщина.",
      choices:()=>[
        { text:"Терпеть", effects:{health:-8, mental:-12, socialOpinion:+3}, log:"Ты терпел дедовщину.",
          flags:()=>{ S.usedFlags.armyHazed = true; S.traumas.push("hazing"); } },
        { text:"Дать сдачи", effects:{health:-12, mental:+5, socialOpinion:+6}, log:"Ты дал сдачи — стали уважать.",
          flags:()=>{ S.usedFlags.armyBully = true; } },
        { text:"Сдать старших офицеру", effects:{health:-5, mental:-5, socialOpinion:-8}, log:"Офицер разобрался, но тебя стали избегать.",
          flags:()=>{ S.usedFlags.armyHazed = true; } }
      ]
    },
    {
      title: "Служба",
      text:()=> "Будни службы. Тяжёлые тренировки, наряды, сон по 4 часа.",
      choices:()=>[
        { text:"Усердно служить", effects:{health:-5, mental:+3, socialOpinion:+8}, log:"Ты стал образцовым солдатом.",
          flags:()=>{ if (chance(0.3)) { S.usedFlags.armyHero = true; addLog("Тебя наградили за службу!", "up"); S.socialOpinion = clamp(S.socialOpinion + 10); } } },
        { text:"Филонить", effects:{health:+3, mental:-3, socialOpinion:-5}, log:"Ты филонил, как мог." },
        { text:"Попросить перевод", effects:{health:-3, education:+4, mental:-2}, log:"Тебя перевели в штаб." }
      ]
    },
    {
      title: "Побег",
      text:()=> "Служба невыносима. Ты думаешь о побеге.",
      choices:()=>[
        { text:"Сбежать", effects:{health:-15, mental:-10, socialOpinion:-20}, log:"Ты сбежал, но тебя поймали.",
          flags:()=>{ if (chance(0.3)) { S.usedFlags.armyEscaped = true; addLog("Тебе удалось сбежать! Тебя ищут.", "down"); S.socialOpinion = clamp(S.socialOpinion - 15); } else { addLog("Тебя поймали и отправили на гауптвахту.", "down"); S.health = clamp(S.health - 10); S.mental = clamp(S.mental - 10); } } },
        { text:"Дослужить", effects:{mental:-3, socialOpinion:+3}, log:"Ты решил дослужить." }
      ]
    }
  ];

  const armyStages = [recruitStage];

  for (let i = 0; i < 6; i++) {
    const internal = armyInternalEvents[i % armyInternalEvents.length];
    armyStages.push({
      age: 18,
      title: `Армия — ${internal.title}`,
      skip:()=> {
        if (!S.servedArmy) return true;
        if (!S.usedFlags.armyDecision) return true;
        if (S.armySubStage !== i) return true;
        if (S.armySubStage >= 6) return true;
        return false;
      },
      text:()=> internal.text(),
      choices:()=> internal.choices()
    });
  }

  return armyStages;
}

function makeProfessionStage(isAfterArmy) {
  return {
    age: 18,
    title: isAfterArmy ? "Выбор профессии после армии" : "Выбор профессии",
    _afterArmy: isAfterArmy,
    skip:()=> {
      if (!S.usedFlags.armyDecision) return true;
      if (S.profession) return true;
      if (S.usedFlags.profChoiceMade) return true;
      if (isAfterArmy) {
        return !S.servedArmy;
      } else {
        return S.servedArmy;
      }
    },
    text:()=> {
      let extra = "";
      const diff = COUNTRIES[S.country].educationDifficulty;
      if (S.education >= 60) extra += "\n📚 У тебя достаточно образования, чтобы стать учителем.";
      if (S.languages >= 2) extra += "\n🌍 Ты знаешь несколько языков — можешь стать репетитором.";
      if (diff >= 0.7) extra += "\n⚠️ В этой стране получить сложную профессию (врач/юрист/экономист) очень трудно.";
      else if (diff <= 0.3) extra += "\n✅ В этой стране образование доступное — сложные профессии вполне реальны.";
      const ageText = isAfterArmy ? `Тебе ${S.armyEndAge}. Ты вернулся из армии (служил ${S.armyYears} лет). Пора выбрать профессию.` : `Тебе 18. Пора выбрать профессию.`;
      return `${ageText} Это решение определит твою жизнь.${extra}`;
    },
    choices:()=> getProfessionChoices()
  };
}

  });

  });

  return stages;
}

function makeDebtStage(age, flagKey) {
  const isGirl = S.gender === "female";
  const c = COUNTRIES[S.country];
  return {
    age,
    title: `Долговая кабала (${age})`,
    skip:()=> {
      if (S.debt <= 0) return true;
      if (S.usedFlags[flagKey]) return true;
      S.usedFlags[flagKey] = true;
      return false;
    },
    text:()=> `Тебе ${age}. Долг ${S.debt} монет висит на тебе. Кредиторы нашли тебя.`,
    choices:()=>{
      const canPay = S.money >= S.debt;
      const opts = [];
      if (canPay) {
        opts.push({ text:"Выплатить долг", effects:{money:-S.debt, happiness:+5, mental:+5}, log:"Ты выплатил(а) долг.",
          flags:()=>{ S.debt = 0; S.usedFlags.paidDebt = true; } });
      }
      opts.push({ text:"Не выплачивать", effects:{happiness:-10, mental:-10, health:-5}, log:"Ты не выплатил(а) долг.",
        flags:()=>{ 
          if (isGirl && c.progressiveness === 0) {
            addLog("Тебя забрали в рабство.", "down");
            S.usedFlags.enslaved = true; S.traumas.push("slavery"); S.debt = 0;
            S.happiness = clamp(S.happiness - 20); S.mental = clamp(S.mental - 20);
          } else {
            addLog("Тебя отправили на грязную работу.", "down");
            S.debt = 0; S.usedFlags.paidDebt = true; S.happiness = clamp(S.happiness - 10);
          }
        } });
      if (!canPay) {
        if (isGirl) {
          opts.push({ 
            text: "«Договориться» с кредитором", 
            effects: { happiness: -10, mental: -25, health: -5, socialOpinion: -5 }, 
            log: "Ты «договорилась» с кредитором.",
            flags: () => {
              S.usedFlags.favorsForDebt = true;
              S.happiness = clamp(S.happiness - 10);
              S.mental = clamp(S.mental - 25);
              S.health = clamp(S.health - 5);
              S.socialOpinion = clamp(S.socialOpinion - 5);

              if (S.hasPartner) {
                S.hasPartner = false;
                S.partnerTrait = null;
                addLog("Твой партнёр узнал(а) и бросил(а) тебя.", "down");
                S.happiness = clamp(S.happiness - 20);
                if (S.children > 0) S.usedFlags.hadBaggage = true;
              }
              if (S.children > 0) {
                S.children = 0;
                S.hadChild = false;
                addLog("Дети узнали и отказались от тебя.", "down");
                S.happiness = clamp(S.happiness - 30);
                S.mental = clamp(S.mental - 20);
              }

              if (chance(0.35)) {
                S.hasSTD = true;
                addLog("После этого ты подхватила ЗППП.", "down");
              }

              S.pendingVomit = true;
            }
          });
        } else {
          opts.push({ text:"Продать почку", effects:{money:-S.debt, health:-25, happiness:-10, mental:-5}, log:"Ты продал(а) почку.",
            flags:()=>{ S.debt=0; S.usedFlags.paidDebt=true; S.usedFlags.soldKidney=true; S.health=clamp(S.health-25); S.happiness=clamp(S.happiness-10); } });
        }
      }
      return opts;
    }
  };
}

function nextStage() {
  if (!S.alive) return endGame(S.deathReason || "Жизнь оборвалась...");
  checkHealthState();
  checkMentalState();
  updateDebtButton(); updateChildButton(); updateAdoptButton();
  
  if (S.pendingVomit) {
    S.pendingVomit = false;
    return showVomitChoice(nextStage);
  }
  
  if (PENDING_EDGE) {
    PENDING_EDGE = false;
    return showEdgeEvent(nextStage);
  }
  
  if (!S.alive) return endGame(S.deathReason || "Ты не справился(ась).");
  if (!STAGES_CACHE.length) STAGES_CACHE = getStages();
  if (S.stageIndex >= STAGES_CACHE.length) {
    if (checkLifeLimit()) return;
    return endGame(S.deathReason || "Жизнь завершилась.");
  }

  if (S.beauty >= 80) { S.happiness = clamp(S.happiness + 2); S.mental = clamp(S.mental + 2); }
  else if (S.beauty < 25) { S.happiness = clamp(S.happiness - 2); S.mental = clamp(S.mental - 2); }

  while (S.stageIndex < STAGES_CACHE.length) {
    const st = STAGES_CACHE[S.stageIndex];
    if (st.skip && st.skip()) {
      if (st.title && st.title.startsWith("Армия —") && st.title !== "Армия — призыв") {
        S.armySubStage = (S.armySubStage || 0) + 1;
      }
      S.stageIndex++;
      continue;
    }
    break;
  }
  if (S.stageIndex >= STAGES_CACHE.length) {
    if (checkLifeLimit()) return;
    return endGame(S.deathReason || "Жизнь завершилась.");
  }

  if (S.stageIndex > 0 && chance(0.35)) {
    const age = STAGES_CACHE[S.stageIndex].age;
    const available = RANDOM_EVENTS.filter(e => !S.usedEvents.includes(e.id) && age >= e.minAge && age <= e.maxAge && (!e.skip || !e.skip()));
    if (available.length) {
      const ev = pick(available);
      S.usedEvents.push(ev.id);
      return showEvent(ev, nextStage);
    }
  }

  const stage = STAGES_CACHE[S.stageIndex];

  let stageAge = stage.age;
  if (stage.title === "Выбор профессии после армии") {
    stageAge = S.armyEndAge || 18;
  }
  if (stageAge > S.age) S.age = stageAge;

  const isArmyInternal = stage.title && stage.title.startsWith("Армия —") && stage.title !== "Армия — призыв";

  updateDebtButton(); updateChildButton(); updateAdoptButton();
  showEvent(stage, () => {
    S.stageIndex++;
    if (isArmyInternal) S.armySubStage = (S.armySubStage || 0) + 1;
    renderStats(); renderLog(); renderIdentity();
    updateDebtButton(); updateChildButton(); updateAdoptButton();
    
    if (checkLifeLimit()) return;
    
    setTimeout(nextStage, 250);
  }, true);
}

function checkMentalState() {
  if (S.mental < 10 && !S.suicidalThoughts) {
    S.suicidalThoughts = true;
    addLog(`🌑 Появляются мысли о суициде...`, "down");
  }
  if (S.suicidalThoughts && S.mental < 10 && S.age >= 18 && S.alive && !S.suicideAttempted && !S.survivedEdge) {
    PENDING_EDGE = true;
  }
}

        S.mental = clamp(S.mental - 10);
        S.debt = Math.max(50, S.debt || 50);

      } 
    },

      effects: { mental: -15 },

    const effectStr = Object.entries(opt.effects).map(([k,v]) => `${labels[k]||k} ${v>0?"+":""}${v}`).join("  ");

function showEdgeEvent(onDone) {
  const q = COUNTRIES[S.country].therapyQuality;
  const hasPartner = S.hasPartner;
  const hasMoney = S.money >= 5;
  const isSupportive = S.parentTrait && ["understanding","kind","loving","caring","responsive"].includes(S.parentTrait.id);
  
  let survivalChance = 0.15 + q * 0.5;
  if (hasPartner) survivalChance += 0.15;
  if (isSupportive) survivalChance += 0.1;
  if (hasMoney) survivalChance += 0.1;
  survivalChance = Math.min(0.95, survivalChance);

  const badge = document.getElementById("ageBadge");
  badge.textContent = `Возраст: ${S.age} лет`;
  badge.className = "age-badge dark";

  document.getElementById("eventText").textContent = `Тебе ${S.age}. На краю... Как поступишь?`;

  const choicesEl = document.getElementById("choices");
  choicesEl.innerHTML = "";

  const options = [
    { text:"Горячая линия", chance: survivalChance, success:{happiness:+10,mental:+20,socialOpinion:+2}, fail:{happiness:-5,mental:-5}, successLog:"Ответили.", failLog:"Никто не ответил." },
    { text:"К близким", chance: hasPartner ? 0.8 : (isSupportive ? 0.7 : 0.4), success:{happiness:+8,mental:+15,socialOpinion:+1}, fail:{happiness:-8,mental:-10}, successLog:"Поддержали.", failLog:"Не поняли." },
    { text:"Сам(а)", chance: 0.25, success:{mental:+8,happiness:+3}, fail:{mental:-15,happiness:-10}, successLog:"Нашёл силы.", failLog:"Не справился." },
    { text:"Сдаться", chance:0, success:{}, fail:{mental:-100}, successLog:"", failLog:"Сдался." }
  ];

  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = `${opt.text}<span class="effect">${opt.text==="Сдаться"?"💀 Смерть":`Шанс: ~${Math.round(opt.chance*100)}%`}</span>`;
    btn.onclick = () => {
      S.suicideAttempted = true;
      if (opt.text === "Сдаться") { S.alive = false; S.deathReason = "💔 Ты сдался(ась). Психика не выдержала."; return endGame(S.deathReason); }
      if (chance(opt.chance)) {
        for (const [k,v] of Object.entries(opt.success)) { if (S[k] !== undefined) S[k] = clamp(S[k] + v); }
        addLog(opt.successLog, "up"); S.survivedEdge = true;
        renderStats(); renderLog(); renderIdentity(); onDone();
      } else {
        for (const [k,v] of Object.entries(opt.fail)) { if (S[k] !== undefined) S[k] = clamp(S[k] + v); }
        addLog(opt.failLog, "down");
        if (S.mental < 5) { S.alive = false; S.deathReason = "💔 Психика не выдержала. Ты умер(ла) от отчаяния."; return endGame(S.deathReason); }
        renderStats(); renderLog(); renderIdentity(); onDone();
      }
    };
    choicesEl.appendChild(btn);
  });
  renderStats();
}

function showEvent(ev, onDone, isStage=false) {
  const badge = document.getElementById("ageBadge");
  badge.textContent = isStage ? `Возраст: ${S.age} лет` : `Случайное событие · ${S.age} лет`;
  badge.className = "age-badge" + (isStage ? "" : " special");
  if (ev.title && ev.title.startsWith("Армия")) badge.className = "age-badge army";
  if (S.suicidalThoughts && S.mental < 10) badge.className = "age-badge dark";

  document.getElementById("eventText").textContent = ev.text();
  const choicesEl = document.getElementById("choices");
  choicesEl.innerHTML = "";

  ev.choices().forEach(ch => {
    const btn = document.createElement("button");
    btn.className = "choice";

    let effectStr = "";
    if (ch.effects) {
      const labels = { money:"💰", health:"❤️", happiness:"😊", education:"🎓", languages:"🌍", socialOpinion:"👥", faith:"🕊️", mental:"🧠", beauty:"💄", addiction:"💊", debt:"💳" };
      effectStr = Object.entries(ch.effects).map(([k,v]) => `${labels[k]||k} ${v>0?"+":""}${v}`).join("  ");
    }

    let note = "";
    if (ch.note) { const cn = ch.note(); if (cn) note = cn; }
    if (!note && (ch.text.includes("ребёнка") || ch.text.includes("отцом") || ch.text.includes("матерью")) && !S.hasPartner && !ch.text.includes("одиночку")) note = "Требуется партнёр";

    btn.innerHTML = `${ch.text}<span class="effect">${effectStr}</span>${note?`<span class="note">⚠ ${note}</span>`:""}`;
    btn.onclick = () => {
      if (note) { alert(note); return; }
      applyChoice(ch);
      renderStats(); renderLog(); renderIdentity();
      if (S.health <= 0) { S.alive = false; S.deathReason = `💔 Здоровье подорвано (${S.health}%). Ты не выдержал(а).`; return endGame(S.deathReason); }
      onDone();
    };
    choicesEl.appendChild(btn);
  });
  renderStats();
}

function applyChoice(ch) {
  const effects = { ...(ch.effects || {}) };
  S.traits.forEach(t => TRAITS[t].apply(effects));

  let socialRaw = 0;
  if (effects.socialOpinion !== undefined) { socialRaw = effects.socialOpinion; delete effects.socialOpinion; }

  for (const [key, val] of Object.entries(effects)) {
    if (key === "money") S.money = Math.max(0, S.money + val);
    else if (key === "languages") S.languages = (S.languages||1) + val;
    else if (S[key] !== undefined) S[key] = clamp(S[key] + val);
  }

  if (socialRaw !== 0) {
    const applied = applySocial(socialRaw);
    if (applied !== 0) addLog(`${applied>0?"👥 +":"👥 "}${applied} к соц.мнению`, applied>0?"up":"down");
  }

  if (ch.flags) ch.flags();
  if (ch.special) ch.special();

  if (ch.log) {
    let type = "down"; let sum = 0;
    for (const v of Object.values(ch.effects||{})) sum += v;
    if (sum > 0) type = "up";
    if (ch.flags || ch.special) type = "special";
    if (ch.effects && ch.effects.mental && ch.effects.mental < 0) type = "mental";
    addLog(ch.log, type);
  }

  if (S.age >= 20 && !S.personality) finalizePersonality();
  checkAchievements();
  updateDebtButton(); updateChildButton(); updateAdoptButton();
}

function finalizePersonality() {
  if (S.socialScore >= 4) S.personality = "Экстраверт";
  else if (S.socialScore <= -4) S.personality = "Интроверт";
  else S.personality = "Амбиверт";
  addLog(`🧠 К 20 годам: ${S.personality}`, "special");
}

function renderStats() {
  const statsEl = document.getElementById("stats");
  const stats = [
    { label:"Возраст", value:`${S.age} лет`, noBar:true },
    { label:"💰 Деньги", value:S.money, key:"money", max:150 },
    { label:"❤️ Здоровье", value:S.health+"%", key:"health", max:100 },
    { label:"😊 Счастье", value:S.happiness+"%", key:"happy", max:100 },
    { label:"🎓 Образование", value:S.education+"%", key:"edu", max:100 },
    { label:"👥 Соц.мнение", value:S.socialOpinion+"%", key:"social", max:100 },
    { label:"🧠 Психика", value:S.mental+"%", key:"mental", max:100, low: S.mental < 20 },
    { label:"💄 Красота", value:S.beauty+"%", key:"beauty", max:100, low: S.beauty < 30 },
    { label:"🕊️ Вера", value:S.faith+"%", key:"faith", max:100 },
    { label:"👶 Дети", value:S.children, noBar:true },
    { label:"💊 Зависимость", value:S.addiction+"%", key:"mental", max:100, low: S.addiction > 50 },
    { label:"💳 Долг", value:S.debt, key:"money", max:100, noBar:true }
  ];

  statsEl.innerHTML = stats.map(s => {
    let bar = "";
    if (!s.noBar) {
      const val = s.key==="money" ? Math.min(100, ((S.money||0)/s.max)*100) :
                  s.key==="health" ? S.health :
                  s.key==="happy" ? S.happiness :
                  s.key==="social" ? S.socialOpinion :
                  s.key==="mental" ? (s.label.includes("Зависимость") ? S.addiction : S.mental) :
                  s.key==="faith" ? S.faith :
                  s.key==="beauty" ? S.beauty : S.education;
      const lowClass = ((s.key === "mental" && S.mental < 20) || (s.label.includes("Зависимость") && S.addiction > 50)) ? " low" : 
                        (s.key === "beauty" && S.beauty < 30) ? " low" : "";
      bar = `<div class="bar-wrap"><div class="bar ${s.key}${lowClass}" style="width:${val}%"></div></div>`;
    }
    return `<div class="stat"><div class="stat-label">${s.label}</div><div class="stat-value">${s.value}</div>${bar}</div>`;
  }).join("");
}

  if (S.usedFlags && S.usedFlags.armyBully) extra += ` <span class="relationship-badge" style="background:rgba(106,4,15,0.3);border-color:rgba(106,4,15,0.7);color:#ff9999;">👊 Дедовщина</span>`;
  if (S.usedFlags && S.usedFlags.rapist) extra += ` <span class="relationship-badge" style="background:rgba(106,4,15,0.5);border-color:rgba(106,4,15,0.9);color:#fff;">🖤 Насильник</span>`;
  if (S.usedFlags && S.usedFlags.hardToFindPartner) extra += ` <span class="relationship-badge" style="background:rgba(106,4,15,0.3);border-color:rgba(106,4,15,0.7);color:#ff9999;">💔 Трудно найти</span>`;
  if (S.usedFlags && S.usedFlags.hadBaggage) extra += ` <span class="relationship-badge" style="background:rgba(249,199,79,0.3);border-color:rgba(249,199,79,0.7);color:#f9c74f;">🎒 С прицепом</span>`;
  if (S.profession) {
    const profLabels = { doctor:"🏥 Врач", police:"👮 Полицейский", lawyer:"⚖️ Юрист", economist:"📊 Экономист", teacher:"📚 Учитель", tutor:"📖 Репетитор", no_study:"🚫 Не учился", janitor:"🧹 Дворник", cleaner:"🧽 Уборщик", homeless:"🏚️ Бездомный", prostitution:"💃 18+", loader:"📦 Грузчик" };
    let profStr = profLabels[S.profession] || S.profession;
    if (S.careerLevel > 0) profStr += ` (ур.${S.careerLevel})`;
    extra += ` <span class="relationship-badge" style="background:rgba(155,93,229,0.3);border-color:rgba(155,93,229,0.7);color:#d4b3ff;">${profStr}</span>`;
  }
  
  el.innerHTML = `
    <b>${S.flag} ${S.country}</b> · ${genderText} · ${orientText}${status}${extra}<br>
    <span style="font-size:0.82rem;color:#a8b3bd;">ЛГБТ: ${acceptText} · Соц: ${S.socialOpinion}% · Психика: ${S.mental}% · Здоровье: ${S.health}% · Вера: ${S.faith}%</span>
  `;
}

function renderTraits() {
  const el = document.getElementById("traits");
  if (!S.traits || !S.traits.length) { el.innerHTML = ""; return; }
  el.innerHTML = S.traits.map(t => `<span class="trait" title="${TRAITS[t].desc}">✨ ${t}</span>`).join("");
}

function renderLog() {
  const logEl = document.getElementById("log");
  logEl.innerHTML = S.log.slice(-14).map(l => `<p class="${l.type}">${l.text}</p>`).join("");
  logEl.scrollTop = logEl.scrollHeight;
}

function addLog(text, type="") {
  S.log.push({ text, type });
  if (S.log.length > 60) S.log.shift();
}

function toggleAchievements() {
  const box = document.getElementById("achBox");
  if (box) box.classList.toggle("expanded");
}

function toggleMenuAchievements() {
  const box = document.getElementById("achMenu");
  if (box) box.classList.toggle("expanded");
  if (box && box.classList.contains("expanded")) renderMenuAchievements();
}

function renderMenuAchievements() {
  const el = document.getElementById("achMenuContent");
  if (!el) return;
  const rec = loadRecords();
  const unlocked = Object.keys(rec.achievements || {});
  el.innerHTML = ACHIEVEMENTS.map(a => {
    const got = unlocked.includes(a.id);
    return `<div class="ach-item ${got?"":"locked"}">${got?"✅":"🔒"} ${a.name}</div>`;
  }).join("");
  const label = document.getElementById("achCountLabel");
  if (label) label.textContent = ACHIEVEMENTS.length;
}

function endGame(customMessage) {
  if (S._ended) return;
  S._ended = true;

  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("finalScreen").classList.remove("hidden");

  const totalScore = Math.round(
    Math.min(100, num(S.money)*0.35) + num(S.health)*0.2 + num(S.happiness)*0.2 + num(S.education)*0.1 + num(S.socialOpinion)*0.1 + num(S.mental)*0.05
  );

  checkAchievements();

  try {
    const rec = loadRecords();
    rec.totalGames = (rec.totalGames || 0) + 1;
    if (totalScore > rec.bestScore) {
      rec.bestScore = totalScore;
      rec.bestCountry = `${S.flag} ${S.country}`;
      rec.bestGender = S.gender === "male" ? "👦" : "👧";
    }
    if (num(S.age) > rec.bestAge) rec.bestAge = num(S.age);
    GLOBAL_ACHIEVEMENTS.forEach(id => { rec.achievements[id] = true; });
    saveRecords(rec);
  } catch(e) {}

  const recNow = loadRecords();

  let title, desc;
  if (customMessage) { 
    title = "💔 Жизнь оборвалась"; 
    desc = customMessage; 
  }
  else {
    let rank;
    if (totalScore >= 90) rank = "🌟 Легендарная жизнь";
    else if (totalScore >= 70) rank = "🏆 Очень успешная жизнь";
    else if (totalScore >= 50) rank = "😊 Достойная жизнь";
    else if (totalScore >= 30) rank = "😐 Обычная жизнь";
    else rank = "💔 Непростая судьба";
    title = rank;
    desc = `${S.name} прожил(а) ${S.age} лет в ${S.flag} ${S.country}.`;
  }

  document.getElementById("finalTitle").textContent = title;
  document.getElementById("finalDesc").innerHTML = desc;

  const profLabels = { doctor:"🏥 Врач", police:"👮 Полицейский", lawyer:"⚖️ Юрист", economist:"📊 Экономист", teacher:"📚 Учитель", tutor:"📖 Репетитор", no_study:"🚫 Не учился", janitor:"🧹 Дворник", cleaner:"🧽 Уборщик", homeless:"🏚️ Бездомный", prostitution:"💃 18+", loader:"📦 Грузчик" };
  let profStr = S.profession ? (profLabels[S.profession] || S.profession) : "не выбрана";
  if (S.careerLevel > 0) profStr += ` (уровень ${S.careerLevel})`;

  const statsHtml = `
    <div class="stat-row"><span>Имя</span><b>${S.name}</b></div>
    <div class="stat-row"><span>Страна</span><b>${S.flag} ${S.country}${S.emigrated?" (эмигрант)":""}</b></div>
    ${S.isMixed ? `<div class="stat-row"><span>Семья</span><b>🌍 Смешанная (${S.motherCountry} + ${S.fatherCountry})</b></div>` : ""}
    ${S.isSingleParent ? `<div class="stat-row"><span>Семья</span><b>👤 Один родитель</b></div>` : ""}
    ${S.isSameSexParents ? `<div class="stat-row"><span>Семья</span><b>👬 Однополая пара</b></div>` : ""}
    ${S.hereditaryDisease ? `<div class="stat-row"><span>Наследственность</span><b>⚠️ ${S.hereditaryDisease}</b></div>` : ""}
    <div class="stat-row"><span>Профессия</span><b>${profStr}</b></div>
    <div class="stat-row"><span>Армия</span><b>${S.servedArmy ? "служил " + S.armyYears + " лет" : (S.usedFlags && S.usedFlags.dodgedArmy ? "косил" : "не служил")}</b></div>
    <div class="stat-row"><span>Тип личности</span><b>${S.personality||"не сформировался"}</b></div>
    <div class="stat-row"><span>Партнёр</span><b>${S.hasPartner ? "есть" : "нет"}</b></div>
    <div class="stat-row"><span>Дети</span><b>${S.children > 0 ? S.children : "нет"}</b></div>
    <div class="stat-row"><span>Бизнес</span><b>${S.businessLevel > 0 ? "уровень " + S.businessLevel : "нет"}</b></div>
    <div class="stat-row"><span>Зависимость</span><b>${S.addiction > 0 ? S.addiction + "%" : "нет"}</b></div>
    <div class="stat-row"><span>Долг</span><b>${S.debt > 0 ? S.debt : "нет"}</b></div>
    <div class="stat-row"><span>ЗППП</span><b>${S.hasSTD ? "да" : "нет"}</b></div>
    <div class="stat-row"><span>Бесплодие</span><b>${S.isInfertile ? "да" : "нет"}</b></div>
    <div class="stat-row"><span>Травмы</span><b>${S.traumas.length ? S.traumas.length : "нет"}</b></div>
    <div class="stat-row"><span>💰 Деньги</span><b>${S.money}</b></div>
    <div class="stat-row"><span>❤️ Здоровье</span><b>${S.health}%</b></div>
    <div class="stat-row"><span>😊 Счастье</span><b>${S.happiness}%</b></div>
    <div class="stat-row"><span>🎓 Образование</span><b>${S.education}%</b></div>
    <div class="stat-row"><span>👥 Соц.мнение</span><b>${S.socialOpinion}%</b></div>
    <div class="stat-row"><span>🧠 Психика</span><b>${S.mental}%</b></div>
    <div class="stat-row"><span>💄 Красота</span><b>${S.beauty}%</b></div>
    <div class="stat-row"><span>🕊️ Вера</span><b>${S.faith}%</b></div>
    <div class="stat-row"><span>🏅 Итоговый счёт</span><b>${totalScore} / 100</b></div>
  `;
  document.getElementById("finalStats").innerHTML = statsHtml;

  const allUnlocked = [...new Set([
    ...Object.keys(recNow.achievements || {}),
    ...GLOBAL_ACHIEVEMENTS
  ])];

  try {
    allUnlocked.forEach(id => { recNow.achievements[id] = true; });
    saveRecords(recNow);
  } catch(e) {}

  document.getElementById("achTitle").textContent = `Достижения (${allUnlocked.length}/${ACHIEVEMENTS.length})`;
  
  const achContent = document.getElementById("achContent");
  achContent.innerHTML = ACHIEVEMENTS.map(a => {
    const got = allUnlocked.includes(a.id);
    const inThisLife = GLOBAL_ACHIEVEMENTS.has(a.id);
    const mark = got ? (inThisLife?"✅":"☑️") : "🔒";
    return `<div class="ach-item ${got?"":"locked"}">${mark} ${a.name}</div>`;
  }).join("");

  renderRecords("recordsBoxFinal");
}

function downloadLifeSummary() {
  const totalScore = Math.round(
    Math.min(100, num(S.money)*0.35) + num(S.health)*0.2 + num(S.happiness)*0.2 + num(S.education)*0.1 + num(S.socialOpinion)*0.1 + num(S.mental)*0.05
  );
  
  const profLabels = { doctor:"Врач", police:"Полицейский", lawyer:"Юрист", economist:"Экономист", teacher:"Учитель", tutor:"Репетитор", no_study:"Не учился", janitor:"Дворник", cleaner:"Уборщик", homeless:"Бездомный", prostitution:"Работа 18+", loader:"Грузчик" };
  const profStr = S.profession ? (profLabels[S.profession] || S.profession) : "Не выбрана";
  
  const achievements = ACHIEVEMENTS.filter(a => GLOBAL_ACHIEVEMENTS.has(a.id)).map(a => a.name);
  
  let text = `===========================================
       ИТОГИ ЖИЗНИ: ${S.name.toUpperCase()}
===========================================
Возраст смерти: ${S.age} лет
Страна: ${S.flag} ${S.country}${S.emigrated ? " (эмигрант)" : ""}
${S.isMixed ? `Смешанная семья: Мать — ${S.motherCountry}, Отец — ${S.fatherCountry}\n` : ""}${S.isSingleParent ? `Воспитывал(а) один родитель\n` : ""}${S.isSameSexParents ? `Однополая семья\n` : ""}${S.hereditaryDisease ? `Наследственность: ${S.hereditaryDisease}\n` : ""}
Профессия: ${profStr}
Итоговый счёт: ${totalScore} / 100

-------------------------------------------
           ОСНОВНЫЕ ХАРАКТЕРИСТИКИ
-------------------------------------------
Деньги:        ${S.money}
Здоровье:      ${S.health}%
Счастье:       ${S.happiness}%
Образование:   ${S.education}%
Соц. мнение:   ${S.socialOpinion}%
Психика:       ${S.mental}%
Красота:       ${S.beauty}%
Вера:          ${S.faith}%
Языки:         ${S.languages}

-------------------------------------------
              ЛИЧНАЯ ЖИЗНЬ
-------------------------------------------
Партнёр:       ${S.hasPartner ? "Есть" : "Нет"}
Дети:          ${S.children > 0 ? S.children : "Нет"}
${S.isInfertile ? "Бесплодие:     Да\n" : ""}${S.hasSTD ? "ЗППП:          Да\n" : ""}
Армия:         ${S.servedArmy ? "Служил " + S.armyYears + " лет" : (S.usedFlags && S.usedFlags.dodgedArmy ? "Косил" : "Не служил")}
Бизнес:        ${S.businessLevel > 0 ? "Уровень " + S.businessLevel : "Нет"}
Зависимость:   ${S.addiction > 0 ? S.addiction + "%" : "Нет"}
Долг:          ${S.debt > 0 ? S.debt : "Нет"}
Травмы:        ${S.traumas.length > 0 ? S.traumas.length : "Нет"}

-------------------------------------------
              ДОСТИЖЕНИЯ (${achievements.length})
-------------------------------------------
${achievements.length > 0 ? achievements.map(a => "• " + a).join("\n") : "Нет достижений"}

===========================================
      Сгенерировано в симуляторе "Жизнь"
===========================================`;

  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `Жизнь_${S.name}_${S.age}лет.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function restart() {
  document.getElementById("finalScreen").classList.add("hidden");
  document.getElementById("nameScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");
  renderRecords("recordsBox");
  renderMenuAchievements();
  PREVIEW = null;
  S = {};
  STAGES_CACHE = [];
  PENDING_EDGE = false;
  const box = document.getElementById("achBox");
  if (box) box.classList.remove("expanded");
}

document.addEventListener("DOMContentLoaded", () => {
  renderRecords("recordsBox");
  renderMenuAchievements();
});
</script>
</body>
</html>
