<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Торговец Эпох</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { 
    font-family: 'Segoe UI', system-ui, sans-serif; 
    background: radial-gradient(circle at 50% 0%, #1a1a2e, #0f0f1a 70%); 
    color: #e8e8f0; 
    min-height: 100vh; 
    display: flex; 
    justify-content: center; 
    padding: 16px; 
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    overflow-x: hidden; 
  }
  .game { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 14px; position: relative; }
  .game.warping { animation: gameWarp .7s cubic-bezier(.2,.8,.2,1); }
  @keyframes gameWarp { 0% { transform: scale(1) translateX(0); filter: blur(0); } 25% { transform: scale(.96) translateX(-12px); filter: blur(3px); } 55% { transform: scale(1.03) translateX(14px); filter: blur(3px); } 100% { transform: scale(1) translateX(0); filter: blur(0); } }
  .topbar { display: flex; align-items: center; justify-content: center; position: relative; }
  h1 { font-size: 1.6rem; letter-spacing: 2px; background: linear-gradient(90deg, #ffd166, #ef476f, #06d6a0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #settingsBtn { position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: #16213e; border: 1px solid #2a3a5e; color: #e8e8f0; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; transition: transform .3s; }
  #settingsBtn:hover { transform: translateY(-50%) rotate(45deg); }
  
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .card { background: #16213e; border: 1px solid #2a3a5e; border-radius: 12px; padding: 10px 12px; }
  .card .label { font-size: .7rem; color: #8a95b5; text-transform: uppercase; letter-spacing: 1px; }
  .card .value { font-size: 1.35rem; font-weight: 700; margin-top: 2px; }
  .gold { color: #ffd166; } .record { color: #b8a3ff; } .stability { color: #06d6a0; }
  .stability.warn { color: #ff9f1c; } .stability.danger { color: #ef476f; }
  .bar { height: 8px; background: #0f0f1a; border-radius: 6px; margin-top: 8px; overflow: hidden; }
  .bar > div { height: 100%; width: 100%; background: linear-gradient(90deg, #ef476f, #ffd166, #06d6a0); transition: width .35s ease; }
  
  .era { text-align: center; font-size: 1.15rem; padding: 10px; background: linear-gradient(90deg, #16213e, #1f2a44, #16213e); border-radius: 12px; border: 1px solid #2a3a5e; position: relative; overflow: hidden; }
  .era small { display: block; color: #8a95b5; font-size: .75rem; margin-top: 2px; }
  
  .inventory { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .slot { background: #0f0f1a; border: 1px dashed #2a3a5e; border-radius: 12px; padding: 10px 12px; min-height: 64px; display: flex; flex-direction: column; justify-content: center; }
  .slot.filled { border-style: solid; border-color: #4a5a8e; background: #16213e; }
  .slot-label { font-size: .7rem; color: #5a6488; text-transform: uppercase; letter-spacing: 1px; }
  .slot-good { font-weight: 700; margin-top: 2px; }
  .slot-meta { font-size: .8rem; color: #8a95b5; margin-top: 2px; }
  .slot-profit { color: #06d6a0; } .slot-loss { color: #ef476f; }
  
  .goods { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; min-height: 80px; }
  .good { background: #16213e; border: 1px solid #2a3a5e; border-radius: 12px; padding: 12px; cursor: pointer; transition: transform .12s, border-color .2s, background .2s; user-select: none; }
  .good:hover { transform: translateY(-2px); border-color: #4a5a8e; }
  .good.selected { border-color: #ffd166; background: #1e2a4a; }
  .good.dimmed { opacity: .75; }
  .good .name { font-weight: 600; }
  .good .price { color: #8a95b5; font-size: .85rem; margin-top: 4px; }
  .good .trend { font-size: .75rem; margin-top: 2px; }
  .up { color: #06d6a0; } .down { color: #ef476f; }
  
  .actions { display: flex; gap: 10px; }
  button { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: filter .15s, transform .1s; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn-buy { background: #06d6a0; color: #04221a; }
  .btn-sell { background: #ffd166; color: #2a1f04; }
  .btn-travel { background: #ef476f; color: #fff; }
  .btn-buy:hover:not(:disabled), .btn-sell:hover:not(:disabled), .btn-travel:hover:not(:disabled) { filter: brightness(1.1); }
  
  .log { background: #0f0f1a; border: 1px solid #2a3a5e; border-radius: 12px; padding: 10px 12px; height: 110px; overflow-y: auto; font-size: .85rem; line-height: 1.5; color: #b8c0d8; }
  .log p { margin-bottom: 2px; }
  .log .gain { color: #06d6a0; } .log .loss { color: #ef476f; } .log .info { color: #ffd166; }
  .log .time { color: #5a6488; margin-right: 6px; }
  .hint { text-align: center; font-size: .8rem; color: #5a6488; }
  
  .overlay { position: fixed; inset: 0; background: rgba(8, 8, 16, .85); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; backdrop-filter: blur(4px); }
  .overlay .panel { background: #16213e; border: 1px solid #2a3a5e; border-radius: 16px; padding: 24px; max-width: 420px; width: 100%; max-height: 90vh; overflow-y: auto; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .overlay h2 { margin-bottom: 16px; font-size: 1.5rem; }
  .overlay p { color: #b8c0d8; margin-bottom: 20px; line-height: 1.6; }
  .record-line { color: #b8a3ff; font-weight: 700; }
  .hidden { display: none !important; }
  
  .slider-container { display: flex; align-items: center; gap: 15px; margin: 15px 0; }
  .slider-container span { font-size: 1.5rem; }
  input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: #0f0f1a; border-radius: 4px; border: 1px solid #2a3a5e; }
  input[type=range]::-webkit-slider-thumb { height: 24px; width: 24px; border-radius: 50%; background: #06d6a0; cursor: pointer; -webkit-appearance: none; margin-top: -9px; box-shadow: 0 0 10px rgba(6, 214, 160, 0.5); transition: transform 0.1s; }
  input[type=range]::-moz-range-track { width: 100%; height: 8px; cursor: pointer; background: #0f0f1a; border-radius: 4px; border: 1px solid #2a3a5e; }
  input[type=range]::-moz-range-thumb { height: 24px; width: 24px; border-radius: 50%; background: #06d6a0; cursor: pointer; border: none; box-shadow: 0 0 10px rgba(6, 214, 160, 0.5); }
  
  /* Магазин */
  .shop-item { display: flex; align-items: center; justify-content: space-between; background: #0f0f1a; border: 1px solid #2a3a5e; border-radius: 12px; padding: 12px; margin-bottom: 10px; gap: 10px; }
  .shop-info { text-align: left; flex: 1; }
  .shop-name { font-weight: 700; font-size: 1.05rem; }
  .shop-desc { font-size: .8rem; color: #8a95b5; margin-top: 2px; }
  .shop-btn { flex: none; padding: 10px 15px; width: auto; background: #ffd166; color: #2a1f04; font-size: .9rem; }
  .shop-btn.owned { background: #06d6a0; color: #04221a; cursor: default; }
  
  #warpCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 9; opacity: 0; transition: opacity .15s; }
  #warpCanvas.active { opacity: 1; }
  
  /* Мобильная оптимизация */
  @media (max-width: 600px) {
    body { padding: 8px; }
    .game { gap: 8px; }
    h1 { font-size: 1.3rem; }
    .stats { gap: 6px; }
    .card { padding: 8px; }
    .card .label { font-size: .6rem; }
    .card .value { font-size: 1.1rem; }
    .era { padding: 8px; font-size: 1rem; }
    .era small { font-size: .65rem; }
    .inventory { gap: 6px; }
    .slot { padding: 8px; min-height: 56px; }
    .slot-label { font-size: .6rem; }
    .slot-good { font-size: .85rem; }
    .slot-meta { font-size: .7rem; }
    .goods { grid-template-columns: 1fr 1fr; gap: 8px; }
    .good { padding: 8px; }
    .good .name { font-size: .85rem; }
    .good .price { font-size: .75rem; }
    .good .trend { font-size: .65rem; }
    .actions { flex-direction: column; gap: 8px; }
    button { padding: 12px; font-size: .95rem; }
    .overlay .panel { padding: 20px; }
    .shop-item { padding: 10px; }
    .shop-name { font-size: .95rem; }
    .shop-desc { font-size: .75rem; }
    .shop-btn { padding: 8px 12px; font-size: .8rem; }
  }
</style>
</head>
<body>

<canvas id="warpCanvas"></canvas>

<div class="game" id="game">
  <div class="topbar">
    <h1>⏳ ТОРГОВЕЦ ЭПОХ</h1>
    <button id="settingsBtn" title="Настройки">⚙️</button>
  </div>

  <div class="stats">
    <div class="card"><div class="label">Капитал</div><div class="value gold" id="gold">100</div></div>
    <div class="card"><div class="label">Рекорд</div><div class="value record" id="record">100</div></div>
    <div class="card">
      <div class="label">Стабильность</div>
      <div class="value stability" id="stability">100%</div>
      <div class="bar"><div id="stabilityBar"></div></div>
    </div>
  </div>

  <div class="era" id="era">Каменный век<small>Здесь всё дёшево, но продать некому...</small></div>

  <div class="inventory" id="inventory"></div>

  <div class="goods" id="goods"></div>

  <div class="actions">
    <button class="btn-buy" id="buyBtn" disabled>Купить</button>
    <button class="btn-sell" id="sellBtn" disabled>Продать</button>
    <button class="btn-travel" id="travelBtn">В другую эпоху</button>
  </div>

  <div class="log" id="log"></div>
  <div class="hint">Выбери товар → Купить → «В другую эпоху» → Продать</div>
</div>

<!-- Меню настроек -->
<div class="overlay hidden" id="settingsOverlay">
  <div class="panel">
    <h2>⚙️ Настройки</h2>
    <div class="slider-container">
      <span id="volumeIcon">🔊</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="100">
    </div>
    <button class="btn-buy" id="openShopBtn" style="width:100%; margin-top:10px;">🎒 Магазин рюкзаков</button>
    <button class="btn-travel" id="closeSettingsBtn" style="width:100%; margin-top:10px;">Закрыть</button>
  </div>
</div>

<!-- Магазин -->
<div class="overlay hidden" id="shopOverlay">
  <div class="panel">
    <h2>🎒 Магазин рюкзаков</h2>
    <p style="font-size: .85rem; margin-bottom: 15px; color: #8a95b5;">Больше слотов — больше товаров можно унести за раз.</p>
    <div id="shopItems"></div>
    <button class="btn-travel" id="closeShopBtn" style="width:100%; margin-top:15px;">Закрыть магазин</button>
  </div>
</div>

<!-- Финал -->
<div class="overlay hidden" id="overlay">
  <div class="panel">
    <h2 id="ovTitle">Конец</h2>
    <p id="ovText"></p>
    <p class="record-line" id="ovRecord"></p>
    <button class="btn-travel" id="restartBtn" style="width:100%; margin-top:16px;">Начать заново</button>
  </div>
</div>

<script>
/* ============================================================
   НАСТРОЙКИ И ЗВУК
   ============================================================ */
const Settings = {
  volume: 1.0,
  load() {
    try {
      const v = localStorage.getItem("eraTrader.volume");
      if (v !== null) this.volume = Number(v);
      if (isNaN(this.volume)) this.volume = 1.0;
    } catch {}
    const slider = document.getElementById("volumeSlider");
    if (slider) slider.value = this.volume * 100;
    this.updateIcon();
  },
  save() { try { localStorage.setItem("eraTrader.volume", this.volume); } catch {} },
  set(v) { this.volume = v / 100; this.updateIcon(); this.save(); },
  updateIcon() {
    const icon = document.getElementById("volumeIcon");
    if (icon) icon.textContent = this.volume === 0 ? "🔇" : this.volume < 0.5 ? "🔉" : "🔊";
  }
};
Settings.load();

const Sound = (() => {
  let ctx = null;
  function init() {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ctx = new AC(); }
    if (ctx && ctx.state === "suspended") ctx.resume();
  }
  function tone(freq, dur, type = "sine", vol = 0.15, slideTo = null) {
    if (Settings.volume === 0) return;
    if (!ctx) init(); if (!ctx) return;
    const t = ctx.currentTime, osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol * Settings.volume, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.1) {
    if (Settings.volume === 0) return;
    if (!ctx) init(); if (!ctx) return;
    const t = ctx.currentTime, buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
    const src = ctx.createBufferSource(); src.buffer = buffer;
    const filter = ctx.createBiquadFilter(); filter.type = "bandpass"; filter.frequency.value = 800;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(vol * Settings.volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(filter).connect(gain).connect(ctx.destination);
    src.start(t);
  }
  return {
    click() { init(); tone(660, 0.06, "square", 0.08); },
    buy() { init(); tone(520, 0.12, "triangle", 0.18); setTimeout(() => tone(780, 0.15, "triangle", 0.15), 80); },
    sell() { init(); tone(780, 0.1, "sine", 0.18); setTimeout(() => tone(1040, 0.18, "sine", 0.15), 70); },
    error() { init(); tone(180, 0.2, "sawtooth", 0.12); },
    warp() { init(); tone(200, 0.6, "sawtooth", 0.12, 1200); noise(0.5, 0.06); },
    paradox() { init(); noise(0.4, 0.15); tone(120, 0.4, "sawtooth", 0.15, 60); },
    win() { init(); [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.25, "triangle", 0.18), i * 120)); },
    lose() { init(); [400, 300, 200, 100].forEach((f, i) => setTimeout(() => tone(f, 0.3, "sawtooth", 0.15), i * 130)); },
    shop() { init(); tone(440, 0.1, "sine", 0.15); setTimeout(() => tone(880, 0.2, "sine", 0.15), 100); }
  };
})();

/* ============================================================
   ДАННЫЕ И ХРАНИЛИЩЕ
   ============================================================ */
const ERAS = [
  { name: "Каменный век", desc: "Всё дёшево, но продать некому...", mult: 0.5 },
  { name: "Античность", desc: "Расцвет торговли и амфор.", mult: 1.0 },
  { name: "Средневековье", desc: "Гильдии, ярмарки, чума.", mult: 1.3 },
  { name: "Индустриальная эпоха", desc: "Пар, сталь, конвейер.", mult: 1.8 },
  { name: "Будущее", desc: "Нанотехнологии и сингулярность.", mult: 2.6 },
];
const GOODS = [
  { id: "herbs", name: "Травы", base: 8 },
  { id: "cloth", name: "Ткани", base: 15 },
  { id: "spice", name: "Специи", base: 22 },
  { id: "weapon", name: "Оружие", base: 35 },
  { id: "gems", name: "Самоцветы", base: 55 },
  { id: "relic", name: "Реликвия", base: 80 },
];
const SHOP_ITEMS = [
  { id: "bag1", name: "Мешок", slots: 3, price: 150, desc: "Вмещает 3 товара" },
  { id: "bag2", name: "Рюкзак", slots: 4, price: 400, desc: "Вмещает 4 товара" },
  { id: "bag3", name: "Сумка торговца", slots: 5, price: 900, desc: "Вмещает 5 товаров" },
  { id: "bag4", name: "Пространственный карман", slots: 6, price: 2000, desc: "Вмещает 6 товаров" },
];
const WIN_GOLD = 5000, RECORD_KEY = "eraTrader.record", BAG_KEY = "eraTrader.bag";

const Store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v !== null && !isNaN(Number(v)) ? Number(v) : fallback; } catch { return fallback; }
  },
  set(key, value) { try { localStorage.setItem(key, String(value)); } catch {} },
  getStr(key, fallback) {
    try { const v = localStorage.getItem(key); return v !== null ? v : fallback; } catch { return fallback; }
  }
};
function loadRecord() { return Store.get(RECORD_KEY, 100); }
function saveRecord(v) { if (typeof v === 'number') Store.set(RECORD_KEY, v); }
function loadBag() { return Store.getStr(BAG_KEY, ""); }
function saveBag(id) { try { localStorage.setItem(BAG_KEY, id); } catch {} }

function getMaxSlots() {
  const bagId = loadBag();
  if (!bagId) return 2;
  const bag = SHOP_ITEMS.find(b => b.id === bagId);
  return bag ? bag.slots : 2;
}

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
let state;
function resetState() {
  state = { gold: 100, stability: 100, eraIndex: 0, inventory: [], selected: null, prices: {}, events: [], turn: 0, over: false, warping: false };
  rollPrices();
}
function eraMult() { return ERAS[state.eraIndex].mult; }
function rollPrices() {
  state.prices = {};
  for (const g of GOODS) {
    let price = g.base * eraMult() * (0.6 + Math.random() * 0.9);
    for (const ev of state.events) if (ev.good === g.id) price *= ev.mult;
    state.prices[g.id] = Math.max(1, Math.round(price));
  }
}
function rollEvent() {
  const pool = [
    { text: "Вспышка чумы — травы в цене!", good: "herbs", mult: 2.2 },
    { text: "Война — оружие дорожает!", good: "weapon", mult: 2.0 },
    { text: "Мода на специи!", good: "spice", mult: 1.8 },
    { text: "Найдена шахта — самоцветы дешевеют.", good: "gems", mult: 0.5 },
    { text: "Пираты на торговых путях — ткани дорожают.", good: "cloth", mult: 1.7 },
    { text: "Обнаружена древняя реликвия — рынок наводнён.", good: "relic", mult: 0.45 },
  ];
  const ev = pool[Math.floor(Math.random() * pool.length)];
  state.events = [ev]; log(ev.text, "info");
}

/* ============================================================
   МАГАЗИН
   ============================================================ */
function renderShop() {
  const container = document.getElementById("shopItems");
  if (!container) return;
  container.innerHTML = "";
  const currentBagId = loadBag();
  
  SHOP_ITEMS.forEach(item => {
    const isOwned = currentBagId === item.id;
    const currentIdx = SHOP_ITEMS.findIndex(b => b.id === currentBagId);
    const thisIdx = SHOP_ITEMS.findIndex(b => b.id === item.id);
    const isBetterOwned = currentIdx >= thisIdx && !isOwned;

    const div = document.createElement("div");
    div.className = "shop-item";
    div.innerHTML = `
      <div class="shop-info">
        <div class="shop-name">${item.name}</div>
        <div class="shop-desc">${item.desc}</div>
      </div>
      <button class="shop-btn ${isOwned ? 'owned' : ''}" data-id="${item.id}" ${isOwned || isBetterOwned ? 'disabled' : ''}>
        ${isOwned ? 'Куплено' : (isBetterOwned ? 'Не нужно' : item.price + ' 💰')}
      </button>
    `;
    
    if (!isOwned && !isBetterOwned) {
      const btn = div.querySelector("button");
      btn.onclick = () => buyBag(item);
    }
    container.appendChild(div);
  });
}

function buyBag(item) {
  if (state.gold < item.price) { Sound.error(); log("Недостаточно капитала для покупки!", "loss"); return; }
  state.gold -= item.price;
  saveBag(item.id);
  Sound.shop();
  log(`Куплен ${item.name}! Теперь доступно ${item.slots} слота.`, "gain");
  renderShop(); 
  render();
}

/* ============================================================
   ДЕЙСТВИЯ ИГРЫ
   ============================================================ */
function selectGood(id) {
  if (state.over || state.warping) return;
  Sound.click();
  if (state.inventory.length >= getMaxSlots()) { state.selected = null; render(); return; }
  state.selected = (state.selected === id) ? null : id; render();
}

function buy() {
  if (state.over || state.warping || !state.selected) return;
  if (state.inventory.length >= getMaxSlots()) return;
  const price = state.prices[state.selected];
  if (!price) return;
  if (state.gold < price) { Sound.error(); log("Недостаточно капитала!", "loss"); return; }
  state.gold -= price;
  state.inventory.push({ goodId: state.selected, buyPrice: price });
  Sound.buy(); log(`Куплено: ${goodName(state.selected)} за ${price}`, "info");
  state.selected = null; render();
}

function sell() {
  if (state.over || state.warping || state.inventory.length === 0) return;
  let totalProfit = 0, totalRevenue = 0; const sold = [];
  for (const item of state.inventory) {
    const sellPrice = state.prices[item.goodId] ?? item.buyPrice;
    const profit = sellPrice - item.buyPrice;
    totalRevenue += sellPrice; totalProfit += profit;
    sold.push({ ...item, sellPrice, profit });
  }
  state.gold += totalRevenue; state.inventory = [];
  for (const s of sold) {
    if (s.profit > 0) log(`Продано: ${goodName(s.goodId)} за ${s.sellPrice} (+${s.profit})`, "gain");
    else log(`Продано: ${goodName(s.goodId)} за ${s.sellPrice} (${s.profit})`, "loss");
  }
  Sound.sell();
  const risk = Math.min(25, Math.abs(totalProfit) / 5);
  if (Math.random() * 100 < risk) {
    const dmg = 5 + Math.floor(Math.random() * 11); state.stability -= dmg;
    Sound.paradox(); log(`⚡ Парадокс! Временная линия пострадала (-${dmg}%)`, "loss");
  }
  checkEnd(); render();
}

// НОВАЯ ФУНКЦИЯ: Продажа конкретного слота
function sellSlot(index) {
  if (state.over || state.warping) return;
  const item = state.inventory[index];
  if (!item) return;

  const sellPrice = state.prices[item.goodId] ?? item.buyPrice;
  const profit = sellPrice - item.buyPrice;
  
  state.gold += sellPrice;
  state.inventory.splice(index, 1); // Удаляем только этот предмет
  
  if (profit > 0) log(`Продано: ${goodName(item.goodId)} за ${sellPrice} (+${profit})`, "gain");
  else log(`Продано: ${goodName(item.goodId)} за ${sellPrice} (${profit})`, "loss");
  
  Sound.sell();
  
  const risk = Math.min(25, Math.abs(profit) / 5);
  if (Math.random() * 100 < risk) {
    const dmg = 5 + Math.floor(Math.random() * 11); 
    state.stability -= dmg;
    Sound.paradox(); 
    log(`⚡ Парадокс! Временная линия пострадала (-${dmg}%)`, "loss");
  }
  
  checkEnd(); render();
}

function travel() {
  if (state.over || state.warping) return;
  state.warping = true; state.turn++; state.stability -= 1;
  state.eraIndex = (state.eraIndex + 1) % ERAS.length;
  state.events = []; if (Math.random() < 0.55) rollEvent(); rollPrices();
  Sound.warp();
  runWarpAnimation(() => { state.warping = false; checkEnd(); render(); });
}

function checkEnd() {
  if (state.over) return;
  const rec = Math.max(loadRecord(), state.gold);
  if (state.gold > loadRecord()) saveRecord(state.gold);
  if (state.stability <= 0) {
    state.stability = 0; state.over = true; Sound.lose();
    showOverlay("⏳ Время не прощает", `Парадоксы разрушили временную линию. Итоговый капитал: ${state.gold}.`, `Рекорд: ${rec}`);
  } else if (state.gold >= WIN_GOLD) {
    state.over = true; Sound.win();
    showOverlay("🏆 Торговец Эпох!", `Ты сколотил состояние в ${state.gold} и сохранил стабильность на ${state.stability}%.`, `Рекорд: ${rec}`);
  }
}

/* ============================================================
   АНИМАЦИЯ ПРЫЖКА
   ============================================================ */
const warpCanvas = document.getElementById("warpCanvas"), wctx = warpCanvas.getContext("2d");
let warpRAF = null;
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  warpCanvas.width = window.innerWidth * dpr; warpCanvas.height = window.innerHeight * dpr;
  warpCanvas.style.width = window.innerWidth + "px"; warpCanvas.style.height = window.innerHeight + "px";
  wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resizeCanvas); resizeCanvas();
function runWarpAnimation(onDone) {
  const game = document.getElementById("game");
  game.classList.remove("warping"); void game.offsetWidth; game.classList.add("warping");
  warpCanvas.classList.add("active");
  const W = window.innerWidth, H = window.innerHeight, cx = W / 2, cy = H / 2;
  const start = performance.now(), DURATION = 650, streaks = [];
  for (let i = 0; i < 70; i++) {
    streaks.push({ angle: Math.random() * Math.PI * 2, radius: 40 + Math.random() * 80, speed: 8 + Math.random() * 14, length: 20 + Math.random() * 60, width: 1 + Math.random() * 2.5, hue: Math.random() < 0.5 ? "#ffd166" : "#ef476f", alpha: 0.6 + Math.random() * 0.4 });
  }
  function frame(now) {
    const t = Math.min(1, (now - start) / DURATION);
    const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    wctx.clearRect(0, 0, W, H);
    const dim = Math.sin(t * Math.PI) * 0.25;
    wctx.fillStyle = `rgba(15,15,26,${dim})`; wctx.fillRect(0, 0, W, H);
    for (const s of streaks) {
      s.radius += s.speed * (1 + ease * 3);
      const x1 = cx + Math.cos(s.angle) * s.radius, y1 = cy + Math.sin(s.angle) * s.radius;
      const x2 = cx + Math.cos(s.angle) * (s.radius + s.length * (1 + ease * 2)), y2 = cy + Math.sin(s.angle) * (s.radius + s.length * (1 + ease * 2));
      wctx.strokeStyle = s.hue; wctx.globalAlpha = s.alpha * (1 - t * 0.7); wctx.lineWidth = s.width; wctx.lineCap = "round";
      wctx.beginPath(); wctx.moveTo(x1, y1); wctx.lineTo(x2, y2); wctx.stroke();
    }
    wctx.globalAlpha = 1;
    if (t < 1) { warpRAF = requestAnimationFrame(frame); }
    else {
      wctx.clearRect(0, 0, W, H); warpCanvas.classList.remove("active"); game.classList.remove("warping");
      if (onDone) onDone();
    }
  }
  cancelAnimationFrame(warpRAF); warpRAF = requestAnimationFrame(frame);
}

/* ============================================================
   РЕНДЕР
   ============================================================ */
function goodName(id) { const g = GOODS.find(x => x.id === id); return g ? g.name : id; }
function log(text, cls = "") {
  const el = document.getElementById("log"); if (!el) return;
  const p = document.createElement("p"); p.className = cls;
  p.innerHTML = `<span class="time">[${state.turn}]</span>${text}`;
  el.appendChild(p); el.scrollTop = el.scrollHeight;
}

function render() {
  document.getElementById("gold").textContent = state.gold;
  const rec = Math.max(loadRecord(), state.gold);
  document.getElementById("record").textContent = rec;
  const st = document.getElementById("stability");
  st.textContent = state.stability + "%";
  st.className = "value stability " + (state.stability <= 25 ? "danger" : state.stability <= 50 ? "warn" : "");
  document.getElementById("stabilityBar").style.width = Math.max(0, state.stability) + "%";
  
  const era = ERAS[state.eraIndex];
  document.getElementById("era").innerHTML = `${era.name}<small>${era.desc}</small>`;
  
  // Динамический рендер слотов + КЛИКИ
  const maxSlots = getMaxSlots();
  const invEl = document.getElementById("inventory");
  invEl.innerHTML = "";
  
  for (let i = 0; i < maxSlots; i++) {
    const item = state.inventory[i];
    const slotEl = document.createElement("div");
    if (item) {
      const cur = state.prices[item.goodId] || item.buyPrice, profit = cur - item.buyPrice;
      const cls = profit >= 0 ? "slot-profit" : "slot-loss", sign = profit >= 0 ? "+" : "";
      slotEl.className = "slot filled";
      slotEl.innerHTML = `<div class="slot-label">Слот ${i + 1}</div><div class="slot-good">${goodName(item.goodId)}</div><div class="slot-meta">Куплено ${item.buyPrice} → ${cur} <span class="${cls}">(${sign}${profit})</span></div>`;
      
      // КЛИК ДЛЯ ПРОДАЖИ
      if (!state.over) {
        slotEl.style.cursor = "pointer";
        slotEl.onclick = () => sellSlot(i);
      }
    } else {
      slotEl.className = "slot";
      slotEl.innerHTML = `<div class="slot-label">Слот ${i + 1}</div><div class="slot-good">— пусто —</div>`;
    }
    invEl.appendChild(slotEl);
  }
  
  const goodsEl = document.getElementById("goods"); goodsEl.innerHTML = "";
  const invFull = state.inventory.length >= maxSlots;
  for (const g of GOODS) {
    const price = state.prices[g.id]; if (price == null) continue;
    const isSelected = state.selected === g.id, inInvCount = state.inventory.filter(it => it.goodId === g.id).length;
    const base = g.base * eraMult(), ratio = base > 0 ? Math.round((price / base) * 100) : 100;
    const trendCls = price >= base ? "up" : "down", trendTxt = price >= base ? "▲" : "▼";
    const div = document.createElement("div");
    div.className = "good" + (isSelected ? " selected" : "") + (invFull ? " dimmed" : "");
    div.innerHTML = `<div class="name">${g.name}${inInvCount ? " 📦×" + inInvCount : ""}</div><div class="price">Цена: ${price}</div><div class="trend ${trendCls}">${trendTxt} ${ratio}% от нормы</div>`;
    if (!state.over) div.onclick = () => selectGood(g.id);
    goodsEl.appendChild(div);
  }
  
  const buyBtn = document.getElementById("buyBtn");
  if (invFull) { buyBtn.textContent = "Сумка полна"; buyBtn.disabled = true; }
  else if (state.selected) {
    const price = state.prices[state.selected] || 0;
    buyBtn.textContent = `Купить за ${price}`; buyBtn.disabled = state.gold < price || state.over || state.warping;
  } else { buyBtn.textContent = "Выбери товар"; buyBtn.disabled = true; }
  
  const sellBtn = document.getElementById("sellBtn");
  if (state.inventory.length === 0) { sellBtn.textContent = "Нечего продавать"; sellBtn.disabled = true; }
  else {
    const total = state.inventory.reduce((s, it) => s + (state.prices[it.goodId] || 0), 0);
    sellBtn.textContent = `Продать всё (+${total})`; sellBtn.disabled = state.over || state.warping;
  }
  document.getElementById("travelBtn").disabled = state.over || state.warping;
}

function showOverlay(title, text, record) {
  document.getElementById("ovTitle").textContent = title; 
  document.getElementById("ovText").textContent = text;
  document.getElementById("ovRecord").textContent = record || ""; 
  document.getElementById("overlay").classList.remove("hidden");
}

/* ============================================================
   СОБЫТИЯ И ЗАПУСК
   ============================================================ */
document.getElementById("buyBtn").onclick = buy;
document.getElementById("sellBtn").onclick = sell;
document.getElementById("travelBtn").onclick = travel;

document.getElementById("restartBtn").onclick = () => {
  document.getElementById("overlay").classList.add("hidden");
  document.getElementById("log").innerHTML = "";
  resetState(); log("Новая временная линия. Удачи!", "info"); render();
};

document.getElementById("settingsBtn").onclick = () => {
  Sound.click(); document.getElementById("settingsOverlay").classList.remove("hidden");
};
document.getElementById("closeSettingsBtn").onclick = () => {
  Sound.click(); document.getElementById("settingsOverlay").classList.add("hidden");
};
document.getElementById("openShopBtn").onclick = () => {
  Sound.click(); 
  document.getElementById("settingsOverlay").classList.add("hidden");
  document.getElementById("shopOverlay").classList.remove("hidden");
  renderShop();
};
document.getElementById("closeShopBtn").onclick = () => {
  Sound.click(); document.getElementById("shopOverlay").classList.add("hidden");
};
document.getElementById("volumeSlider").oninput = (e) => {
  Settings.set(e.target.value);
  Sound.click();
};

// Инициализация
resetState();
log("Добро пожаловать! Купи товар, продай в другой эпохе.", "info");
render();
</script>
